<title>Thrive Command</title>
<meta name="description" content="Owner console for Thrive Companies — LOA production and Lead Tech fulfillment in one view.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ======================================================================
   Thrive Command — the owner console.

   The brand system is inherited wholesale from the Thrive LOA Producer
   Desk so the two read as one suite: same navy/sky palette, same
   Archivo + IBM Plex Mono pairing, same panel and pill vocabulary. What
   is new here is the cross-business layer — a console reads two P&Ls at
   once, so money tiles carry a source stripe and every figure says which
   side of the house it came from.
   ====================================================================== */

:root {
  color-scheme: light;
  --ink:      #0A0E13;
  --navy:     #0F2A4C;
  --navy-2:   #071A31;
  --navy-3:   #163A66;
  --sky:      #2F6FE0;
  --sky-soft: #E8F0FE;
  --paper:    #FFFFFF;
  --mist:     #F4F7FA;
  --mist-2:   #EBF0F6;
  --line:     #DCE3EC;
  --line-2:   #C6D1DF;
  --muted:    #64717F;
  --good:     #0F7A57;
  --good-bg:  #E2F4EC;
  --warn:     #9A6100;
  --warn-bg:  #FBEFD9;
  --bad:      #B8362B;
  --bad-bg:   #FBE7E4;
  --btn-bg:   #2F6FE0;
  --btn-fg:   #FFFFFF;
  --shadow:   0 1px 2px rgba(7,26,49,.06), 0 8px 24px rgba(7,26,49,.06);

  /* Chart tokens. Series colors validated with the dataviz validator:
     light #2a78d6/#eb6834/#1baf7a/#eda100/#4a3aa7 — worst adjacent CVD
     ΔE 9.1 (protan), normal-vision 22.9. Contrast on the green and
     amber sits under 3:1, so every slice and series is direct-labeled
     and every chart is backed by a table. */
  --s-loa:   #2a78d6;
  --s-lt:    #eb6834;
  --paid:    #1baf7a;
  --pipe:    #eda100;
  --fell:    #4a3aa7;
  --grid:    #E4EAF1;
  --axis:    #94A3B4;
  --loa-fill: rgba(42,120,214,.13);
  --lt-fill:  rgba(235,104,52,.11);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ink:      #E7EDF4;
    --navy:     #0D1D31;
    --navy-2:   #060C14;
    --navy-3:   #1C3352;
    --sky:      #74A6FF;
    --sky-soft: #14243B;
    --paper:    #0B1119;
    --mist:     #101822;
    --mist-2:   #16202C;
    --line:     #22303F;
    --line-2:   #2E4055;
    --muted:    #8A99AB;
    --good:     #45C79B;
    --good-bg:  #0E2A22;
    --warn:     #E0A44A;
    --warn-bg:  #2C2114;
    --bad:      #F08276;
    --bad-bg:   #2E1613;
    --btn-bg:   #3B7BE4;
    --btn-fg:   #FFFFFF;
    --shadow:   0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --s-loa:   #3987e5;
    --s-lt:    #d95926;
    --paid:    #199e70;
    --pipe:    #c98500;
    --fell:    #9085e9;
    --grid:    #1C2836;
    --axis:    #5D6E80;
    --loa-fill: rgba(57,135,229,.18);
    --lt-fill:  rgba(217,89,38,.16);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ink:      #E7EDF4;
  --navy:     #0D1D31;
  --navy-2:   #060C14;
  --navy-3:   #1C3352;
  --sky:      #74A6FF;
  --sky-soft: #14243B;
  --paper:    #0B1119;
  --mist:     #101822;
  --mist-2:   #16202C;
  --line:     #22303F;
  --line-2:   #2E4055;
  --muted:    #8A99AB;
  --good:     #45C79B;
  --good-bg:  #0E2A22;
  --warn:     #E0A44A;
  --warn-bg:  #2C2114;
  --bad:      #F08276;
  --bad-bg:   #2E1613;
  --btn-bg:   #3B7BE4;
  --btn-fg:   #FFFFFF;
  --shadow:   0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --s-loa:   #3987e5;
  --s-lt:    #d95926;
  --paid:    #199e70;
  --pipe:    #c98500;
  --fell:    #9085e9;
  --grid:    #1C2836;
  --axis:    #5D6E80;
  --loa-fill: rgba(57,135,229,.18);
  --lt-fill:  rgba(217,89,38,.16);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Archivo', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: var(--sky); }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; border-radius: 3px; }

.mono, .num { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-variant-numeric: tabular-nums; }
.eyebrow {
  font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--muted); margin: 0;
}

/* ---------- masthead ---------- */
.mast { background: var(--navy-2); color: #fff; }
.mast-in {
  max-width: 1320px; margin: 0 auto; padding: 18px 24px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
}
.wordmark { display: flex; align-items: stretch; gap: 13px; }
/* Two bars, not one: this console reads two businesses. */
.wordmark .bar { width: 4px; flex: 0 0 4px; border-radius: 2px; background: linear-gradient(var(--s-loa) 50%, var(--s-lt) 50%); }
.wordmark .lock { display: flex; flex-direction: column; justify-content: center; }
.wordmark h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.01em; color: #fff; text-wrap: balance; }
.wordmark p { margin: 2px 0 0; font-size: 11px; letter-spacing: .05em; color: #93AAC6; }
.mast-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.owner-chip {
  display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 5px; border-radius: 999px;
  background: rgba(116,166,255,.16); border: 1px solid rgba(116,166,255,.32); color: #BBD3FF;
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .06em;
}
.owner-chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--paid); flex: none; }
.mast .linkish { color: #9DB2CB; font-size: 12px; font-weight: 600; }
.mast .linkish:hover { color: #fff; }

/* ---------- sync strip ---------- */
/* Sits directly under the masthead because in a mirrored console the
   first question is always "how old is this?" */
.syncstrip { background: var(--navy); border-bottom: 1px solid rgba(255,255,255,.08); color: #C4D4E8; }
.syncstrip-in {
  max-width: 1320px; margin: 0 auto; padding: 7px 24px 8px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  font-size: 11.5px; font-family: 'IBM Plex Mono', monospace;
}
.syncstrip .src { display: inline-flex; align-items: center; gap: 7px; }
.syncstrip .src i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.syncstrip .src.loa i { background: var(--s-loa); }
.syncstrip .src.lt i { background: var(--s-lt); }
.syncstrip .src.stale b, .syncstrip .src.none b { color: #F2C77E; }
.syncstrip .src b { color: #fff; font-weight: 600; }
.syncstrip .spacer { flex: 1 1 auto; }

/* ---------- tab rail ---------- */
.rail { background: var(--navy-2); border-bottom: 1px solid rgba(255,255,255,.09); }
.rail-in { max-width: 1320px; margin: 0 auto; padding: 0 24px; display: flex; gap: 2px; overflow-x: auto; }
.rail button {
  padding: 10px 14px 11px; color: #9DB2CB; font-size: 12.5px; font-weight: 600;
  letter-spacing: .01em; border-bottom: 2px solid transparent; white-space: nowrap;
}
.rail button:hover { color: #DCE7F5; }
.rail button[aria-current="page"] { color: #fff; border-bottom-color: var(--sky); }
.rail .tab-badge {
  display: inline-block; margin-left: 7px; min-width: 18px; padding: 1px 5px 2px;
  border-radius: 999px; background: var(--bad); color: #fff;
  font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700;
  line-height: 1.3; text-align: center; vertical-align: 1px;
}

/* ---------- page shell ---------- */
.wrap { max-width: 1320px; margin: 0 auto; padding: 22px 24px 72px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h2 { margin: 3px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
.page-head .sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 66ch; }
.section-head { margin: 34px 0 16px; padding-top: 26px; border-top: 1px solid var(--line);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.section-head h3 { margin: 3px 0 0; font-size: 17px; font-weight: 700; letter-spacing: -.012em; }
.section-head .sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 70ch; line-height: 1.6; }
/* Period-on-period change, at the right-hand end of a section head. The
   figure carries the colour; the line under it says what it measures,
   because a bare percentage beside a title invites the wrong reading. */
.growth { text-align: right; flex: none; }
.growth .g { display: block; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;
  font-size: 19px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
.growth .g.up { color: var(--good); }
.growth .g.down { color: var(--bad); }
.growth .g.flat { color: var(--muted); }
.growth .gn { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); white-space: nowrap; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 6px;
  background: var(--navy-2); color: #fff; font-size: 13px; font-weight: 600; border: 1px solid var(--navy-2);
  transition: filter .12s ease;
}
.btn:hover { filter: brightness(1.25); }
.btn.accent { background: var(--btn-bg); border-color: var(--btn-bg); color: var(--btn-fg); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--mist-2); filter: none; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }

/* The range picker is a segmented control, not five loose buttons —
   it is one setting with five positions. */
/* Five options now rather than three, so it has to be allowed to wrap on
   a narrow screen instead of being clipped by the rounded corners. */
.seg { display: inline-flex; flex-wrap: wrap; justify-content: flex-end; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; background: var(--paper); }
.seg button {
  padding: 6px 12px 7px; font-size: 12px; font-weight: 600; color: var(--muted);
  border-right: 1px solid var(--line);
}
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--mist-2); color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--navy-2); color: #fff; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field > label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.field .hint { font-size: 11.5px; color: var(--muted); }
/* The range control and its custom dates, right-aligned in the page head
   so it sits in the same place on every tab. */
.rangebox { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
/* Refresh and the range control share the right-hand end of the page
   head; the button aligns to the top so it sits level with the range
   buttons rather than with the date inputs under them. */
.headtools { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.daterow { display: flex; gap: 8px; flex-wrap: wrap; }
.daterow label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
.daterow input { padding: 5px 8px; font-size: 12.5px; width: auto; }

input[type=text], input[type=password], input[type=search], input[type=date], select, textarea {
  padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 6px;
  background: var(--paper); color: var(--ink); width: 100%; font-size: 13.5px;
}
textarea { resize: vertical; min-height: 120px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: right 14px top 50%, right 9px top 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
.filters { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 14px; }
.filters .field { min-width: 140px; }
/* When one field carries a hint under its input, align the tops so the
   button sits beside the input and the hint hangs below its own field. */
.filters.top { align-items: flex-start; }
.filters .field.searchbox { flex: 1 1 300px; min-width: 220px; max-width: 460px; }

/* ---------- panels ---------- */
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.panel + .panel { margin-top: 18px; }
.panel-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.panel-head h3 { margin: 0; font-size: 14.5px; font-weight: 700; }
.panel-head .note { font-size: 12px; color: var(--muted); }
.panel-body { padding: 18px; }
.panel-body.flush { padding: 0; }

/* ---------- stat tiles ---------- */
/* The stripe is the source marker: blue = LOA, orange = Lead Tech,
   navy = both businesses combined. It is doing information work, not
   decoration, which is why it is the one ornament on the tile. */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(2, 1fr); }
@media (min-width: 760px)  { .tiles { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1060px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
.tile { background: var(--mist); border: 1px solid var(--line); border-radius: 9px; padding: 13px 14px 14px; position: relative; overflow: hidden; }
.tile::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--line-2); }
.tile.src-loa::before { background: var(--s-loa); }
.tile.src-lt::before  { background: var(--s-lt); }
.tile.src-all::before { background: linear-gradient(var(--s-loa) 50%, var(--s-lt) 50%); }
.tile.is-good::before { background: var(--good); }
.tile.is-warn::before { background: var(--warn); }
.tile.is-bad::before  { background: var(--bad); }
.tile.is-key::before  { background: var(--sky); }
@media (min-width: 1060px) { .tiles.t3 { grid-template-columns: repeat(3, 1fr); } }
/* Five ledger tiles that reconcile to one another belong on one line,
   not three-and-a-ragged-two. */
@media (min-width: 1200px) { .tiles.t5 { grid-template-columns: repeat(5, 1fr); } }
/* Two columns — in on the left, out on the right — with the net across
   the foot, the way a ledger is actually read. */
.ledger { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .ledger { grid-template-columns: 1fr 1fr; } }
.ledger .span2 { grid-column: 1 / -1; }
.tile .v { display: block; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 23px; font-weight: 600; letter-spacing: -.02em; margin-top: 5px; line-height: 1.15; }
.tile .v.neg { color: var(--bad); }
.tile .v.pos { color: var(--good); }
.tile .foot { display: block; margin-top: 3px; font-size: 11.5px; color: var(--muted); }

/* The headline pair on Overview: company net gets the weight, the two
   business lines sit beside it at tile scale. */
/* Hero beside its history. They stay the same height so the pair reads
   as one band across the top of the page. */
.headline { display: grid; gap: 12px; grid-template-columns: 1fr; margin-bottom: 12px; align-items: stretch; }
@media (min-width: 1000px) { .headline { grid-template-columns: 1.05fr 1fr; } }
.headline .panel { margin-top: 0; display: flex; flex-direction: column; }
.headline .panel-body { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; }
.hero {
  background: var(--navy-2); color: #fff; border-radius: 10px; padding: 18px 20px 19px;
  border: 1px solid var(--navy-2); box-shadow: var(--shadow);
}
.hero .eyebrow { color: #8FA8C4; }
.hero .v { display: block; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 38px; font-weight: 600; letter-spacing: -.03em; line-height: 1.05; margin-top: 7px; }
.hero .v.neg { color: #F08276; }
/* Sits on the navy card, so it has to be lighter than the tile green to
   hold its contrast against that background. */
.hero .v.pos { color: #67DDAF; }
.hero .foot { display: block; margin-top: 7px; font-size: 12px; color: #A9BDD4; }
/* When the hero is stretched to match a chart beside it, the supporting
   figures drop to the bottom rather than leaving a hole under them. */
.hero { display: flex; flex-direction: column; }
.hero .split { display: flex; gap: 18px; margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.13); flex-wrap: wrap; }
.hero .foot { margin-bottom: 13px; }
.hero .split div { font-size: 11.5px; color: #A9BDD4; }
.hero .split b { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; color: #fff; margin-top: 2px; }

/* ---------- tables ---------- */
.tblwrap { overflow-x: auto; }
/* A long table scrolls inside its panel rather than pushing the page
   down forever. The cap is measured in rows, not pixels, so it lands on
   the same row count whether the rows are one line or two. */
.tblwrap.capped { overflow-y: auto; }
.tblwrap.capped table.data th {
  position: sticky; top: 0; z-index: 2;
  box-shadow: inset 0 -1px 0 var(--line);
}
/* The totals stay in view while the rows scroll under them — a total you
   have to scroll to find is a total nobody reads. */
.tblwrap.capped table.data tr.total td {
  position: sticky; bottom: 0; z-index: 1;
  box-shadow: inset 0 1px 0 var(--line-2);
}
.tblwrap.capped table.data tr.total td:first-child::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
}
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th {
  text-align: left; padding: 9px 12px; background: var(--mist-2); color: var(--muted);
  font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  font-weight: 500; white-space: nowrap; border-bottom: 1px solid var(--line);
}
table.data td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data tbody tr:hover { background: var(--mist); }
table.data td.n, table.data th.n { text-align: right; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data tr.total td { background: var(--mist-2); font-weight: 700; border-top: 2px solid var(--line-2); }
table.data .who { font-weight: 600; }
table.data .dim { color: var(--muted); font-size: 12px; }
table.data .nowrap { white-space: nowrap; }
table.data tr:last-child td { border-bottom: 0; }
/* In the P&L the in/out marker is a tag, not a column of data — let it
   hug the right edge so the amounts sit beside their labels. */
table.data.pl th:last-child, table.data.pl td:last-child { width: 1%; white-space: nowrap; }

/* ---------- pills ---------- */
.pill {
  display: inline-block; padding: 2px 8px 3px; border-radius: 999px; font-size: 11px;
  font-weight: 600; white-space: nowrap;
  background: var(--mist-2); color: var(--muted); border: 1px solid var(--line);
}
.pill.good { background: var(--good-bg); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pill.bad  { background: var(--bad-bg);  color: var(--bad);  border-color: transparent; }
.pill.key  { background: var(--sky-soft); color: var(--sky); border-color: transparent; }

/* ---------- messages / empties ---------- */
.msg { padding: 10px 12px; border-radius: 6px; font-size: 12.5px; border: 1px solid transparent; }
.msg.err  { background: var(--bad-bg);  color: var(--bad);  }
.msg.ok   { background: var(--good-bg); color: var(--good); }
.msg.info { background: var(--sky-soft); color: var(--sky); }
.msg.warnbar { background: var(--warn-bg); color: var(--warn); }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 5px; }
.empty p { margin: 0 auto; max-width: 52ch; font-size: 13px; line-height: 1.6; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1 1 auto; }
.stack { display: grid; gap: 14px; }

/* ---------- charts ---------- */
.charts { display: grid; gap: 18px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 1000px) { .charts.c2 { grid-template-columns: 1.35fr 1fr; } }
.charts .panel { margin-top: 0; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .axisline { stroke: var(--axis); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 10px; font-family: 'IBM Plex Mono', monospace; }
.chart .mark { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chart .dot { stroke: var(--paper); stroke-width: 2; }

<script>
(function () {
  "use strict";

  /* ====================================================================
     Thrive Command — owner console.

     This page is a MIRROR, never a source of truth. Two portals own their
     own data:

       · Thrive LOA Producer Desk   — writes its state into its own
                                      published HTML, so a sync run can
                                      read it straight from the artifact.
       · Lead Tech Fulfillment      — keeps its board in browser storage,
                                      and mirrors a scrubbed digest into
                                      its own database so a sync run can
                                      read it from outside the browser.

     A sync writes a snapshot document here; this page only ever reads
     them and does the arithmetic. Nothing typed here flows back to
     either portal — which is the point. The owner watches; the desks
     operate.
     ==================================================================== */

  var SOURCES = {
    loa: {
      key: "loa", doc: "snapshots/loa", cls: "loa",
      name: "LOA Producer Desk",
      blurb: "Agents, written business, carrier commissions and inbound call spend.",
      url: "https://claude.ai/code/artifact/604efc81-daa6-4fa0-852a-e3dd33577682"
    },
    lt: {
      key: "lt", doc: "snapshots/leadtech", cls: "lt",
      name: "Lead Tech Fulfillment",
      blurb: "Orders, delivery against SLA, subscriptions and refunds.",
      url: "https://claude.ai/code/artifact/c0337537-9660-4dbe-a3d9-78c6f7c8fd6f"
    }
  };

  var OWNER_DOC = "config/owner";
  var SETTINGS_DOC = "config/settings";
  /* The brokerage's blended spread. Per-deal spread is computed exactly
     from each carrier's schedule; this is the house's own average rate
     applied to everything written, which is how the brokerage side is
     actually quoted. The owner sets it under Sync & sources. */
  var DEFAULT_SPREAD_PCT = 10;
  var PW_ITER = 210000;
  var UNLOCK_KEY = "thrive_command_unlock";
  var UNLOCK_HOURS = 12;
  var STALE_HOURS = 36;

  /* LOA deal statuses, mirrored from the Producer Desk so a deal is
     bucketed here exactly the way the desk buckets it. */
  var LOA_STATUS = {
    underwriting: { label: "In underwriting",    tone: "warn", group: "pending" },
    approved:     { label: "Approved, not paid", tone: "key",  group: "pending" },
    issued_paid:  { label: "Issued & paid",      tone: "good", group: "paid"    },
    nsf:          { label: "Insufficient funds", tone: "bad",  group: "lost"    },
    declined:     { label: "Declined",           tone: "bad",  group: "lost"    },
    chargeback:   { label: "Chargeback",         tone: "bad",  group: "lost"    }
  };
  var LOA_ALIAS = { submitted: "underwriting", not_taken: "declined", withdrawn: "declined", lapsed: "chargeback" };

  /* The Producer Desk offers month-to-date and all time; without the same
     two here the two apps can never be pointed at the same window, and
     the totals disagree for no better reason than that. */
  var RANGES = [
    { k: "d7",     label: "7 days" },
    { k: "d30",    label: "30 days" },
    { k: "mtd",    label: "Month to date" },
    { k: "all",    label: "All time" },
    { k: "custom", label: "Custom" }
  ];

  var app = document.getElementById("app");
  var db = null, downloads = null;

  /* ====================================================================
     Two homes, one file.

     Published as a claude.ai artifact, this page stores everything in the
     artifact database and gates itself with an owner passcode. Deployed
     to your own domain, there is no artifact database, so it talks to the
     Cloudflare relay instead and the relay's own sign-in is the gate.

     Everything above this line reads and writes through `store`, so no
     page, chart or table knows or cares which one it got.
     ==================================================================== */
  var RELAY = String(window.THRIVE_RELAY || "").replace(/\/+$/, "");
  var TOKEN_KEY = "thrive_relay_token";
  var store = null;

  /* Document paths are collection/doc; the relay's keyspace is flat, so
     the separator changes and nothing else does. */
  function relayKey(path) { return path.replace(/\//g, "."); }

  function relayToken() {
    try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
  }
  function setRelayToken(t) {
    try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }

  function relayFetch(path, opts) {
    opts = opts || {};
    var headers = opts.headers || {};
    var t = relayToken();
    if (t) headers.Authorization = "Bearer " + t;
    return fetch(RELAY + path, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body
    }).then(function (res) {
      /* A dead token is not an error the caller should have to reason
         about — drop it and send them back to the sign-in screen. */
      if (res.status === 401) {
        setRelayToken("");
        ui.signedIn = false;
        render();
        throw { code: "signed_out", message: "Your session ended. Sign in again." };
      }
      return res;
    });
  }

  function makeArtifactStore(d) {
    return {
      mode: "artifact",
      get: function (path) {
        return d.doc(path).get().then(function (s) { return s.exists ? s.data() : null; });
      },
      set: function (path, data) { return d.doc(path).set(data); },
      del: function (path) { return d.doc(path).delete(); },
      /* Live: the platform pushes every change to every open view. */
      watch: function (path, cb) { return d.doc(path).onSnapshot(function (s) { cb(s.exists ? s.data() : null); }, function () {}); }
    };
  }

  /* When the fulfillment board syncs straight to the relay it writes its
     own record under its own key, in its own shape — which is the shape
     the Lead Tech pages already read. So if no digest has been written,
     read the board itself. */
  var LT_BOARD_KEY = "fulfillment_board_v3";

  /* A third home, for the preview copy published to review a change
     before it ships. It holds its data in the page and writes nowhere,
     so the preview can be clicked through freely without reaching the
     relay or the live console. */
  function makePreviewStore(seed) {
    var mem = JSON.parse(JSON.stringify(seed || {}));
    return {
      mode: "preview",
      get: function (path) { return Promise.resolve(mem[path] || null); },
      set: function (path, data) { mem[path] = data; return Promise.resolve(true); },
      del: function (path) { mem[path] = null; return Promise.resolve(true); },
      watch: function (path, cb) {
        this.get(path).then(cb).catch(function () {});
        return function () {};
      }
    };
  }

  function makeRelayStore() {
    return {
      mode: "relay",
      get: function (path) {
        var self = this;
        return this.raw(relayKey(path)).then(function (v) {
          if (v || path !== SOURCES.lt.doc) return v;
          return self.raw(LT_BOARD_KEY).then(function (board) {
            if (!board || typeof board !== "object") return null;
            board.syncedBy = "the board itself";
            board.syncedAt = board.updatedAt
              ? new Date(board.updatedAt).toISOString()
              : new Date().toISOString();
            return board;
          });
        });
      },
      raw: function (key) {
        return relayFetch("/kv/" + encodeURIComponent(key)).then(function (res) {
          if (res.status === 404) return null;
          if (!res.ok) throw { code: "read_failed", message: "Could not read " + path + " (" + res.status + ")." };
          return res.json();
        }).then(function (body) {
          if (!body) return null;
          try { return typeof body.value === "string" ? JSON.parse(body.value) : body.value; }
          catch (e) { return null; }
        });
      },
      set: function (path, data) {
        return relayFetch("/kv/" + encodeURIComponent(relayKey(path)), {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ value: JSON.stringify(data) })
        }).then(function (res) {
          if (!res.ok) throw { code: "write_failed", message: "Could not save (" + res.status + ")." };
          return true;
        });
      },
      /* The relay has no delete verb, so an empty document stands in for
         one. Readers already treat a falsy snapshot as absent. */
      del: function (path) { return this.set(path, null); },
      /* No push channel here — read once now, and the fifteen-minute
         refresh keeps it current. */
      watch: function (path, cb) {
        this.get(path).then(cb).catch(function () {});
        return function () {};
      }
    };
  }
  var ui = {
    tab: "overview",
    range: "d30",
    customFrom: "",
    customTo: "",
    unlocked: false,
    signedIn: false,      /* relay mode only — the relay's own session */
    relayUser: "",
    booting: true,
    refreshing: false,
    dbError: null,
    owner: null,          /* {salt, hash, iter} or null before it is set */
    settings: null,       /* {brokerageSpreadPct} — owner-editable */
    loa: null,            /* snapshot document body */
    lt: null,
    filters: { dealStatus: "", dealAgent: "", dealQuery: "" },
    toast: null
  };

  /* --------------------------------------------------------- utilities */
  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }
  function money(n, dp) {
    var d = dp == null ? 0 : dp;
    var s = Math.abs(num(n)).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
    return (num(n) < 0 ? "-$" : "$") + s;
  }
  function intf(n) { return Math.round(num(n)).toLocaleString("en-US"); }
  function pct(n, dp) { return (isFinite(n) ? num(n) : 0).toFixed(dp == null ? 1 : dp) + "%"; }
  function ratio(a, b) { return b > 0 ? (a / b) * 100 : 0; }
  function sumBy(arr, key) { var t = 0; for (var i = 0; i < arr.length; i++) t += num(arr[i][key]); return t; }
  function todayISO() {
    var d = new Date(), z = d.getTimezoneOffset() * 60000;
    return new Date(d - z).toISOString().slice(0, 10);
  }
  function addDays(iso, n) {
    var d = new Date(iso + "T12:00:00");
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function prettyDate(iso) {
    if (!iso) return "—";
    var d = new Date(String(iso).slice(0, 10) + "T12:00:00");
    if (isNaN(d)) return "—";
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "2-digit" });
  }
  /* Sources disagree about time: the desk writes YYYY-MM-DD, the
     fulfillment board writes epoch milliseconds. One reader for both. */
  function toISODate(v) {
    if (v == null || v === "") return "";
    if (typeof v === "number") { var d = new Date(v); return isNaN(d) ? "" : localISO(d); }
    var s = String(v);
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
    var p = new Date(s);
    return isNaN(p) ? "" : localISO(p);
  }
  function localISO(d) { return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
  function toMillis(v) {
    if (v == null || v === "") return 0;
    if (typeof v === "number") return v;
    var d = new Date(/^\d{4}-\d{2}-\d{2}$/.test(String(v)) ? String(v) + "T12:00:00" : String(v));
    return isNaN(d) ? 0 : d.getTime();
  }
  function inRange(iso, from, to) { return !!iso && iso >= from && iso <= to; }
  function hoursSince(v) {
    var ms = toMillis(v);
    return ms ? (Date.now() - ms) / 3600000 : Infinity;
  }
  function agoLabel(v) {
    var h = hoursSince(v);
    if (!isFinite(h)) return "never";
    if (h < 1) return Math.max(1, Math.round(h * 60)) + "m ago";
    if (h < 48) return Math.round(h) + "h ago";
    return Math.round(h / 24) + "d ago";
  }
  /* The earliest and latest dates on record across both portals. "All
     time" resolves to these rather than to sentinel dates, because a
     window of 0000 to 9999 is not a window anything can divide by: it
     turned "premium written per day" into $0. */
  function recordSpan() {
    var first = "", last = "";
    function seen(x) {
      if (!x) return;
      if (!first || x < first) first = x;
      if (!last || x > last) last = x;
    }
    loaDeals().forEach(function (d) { seen(toISODate(d.date)); });
    loaCalls().forEach(function (c) { seen(toISODate(c.date)); });
    ltCalls().forEach(function (c) { seen(c.date); });
    ltRefunds().forEach(function (r) { seen(r.date); });
    ltWipes().forEach(function (x) { seen(x.date); });
    ltOrders().forEach(function (o) { seen(o.date); });
    return { first: first, last: last };
  }

  function rangeWindow() {
    var t = todayISO();
    if (ui.range === "d7") return { from: addDays(t, -6), to: t, label: "Last 7 days" };
    if (ui.range === "mtd") return { from: t.slice(0, 8) + "01", to: t, label: "Month to date" };
      if (ui.range === "all") {
      var span = recordSpan();
      return { from: span.first || addDays(t, -29), to: span.last > t ? span.last : t, label: "All time" };
    }
    if (ui.range === "custom") {
      var f = ui.customFrom || addDays(t, -89);
      var to = ui.customTo || t;
      if (f > to) { var s = f; f = to; to = s; }
      return { from: f, to: to, label: prettyDate(f) + " to " + prettyDate(to) };
    }
    return { from: addDays(t, -29), to: t, label: "Last 30 days" };
  }
  function toast(text) {
    ui.toast = text;
    render();
    setTimeout(function () { ui.toast = null; render(); }, 2600);
  }

  /* ------------------------------------------------------------ LOA math */
  /* Straight from the Producer Desk, so the two never disagree: carriers
     advance a share of the first year, and commission is paid on that
     advance — $125/mo x 12 = $1,500 x 75% = $1,125 x 30% = $337.50. */
  function loaOrg() {
    var o = (ui.loa && ui.loa.org) || {};
    return {
      name: o.name || "Thrive Companies LOA",
      houseLevel: o.houseLevel || "150",
      costPerCall: o.costPerCall == null ? 0 : num(o.costPerCall),
      advanceRate: (o.advanceRate == null ? 75 : num(o.advanceRate)) / 100
    };
  }
  function statusOf(k) { return LOA_STATUS[k] || LOA_STATUS[LOA_ALIAS[k]] || LOA_STATUS.underwriting; }
  function spreadPct() {
    var v = ui.settings && ui.settings.brokerageSpreadPct;
    return (v == null || !isFinite(num(v))) ? DEFAULT_SPREAD_PCT : num(v);
  }
  /* The brokerage's blended take on everything written, at the house
     rate — not the per-deal spread, which each carrier's schedule
     decides. */
  /* Unused while Thrive Companies is unconnected — the brokerage figures
     it fed were estimates drawn from LOA production, and are blank until
     that business has a source here. The setting it reads is still on the
     Sync tab, so this is waiting rather than dead. */
  function brokerageSpread(apWritten) { return num(apWritten) * spreadPct() / 100; }
  /* 10, not 10.0 — but 12.5 keeps its half. */
  function spreadLabel() {
    var v = spreadPct();
    return (v % 1 ? v.toFixed(1) : String(Math.round(v))) + "%";
  }
  function advancedAP(d) { return num(d.ap) * loaOrg().advanceRate; }
  function agentCommOn(d) { return advancedAP(d) * num(d.agentPct) / 100; }
  function houseCommOn(d) { return advancedAP(d) * num(d.housePct) / 100; }
  function spreadOn(d) { return houseCommOn(d) - agentCommOn(d); }
  /* The carrier advances 75% of the first year and pays the rest as it is
     earned. Upfront commission is the house's cut of the advance; total
     commission is its cut of the whole first year, tail included. */
  function houseCommFullOn(d) { return num(d.ap) * num(d.housePct) / 100; }

  function loaDeals() { return (ui.loa && Array.isArray(ui.loa.deals)) ? ui.loa.deals : []; }
  function loaAgents() { return (ui.loa && Array.isArray(ui.loa.agents)) ? ui.loa.agents : []; }
  function loaCalls() { return (ui.loa && Array.isArray(ui.loa.calls)) ? ui.loa.calls : []; }
  function agentName(id) {
    var a = loaAgents().filter(function (x) { return x.id === id; })[0];
    return a ? a.name : "Unassigned";
  }
  function carrierName(id) {
    var c = (ui.loa && ui.loa.carriers) || {};
    return c[id] || String(id || "—");
  }

  function loaMetrics(from, to, agentIds) {
    var deals = loaDeals().filter(function (d) {
      return inRange(toISODate(d.date), from, to) && (!agentIds || agentIds.indexOf(d.agentId) >= 0);
    });
    var calls = loaCalls().filter(function (c) {
      return inRange(toISODate(c.date), from, to) && (!agentIds || agentIds.indexOf(c.agentId) >= 0);
    });
    var m = { deals: deals, callRows: calls };
    m.callsTaken = sumBy(calls, "calls");
    m.marketingCost = m.callsTaken * loaOrg().costPerCall;
    m.written = deals.length;
    m.mpWritten = sumBy(deals, "mp");
    m.apWritten = sumBy(deals, "ap");

    var paid = [], pend = [], lost = [];
    deals.forEach(function (d) {
      var g = statusOf(d.status).group;
      if (g === "paid") paid.push(d); else if (g === "pending") pend.push(d); else lost.push(d);
    });
    m.paid = paid; m.pending = pend; m.lost = lost;
    m.apPaid = sumBy(paid, "ap");
    m.apPending = sumBy(pend, "ap");
    m.apLost = sumBy(lost, "ap");
    m.advPaid = paid.reduce(function (t, d) { return t + advancedAP(d); }, 0);
    m.agentCommPaid = paid.reduce(function (t, d) { return t + agentCommOn(d); }, 0);
    m.houseGrossPaid = paid.reduce(function (t, d) { return t + houseCommOn(d); }, 0);
    m.houseFullPaid = paid.reduce(function (t, d) { return t + houseCommFullOn(d); }, 0);
    m.spreadPaid = m.houseGrossPaid - m.agentCommPaid;
    m.net = m.spreadPaid - m.marketingCost;
    m.placement = ratio(m.apPaid, m.apPaid + m.apLost);
    m.callsPerPaid = paid.length ? m.callsTaken / paid.length : 0;
    return m;
  }

  /* ------------------------------------------------- Lead Tech normalizing */
  /* The fulfillment board stores money in cents and is looser about field
     names than the desk, so everything is read through one normalizer and
     nothing downstream guesses. */
  function ltSettings() {
    var s = (ui.lt && ui.lt.settings) || {};
    return {
      callCost: num(s.callCost) / 100,
      callPrice: num(s.callPrice) / 100,
      pastDueHours: num(s.pastDueHours) || 12
    };
  }
  function ltProducts() { return (ui.lt && Array.isArray(ui.lt.products)) ? ui.lt.products : []; }
  function ltProduct(id) {
    var p = ltProducts().filter(function (x) { return x.id === id; })[0];
    return p || null;
  }
  function ltOrders() {
    var raw = (ui.lt && Array.isArray(ui.lt.orders)) ? ui.lt.orders : [];
    return raw.map(function (o) {
      var prod = ltProduct(o.productId);
      var paidOk = (o.paymentStatus || "succeeded") === "succeeded";
      var created = toMillis(o.createdAt);
      var done = toMillis(o.completedAt);
      var due = toMillis(o.dueAt);
      return {
        id: o.id,
        customer: o.customer || o.customerName || "—",
        email: o.email || o.customerEmail || "",
        productId: o.productId || "",
        product: o.productName || (prod && prod.name) || "—",
        kind: o.kind || (prod && prod.kind) || "one-time",
        amount: num(o.amount) / 100,
        currency: (o.currency || "usd").toUpperCase(),
        status: o.status === "done" ? "done" : "open",
        paid: paidOk,
        paymentStatus: o.paymentStatus || "succeeded",
        assignee: o.assignee || "",
        subscriptionId: o.subscriptionId || "",
        createdAt: created, completedAt: done, dueAt: due,
        date: toISODate(o.createdAt),
        turnaround: (done && created) ? (done - created) / 3600000 : null,
        onTime: (done && due) ? done <= due : null,
        overdue: (o.status !== "done" && due) ? Date.now() > due : false
      };
    });
  }
  /* The board writes a refund as {typeId, amount in cents, at}. A refund
     carries no call count, so calls refunded is the amount over the call
     price — a $105 credit is three calls, not one. */
  function ltRefunds() {
    var raw = (ui.lt && Array.isArray(ui.lt.refunds)) ? ui.lt.refunds : [];
    var types = (ui.lt && Array.isArray(ui.lt.refundTypes)) ? ui.lt.refundTypes : [];
    var price = ltSettings().callPrice;
    return raw.map(function (r) {
      var t = types.filter(function (x) { return x.id === (r.typeId || r.type); })[0];
      var amount = num(r.amount) / 100;
      var isCall = /call/i.test((t && t.name) || r.typeName || "");
      return {
        id: r.id,
        customer: r.customer || r.customerName || r.name || "—",
        type: r.typeName || (t && t.name) || "Refund",
        isCall: isCall,
        calls: (isCall && price > 0) ? Math.max(1, Math.round(amount / price)) : 0,
        amount: amount,
        status: r.status || "",
        date: toISODate(r.at || r.createdAt || r.refundedAt || r.date),
        createdAt: toMillis(r.at || r.createdAt || r.refundedAt || r.date)
      };
    });
  }
  /* A wiped wallet is unspent credit cleared off a customer's balance.
     Unlike a refund, the cash was collected and stays collected — what
     ends is the obligation to deliver calls against it. So it lands on
     the profit side of the P&L, kept separate from call revenue rather
     than folded into it, because it is money earned without a call. */
  function ltWipes() {
    var raw = (ui.lt && Array.isArray(ui.lt.wipes)) ? ui.lt.wipes : [];
    return raw.map(function (x) {
      return {
        id: x.id,
        customer: x.name || x.customer || x.customerName || "—",
        reason: x.reason || x.note || "",
        amount: num(x.amount != null ? x.amount : x.value) / 100,
        date: toISODate(x.at || x.createdAt || x.recordedAt || x.date)
      };
    });
  }
  /* The Calls tab records one row a day: `billable` is what Lead Tech had
     to pay for, `sold` is what went out to agents. The gap between them
     is the whole business. */
  function ltCalls() {
    var raw = (ui.lt && Array.isArray(ui.lt.calls)) ? ui.lt.calls : [];
    return raw.map(function (c) {
      var bought = c.billable != null ? num(c.billable) : (c.bought != null ? num(c.bought) : num(c.calls));
      var sold = c.sold != null ? num(c.sold) : num(c.calls);
      return {
        id: c.id,
        date: toISODate(c.day || c.date || c.at),
        bought: bought,
        sold: sold,
        /* Thrive Companies production, logged on the same daily row. Money
           comes across in cents like everything else the board stores. */
        deals: num(c.deals),
        avgMp: num(c.avgMp) / 100
      };
    }).filter(function (c) { return !!c.date; });
  }

  /* Thrive Companies, from the daily log: how many deals were sold and
     what the average one was worth a month. The average is weighted by
     the deals behind it — a day with one deal and a day with twenty are
     not two numbers to be averaged together. */
  function brokerageMetrics(from, to) {
    var rows = ltCalls().filter(function (c) { return inRange(c.date, from, to) && c.deals > 0; });
    var m = { rows: rows };
    m.deals = rows.reduce(function (t, c) { return t + c.deals; }, 0);
    m.mpTotal = rows.reduce(function (t, c) { return t + c.deals * c.avgMp; }, 0);
    m.avgMp = m.deals > 0 ? m.mpTotal / m.deals : 0;
    m.apTotal = m.mpTotal * 12;
    return m;
  }

  /* Nothing has been logged for it yet if no day carries a deal count. */
  function hasBrokerage() {
    return ltCalls().some(function (c) { return c.deals > 0; });
  }

  function ltMetrics(from, to) {
    var orders = ltOrders().filter(function (o) { return inRange(o.date, from, to); });
    var refunds = ltRefunds().filter(function (r) { return inRange(r.date, from, to); });
    var calls = ltCalls().filter(function (c) { return inRange(c.date, from, to); });
    var set = ltSettings();

    var m = { orders: orders, refunds: refunds, callRows: calls };
    m.count = orders.length;
    m.collected = orders.filter(function (o) { return o.paid; }).reduce(function (t, o) { return t + o.amount; }, 0);
    m.failed = orders.filter(function (o) { return !o.paid; });
    m.failedValue = m.failed.reduce(function (t, o) { return t + o.amount; }, 0);
    m.refunded = refunds.reduce(function (t, r) { return t + r.amount; }, 0);
    /* Mirrors the board's own arithmetic exactly: spend is billable calls
       at cost, revenue is sold calls at price. */
    m.callsBought = calls.reduce(function (t, c) { return t + c.bought; }, 0);
    m.callsSold = calls.reduce(function (t, c) { return t + c.sold; }, 0);
    m.callsTaken = m.callsBought;
    m.callSpend = m.callsBought * set.callCost;
    m.callRevenue = m.callsSold * set.callPrice;
    m.callCost = m.callSpend;
    m.callsRefunded = refunds.reduce(function (t, r) { return t + r.calls; }, 0);

    m.wipeRows = ltWipes().filter(function (x) { return inRange(x.date, from, to); });
    m.wiped = m.wipeRows.reduce(function (t, x) { return t + x.amount; }, 0);
    m.pnl = m.callRevenue + m.wiped - m.callSpend - m.refunded;
    m.margin = m.callRevenue > 0 ? ratio(m.pnl, m.callRevenue) : null;
    m.net = m.pnl;

    m.done = orders.filter(function (o) { return o.status === "done"; });
    m.open = orders.filter(function (o) { return o.status !== "done"; });
    m.overdue = orders.filter(function (o) { return o.overdue; });
    var rated = m.done.filter(function (o) { return o.onTime !== null; });
    m.onTimePct = rated.length ? ratio(rated.filter(function (o) { return o.onTime; }).length, rated.length) : null;
    var timed = m.done.filter(function (o) { return o.turnaround != null; });
    m.avgTurnaround = timed.length ? timed.reduce(function (t, o) { return t + o.turnaround; }, 0) / timed.length : null;

    /* Recurring revenue is a standing figure, not a windowed one: every
       live subscription regardless of when it was sold. */
    var live = {};
    ltOrders().forEach(function (o) {
      if (o.kind === "subscription" && o.paid && o.subscriptionId) live[o.subscriptionId] = o.amount;
      else if (o.kind === "subscription" && o.paid && !o.subscriptionId) live["o:" + o.id] = o.amount;
    });
    m.mrr = Object.keys(live).reduce(function (t, k) { return t + live[k]; }, 0);
    m.subs = Object.keys(live).length;
    return m;
  }

  function hasLOA() { return !!(ui.loa && loaDeals().length + loaAgents().length > 0); }
  /* The call ledger is the whole Lead Tech P&L, and a board can carry one
     without a single fulfillment order — so counting only orders and
     products reported a live board as never synced. */
  function hasLT()  {
    return !!(ui.lt && (ltOrders().length + ltProducts().length +
      ltCalls().length + ltRefunds().length + ltWipes().length) > 0);
  }

  /* ------------------------------------------------------------- charts */
  /* Charts are emitted as HTML strings, so their data cannot ride on the
     node. Each one takes an id at build time and parks its data in a
     registry the hover layer reads back after the paint. */
  var chartData = {}, chartSeq = 0;
  function chartId(data) {
    var id = "ch" + (++chartSeq);
    chartData[id] = data;
    return id;
  }
  function chartTip() { return '<div class="chart-tip" data-tip></div>'; }

  /* One shared dollar scale, two series — never two y-axes. Both series
     are money, so they belong on one chart; anything in other units gets
     its own. */
  function lineChart(buckets, series, opts) {
    opts = opts || {};
    var W = 760, H = opts.height || 250, L = 60, R = 74, T = 16, B = 28;
    var iw = W - L - R, ih = H - T - B;
    var max = 0, min = 0;
    series.forEach(function (s) {
      s.values.forEach(function (v) { if (v > max) max = v; if (v < min) min = v; });
    });
    if (max <= 0 && min >= 0) max = 100;
    /* A series that dips below the line needs a real floor and a marked
       zero, or a loss reads as a small profit. */
    var top = niceCeil(max || 1);
    var bot = min < 0 ? -niceCeil(-min) : 0;
    var n = buckets.length;
    function x(i) { return n <= 1 ? L + iw / 2 : L + (i / (n - 1)) * iw; }
    function y(v) { return T + ih - ((v - bot) / (top - bot)) * ih; }

    var out = '<div class="chart" data-chart="line" data-cid="' + chartId({ buckets: buckets, series: series }) + '">';
    out += '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' +
      esc(series.length === 1 ? series[0].label + " over time" : "Contribution by business line over time") + '">';

    /* grid + y ticks */
    for (var g = 0; g <= 4; g++) {
      var yv = bot + (top - bot) * g / 4, yy = y(yv);
      out += '<line class="gridline" x1="' + L + '" y1="' + yy + '" x2="' + (L + iw) + '" y2="' + yy + '"></line>';
      out += '<text class="tick" x="' + (L - 8) + '" y="' + (yy + 3.5) + '" text-anchor="end">' + esc(shortMoney(yv)) + '</text>';
    }
    var zeroY = y(0);
    out += '<line class="axisline" x1="' + L + '" y1="' + zeroY + '" x2="' + (L + iw) + '" y2="' + zeroY + '"></line>';

    /* x ticks: first, middle, last only — a dense axis is unreadable */
    [0, Math.floor((n - 1) / 2), n - 1].filter(function (v, i, a) { return n > 0 && a.indexOf(v) === i; })
      .forEach(function (i) {
        out += '<text class="tick" x="' + x(i) + '" y="' + (T + ih + 16) + '" text-anchor="middle">' + esc(buckets[i].label) + '</text>';
      });

    series.forEach(function (s) {
      if (!n) return;
      var d = "";
      s.values.forEach(function (v, i) { d += (i ? " L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); });
      /* One series gets an area to read as a magnitude; two overlapping
         fills just muddy each other, so a pair stays as lines. */
      if (series.length === 1) {
        var area = d + " L" + x(n - 1).toFixed(1) + " " + zeroY.toFixed(1) + " L" + x(0).toFixed(1) + " " + zeroY.toFixed(1) + " Z";
        out += '<path d="' + area + '" fill="' + s.fill + '" stroke="none"></path>';
      }
      out += '<path class="mark" d="' + d + '" stroke="' + s.color + '"></path>';
      var last = s.values[n - 1];
      out += '<circle class="dot" cx="' + x(n - 1) + '" cy="' + y(last) + '" r="4" fill="' + s.color + '"></circle>';
      out += '<text class="endlabel" x="' + (L + iw + 9) + '" y="' + (y(last) + 3.5) + '" fill="' + s.color + '">' + esc(shortMoney(last)) + '</text>';
    });

    /* hover layer */
    out += '<g class="crosshair-g" data-cross hidden><line class="crosshair" y1="' + T + '" y2="' + (T + ih) + '"></line></g>';
    for (var i = 0; i < n; i++) {
      var bw = n <= 1 ? iw : iw / (n - 1);
      out += '<rect class="hit" data-i="' + i + '" x="' + (x(i) - bw / 2) + '" y="' + T + '" width="' + bw + '" height="' + ih + '"></rect>';
    }
    out += "</svg>" + chartTip() + "</div>";

    /* One series is named by the panel title — a legend box for it is
       furniture, not information. */
    if (opts.legend !== false && series.length > 1) {
      out += '<div class="viz-legend">';
      series.forEach(function (s) { out += '<span><i style="background:' + s.color + '"></i>' + esc(s.label) + "</span>"; });
      out += "</div>";
    }
    return out;
  }
  function niceCeil(v) {
    if (v <= 0) return 100;
    var mag = Math.pow(10, Math.floor(Math.log(v) / Math.LN10));
    var f = v / mag;
    var step = f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10;
    return step * mag;
  }
  function shortMoney(v) {
    var a = Math.abs(v);
    if (a >= 1000000) return "$" + (v / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if (a >= 1000) return "$" + (v / 1000).toFixed(a >= 10000 ? 0 : 1).replace(/\.0$/, "") + "k";
    return "$" + Math.round(v);
  }

  function donut(slices, centerValue, centerLabel) {
    var total = slices.reduce(function (t, s) { return t + s.value; }, 0);
    var S = 236, cx = S / 2, cy = S / 2, r = 88, sw = 26;
    var out = '<div class="chart donut" data-chart="donut" data-cid="' + chartId(slices) + '">';
    out += '<svg viewBox="0 0 ' + S + ' ' + S + '" role="img" aria-label="' + esc(centerLabel) + '">';
    if (total <= 0) {
      out += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--grid)" stroke-width="' + sw + '"></circle>';
    } else {
      var a0 = -Math.PI / 2;
      slices.forEach(function (s, i) {
        if (s.value <= 0) return;
        var a1 = a0 + (s.value / total) * Math.PI * 2;
        out += '<path class="seg" data-i="' + i + '" d="' + arcPath(cx, cy, r, a0, a1) + '" fill="none" stroke="' + s.color + '" stroke-width="' + sw + '"></path>';
        a0 = a1;
      });
    }
    out += '<text class="center-v" x="' + cx + '" y="' + (cy + 2) + '" text-anchor="middle">' + esc(centerValue) + "</text>";
    out += '<text class="center-l" x="' + cx + '" y="' + (cy + 20) + '" text-anchor="middle">' + esc(centerLabel.toUpperCase()) + "</text>";
    out += "</svg>" + chartTip() + "</div>";

    /* Every slice is direct-labeled with its value and share — the green
       and amber sit under 3:1 against the panel, so the key is not
       optional decoration, it is how the chart stays readable. */
    out += '<div class="donut-key">';
    slices.forEach(function (s) {
      out += '<div><i style="background:' + s.color + '"></i>' +
        '<span class="k">' + esc(s.label) + "</span>" +
        '<span class="v">' + esc(s.display || money(s.value)) + "</span>" +
        '<span class="p">' + esc(total > 0 ? pct(ratio(s.value, total), 0) : "—") + "</span></div>";
    });
    out += "</div>";
    return out;
  }
  function arcPath(cx, cy, r, a0, a1) {
    /* A 2px surface gap between segments keeps adjacent fills legible. */
    var gap = 0.018;
    if (a1 - a0 > gap * 2) { a0 += gap; a1 -= gap; }
    var x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    var x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    var large = (a1 - a0) > Math.PI ? 1 : 0;
    return "M" + x0.toFixed(2) + " " + y0.toFixed(2) + " A" + r + " " + r + " 0 " + large + " 1 " + x1.toFixed(2) + " " + y1.toFixed(2);
  }

  function barRows(rows, color) {
    if (!rows.length) return '<div class="empty"><p>Nothing in this range.</p></div>';
    var max = rows.reduce(function (t, r) { return Math.max(t, r.value); }, 0) || 1;
    var out = '<div class="stack">';
    rows.forEach(function (r) {
      out += '<div>' +
        '<div class="row" style="justify-content:space-between;gap:12px;margin-bottom:4px">' +
          '<span style="font-size:12.5px">' + esc(r.label) + '</span>' +
          '<span class="num" style="font-size:12.5px;font-weight:600">' + esc(r.display || money(r.value)) + '</span>' +
        '</div>' +
        '<div class="bar-mini" style="height:8px"><i style="width:' + (r.value / max * 100).toFixed(1) + '%;background:' + color + '"></i></div>' +
      '</div>';
    });
    return out + "</div>";
  }

  /* ------------------------------------------------------------ shell */
  function render() {
    chartData = {}; chartSeq = 0;
    if (ui.booting) { app.innerHTML = authShell('<p class="lede">Connecting to the company database…</p>'); return; }
    if (ui.dbError) { app.innerHTML = authShell(dbErrorBody()); return; }
    /* Each backend brings its own gate: the artifact has a passcode, the
       relay has a real account. Never both — two locks on one door is
       friction, not security. */
    if (store && store.mode === "relay") {
      if (!ui.signedIn) { app.innerHTML = authShell(signInBody()); focusFirst(); return; }
    } else if (!ui.unlocked) {
      app.innerHTML = authShell(ui.owner ? unlockBody() : setPasscodeBody());
      focusFirst();
      return;
    }

    var body;
    if (ui.tab === "loa") body = pageLOA();
    else if (ui.tab === "lt") body = pageLT();
    else if (ui.tab === "company") body = pageCompany();
    else if (ui.tab === "sync") body = pageSync();
    else body = pageOverview();

    app.innerHTML = masthead() + rail() + sampleBanner() + '<div class="wrap">' + body + "</div>" +
      (ui.toast ? '<div class="toast">' + esc(ui.toast) + "</div>" : "");
    wireCharts();
    capTables();
  }
  function focusFirst() {
    var el = app.querySelector("input");
    if (el) el.focus();
  }

  function authShell(inner) {
    return '<div class="auth-shell"><div class="auth-card">' +
      '<div class="auth-top"><div class="wordmark"><span class="bar"></span><span class="lock">' +
      "<h1>Thrive Command</h1><p>OWNER CONSOLE · THRIVE COMPANIES</p></span></div></div>" +
      '<div class="auth-body">' + inner + "</div></div></div>";
  }
  function dbErrorBody() {
    return '<div class="msg err">' + esc(ui.dbError) + "</div>" +
      '<p class="lede">This console reads a shared database that only opens inside claude.ai, for people signed in to the Thrive workspace. Open it from your artifact gallery and it will connect.</p>';
  }
  function setPasscodeBody() {
    return '<p class="lede">No owner passcode is set yet. Choose one now — it locks this console for everyone who opens it afterwards.</p>' +
      '<div class="field"><label for="pw1">Owner passcode</label><input type="password" id="pw1" autocomplete="new-password" placeholder="At least 8 characters"></div>' +
      '<div class="field"><label for="pw2">Type it again</label><input type="password" id="pw2" autocomplete="new-password"></div>' +
      '<div id="autherr"></div>' +
      '<button class="btn accent" data-act="setpw">Set passcode and open</button>' +
      '<p class="lede" style="font-size:12px">Stored as a PBKDF2-SHA256 hash over a random salt, never as the passcode itself. It keeps a casual reader out; the real lock is that this artifact is private to your workspace.</p>';
  }
  function signInBody() {
    return '<p class="lede">Company-wide numbers from the LOA desk and the Lead Tech board. Owners only.</p>' +
      '<div class="field"><label for="si-email">Email</label><input type="text" id="si-email" autocomplete="username" inputmode="email"></div>' +
      '<div class="field"><label for="si-pass">Password</label><input type="password" id="si-pass" autocomplete="current-password"></div>' +
      '<div id="autherr"></div>' +
      '<button class="btn accent" data-act="signin">Sign in</button>';
  }

  function unlockBody() {
    return '<p class="lede">Company-wide numbers from the LOA desk and the Lead Tech board. Owners only.</p>' +
      '<div class="field"><label for="pw1">Owner passcode</label><input type="password" id="pw1" autocomplete="current-password"></div>' +
      '<div id="autherr"></div>' +
      '<button class="btn accent" data-act="unlock">Open the console</button>';
  }

  function masthead() {
    return '<header class="mast"><div class="mast-in">' +
      '<div class="wordmark"><span class="bar"></span><span class="lock">' +
      "<h1>Thrive Command</h1><p>OWNER CONSOLE · THRIVE COMPANIES</p></span></div>" +
      '<div class="mast-right">' +
        '<span class="owner-chip"><i></i>OWNER VIEW · READ ONLY</span>' +
        '<button class="linkish" data-act="lock">' + (store && store.mode === "relay" ? "Sign out" : "Lock") + "</button>" +
      "</div></div></header>";
  }

  function isSample(snap) { return !!(snap && snap.isSample); }

  /* Sample figures sitting in a console full of real ones is how someone
     ends up quoting a made-up number in a real meeting. It gets said
     loudly, on every page, until it is cleared. */
  function sampleBanner() {
    var which = [];
    if (isSample(ui.loa)) which.push(SOURCES.loa.name);
    if (isSample(ui.lt)) which.push(SOURCES.lt.name);
    if (!which.length) return "";
    return '<div style="background:var(--warn-bg);border-bottom:1px solid var(--warn)">' +
      '<div style="max-width:1320px;margin:0 auto;padding:9px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--warn);font-size:12.5px;font-weight:600">' +
      "<span>Sample data loaded for " + esc(which.join(" and ")) +
      " — these are made-up figures for a look at the layout, not your business.</span>" +
      '<button class="btn sm" data-act="clearsample" style="background:var(--warn);border-color:var(--warn);color:#fff">Remove sample data</button>' +
      "</div></div>";
  }

  /* The strip that used to carry per-source sync times is gone: the
     console reloads its own data on a timer, so an owner should never
     have to read a freshness stamp to trust the page. The Sync & sources
     tab still shows exactly when each portal last landed. */
  /* The artifact pushes changes live, so a slow backstop is enough. The
     relay has no push channel, so the poll IS the sync — keep it short
     enough that a portal write shows up while you are still looking. */
  var REFRESH_ARTIFACT_MS = 15 * 60 * 1000;
  var REFRESH_RELAY_MS = 60 * 1000;
  function refreshInterval() { return store && store.mode === "relay" ? REFRESH_RELAY_MS : REFRESH_ARTIFACT_MS; }
  function refreshData() {
    /* `db` is the artifact database and is null on the relay build, so
       gating on it here meant the poll did nothing on the deployed
       console — it only ever picked up changes on a page reload. The
       store is what both homes have. */
    if (!store) return Promise.resolve();
    /* One render once both have landed, rather than one each: the two
       arriving a moment apart made the page jump twice. */
    return Promise.all([
      store.get(SOURCES.loa.doc).then(function (d) { ui.loa = d; }).catch(function () {}),
      store.get(SOURCES.lt.doc).then(function (d) { ui.lt = d; }).catch(function () {})
    ]).then(function () { render(); });
  }

  /* The poll is every minute on the relay and every fifteen on the
     artifact, which is fine for watching and too slow for checking. This
     is for the moment you have just saved something in a portal and want
     to see it here now. */
  function refreshNow() {
    if (ui.refreshing || !store) return;
    ui.refreshing = true;
    render();
    var startedAt = Date.now();
    refreshData().then(function () {
      /* A label that appears and vanishes inside 50ms reads as nothing
         having happened at all, so let it be seen. */
      setTimeout(function () {
        ui.refreshing = false;
        render();
        toast("Refreshed");
      }, Math.max(0, 450 - (Date.now() - startedAt)));
    });
  }

  function refreshButton() {
    /* Nothing to refresh from before a store is open — offering a button
       that silently does nothing is worse than not offering one. */
    if (!store) return "";
    return '<button class="btn ghost sm" data-act="refresh"' +
      (ui.refreshing ? ' disabled aria-busy="true"' : "") + '>' +
      (ui.refreshing ? "Refreshing\u2026" : "Refresh") + "</button>";
  }

  function rail() {
    var tabs = [
      { k: "overview", label: "Overview" },
      { k: "loa", label: "LOA Program" },
      { k: "lt", label: "Lead Tech" },
      { k: "company", label: "Thrive Companies" },
      { k: "sync", label: "Sync & sources" }
    ];
    var out = '<nav class="rail"><div class="rail-in">';
    tabs.forEach(function (t) {
      out += '<button data-act="tab" data-tab="' + t.k + '"' + (ui.tab === t.k ? ' aria-current="page"' : "") + ">" +
        esc(t.label) + "</button>";
    });
    return out + "</div></nav>";
  }

  /* Every page carries this control, in the same place, so switching tabs
     never moves the thing you were just using. */
  function rangePicker() {
    var out = '<div class="rangebox">';
    out += '<div class="seg" role="group" aria-label="Date range">';
    RANGES.forEach(function (r) {
      out += '<button data-act="range" data-range="' + r.k + '" aria-pressed="' + (ui.range === r.k) + '">' + esc(r.label) + "</button>";
    });
    out += "</div>";
    if (ui.range === "custom") {
      var t = todayISO();
      out += '<div class="daterow">' +
        '<label><span>From</span><input type="date" data-act="customdate" data-which="from" value="' +
          esc(ui.customFrom || addDays(t, -89)) + '" max="' + esc(t) + '"></label>' +
        '<label><span>To</span><input type="date" data-act="customdate" data-which="to" value="' +
          esc(ui.customTo || t) + '" max="' + esc(t) + '"></label>' +
        "</div>";
    }
    return out + "</div>";
  }

  function notSynced(which) {
    var src = SOURCES[which];
    return '<div class="panel"><div class="empty">' +
      "<strong>" + esc(src.name) + " has not synced yet</strong>" +
      "<p>Nothing has been written into this console from that portal. Open <b>Sync &amp; sources</b> to see how it feeds in, or paste a snapshot there to fill it in now.</p>" +
      '<p style="margin-top:14px"><button class="btn ghost sm" data-act="tab" data-tab="sync">Go to Sync &amp; sources</button></p>' +
      "</div></div>";
  }

  /* Thrive Companies is its own business with its own books. What used to
     stand in for it here was LOA production re-costed at the house
     contract — an estimate of one business from another's numbers, which
     is not the same thing and read as though it were measured. It stays
     blank until its own source is connected. */
  function brokerageNotConnected() {
    return '<div class="panel"><div class="empty">' +
      "<strong>Thrive Companies is not connected yet</strong>" +
      "<p>These figures were being estimated from LOA production at the house contract, which is a different business. They will appear here once Thrive Companies has a source of its own.</p>" +
      "</div></div>";
  }

  /* ---------------------------------------------------------- Overview */
  function pageOverview() {
    if (!hasLOA() && !hasLT()) {
      return pageHead("Overview") +
        '<div class="panel"><div class="empty">' +
        "<strong>Nothing has synced into this console yet</strong>" +
        "<p>Thrive Command mirrors the LOA Producer Desk and the Lead Tech Fulfillment board. Once either one syncs, the company-wide numbers appear here.</p>" +
        '<p style="margin-top:14px"><button class="btn accent sm" data-act="tab" data-tab="sync">Open Sync &amp; sources</button></p>' +
        "</div></div>";
    }

    var w = rangeWindow();
    var lm = hasLOA() ? loaMetrics(w.from, w.to) : null;
    var tm = hasLT() ? ltMetrics(w.from, w.to) : null;
    var loaProfit = lm ? lm.net : 0;
    var ltPnl = tm ? tm.pnl : 0;
    var companyNet = loaProfit + ltPnl;
    /* The same three figures over the period before this one, so each
       section can say which way it is moving. */
    var pw = priorWindow(w);
    var plm = hasLOA() ? loaMetrics(pw.from, pw.to) : null;
    var ptm = hasLT() ? ltMetrics(pw.from, pw.to) : null;
    var org = loaOrg();
    var set = ltSettings();

    var out = pageHead("Overview", rangePicker());

    /* The period's bottom line, and beside it the whole history it came
       from — the tiles below answer "how", this answers "which way". */
    out += '<div class="headline">';
    out += hero("Company net · " + w.label, money(companyNet), "LOA profit plus the Lead Tech call ledger.", [
      { k: "LOA profit", v: lm ? money(loaProfit) : "—" },
      { k: "Lead Tech P&L", v: tm ? money(ltPnl) : "—" }
    ], companyNet < 0);
    out += lifetimePanel("company", "Company profit, day by day");
    out += "</div>";

    /* ---- 1. LOA ---- */
    out += sectionHead("LOA", "Thrive Companies LOA", "Written business and what it cost to feed the producers.",
      lm ? growthChip(lm.net, plm ? plm.net : 0, "profit", pw.label) : "");
    if (!lm) {
      out += notSynced("loa");
    } else {
      out += '<div class="tiles">';
      out += tile("src-loa", "LOA written premium", money(lm.apWritten), intf(lm.written) + " policies · " + money(lm.mpWritten) + "/mo");
      out += tile("src-loa", "LOA marketing cost", money(lm.marketingCost), intf(lm.callsTaken) + " inbound calls at " + money(org.costPerCall));
      out += tile("src-loa", "LOA agent commission", money(lm.agentCommPaid), "paid out on " + intf(lm.paid.length) + " issued policies");
      out += tile(lm.net >= 0 ? "is-good" : "is-bad", "LOA profit", money(lm.net), "commission spread less marketing", lm.net < 0 ? "neg" : "pos");
      out += "</div>";
    }

    /* ---- 2. Brokerage ---- */
    if (!hasBrokerage()) {
      out += sectionHead("Brokerage", "Thrive Companies brokerage", "Its own book, once it has a source here.");
      out += brokerageNotConnected();
    } else {
      var bm = brokerageMetrics(w.from, w.to);
      var pbm = brokerageMetrics(pw.from, pw.to);
      out += sectionHead("Brokerage", "Thrive Companies brokerage", "Deals sold and what the average one is worth, logged day by day.",
        growthChip(bm.deals, pbm.deals, "deals sold", pw.label));
      out += '<div class="tiles t3">';
      out += tile("src-loa", "Total deals sold", intf(bm.deals), bm.rows.length + " day" + (bm.rows.length === 1 ? "" : "s") + " logged \u00b7 " + w.label.toLowerCase());
      out += tile("src-loa", "Average deal monthly premium", money(bm.avgMp, 2), "weighted across those deals");
      out += tile("is-good", "Annual premium written", money(bm.apTotal), money(bm.mpTotal) + "/mo \u00d7 12", "pos");
      out += "</div>";
    }

    /* ---- 3. Lead Tech ---- */
    out += sectionHead("Lead Tech", "Lead Tech Google Calls", "Calls bought at " + money(set.callCost) + ", sold at " + money(set.callPrice) + ", less everything handed back.",
      tm ? growthChip(tm.pnl, ptm ? ptm.pnl : 0, "profit", pw.label) : "");
    if (!tm) {
      out += notSynced("lt");
    } else {
      out += '<div class="tiles t3">';
      out += tile("src-lt", "Inbound calls taken", intf(tm.callsBought), intf(tm.callsSold) + " of them sold on to agents");
      out += tile("src-lt", "Total spent on calls", money(tm.callSpend), intf(tm.callsBought) + " bought at " + money(set.callCost));
      out += tile("src-lt", "Total cash collected", money(tm.callRevenue), intf(tm.callsSold) + " sold at " + money(set.callPrice));
      out += tile("is-warn", "Total refunds", money(tm.refunded),
        tm.callsRefunded ? intf(tm.callsRefunded) + " calls refunded" : intf(tm.refunds.length) + " refunds");
      out += tile("is-good", "Total wiped wallet", money(tm.wiped), intf(tm.wipeRows.length) + " wipes — unspent balance Lead Tech keeps", tm.wiped > 0 ? "pos" : "");
      out += tile(tm.pnl >= 0 ? "is-good" : "is-bad", "Lead Tech profit & loss", money(tm.pnl), "collected and wipes, less spend and refunds", tm.pnl < 0 ? "neg" : "pos");
      out += "</div>";
      if (tm.collected > 0) {
        out += '<p style="margin:12px 0 0;font-size:12.5px;color:var(--muted);max-width:70ch">' +
          "Product and subscription orders are the fulfillment side and are not in this ledger — " +
          esc(money(tm.collected)) + ' collected across ' + esc(intf(tm.count)) + ' orders sits on the ' +
          '<button class="linkbtn" data-act="tab" data-tab="lt">Lead Tech</button> tab.</p>';
      }
    }

    return out;
  }

  /* Company profit for every day on record, ignoring the range picker —
     the point of it is the shape of the whole run, not the window. */
  function lifetimeProfitByDay(scope) {
    var first = "";
    loaDeals().forEach(function (d) { var x = toISODate(d.date); if (x && (!first || x < first)) first = x; });
    loaCalls().forEach(function (c) { var x = toISODate(c.date); if (x && (!first || x < first)) first = x; });
    ltCalls().forEach(function (c) { if (c.date && (!first || c.date < first)) first = c.date; });
    if (!first) return null;

    var to = todayISO();
    if (first > to) first = to;
    /* Keep the series to a length a small chart can actually draw. */
    var span = Math.round((new Date(to + "T12:00:00") - new Date(first + "T12:00:00")) / 86400000);
    if (span > 365) first = addDays(to, -365);

    var days = [], index = {}, cur = first;
    while (cur <= to) {
      index[cur] = days.length;
      days.push({ date: cur, label: prettyDate(cur), value: 0 });
      cur = addDays(cur, 1);
    }

    var org = loaOrg(), set = ltSettings();
    var wantLOA = scope !== "lt", wantLT = scope !== "loa";

    if (wantLOA) {
      loaDeals().forEach(function (d) {
        if (statusOf(d.status).group !== "paid") return;
        var i = index[toISODate(d.date)];
        if (i != null) days[i].value += spreadOn(d);
      });
      loaCalls().forEach(function (c) {
        var i = index[toISODate(c.date)];
        if (i != null) days[i].value -= num(c.calls) * org.costPerCall;
      });
    }
    if (wantLT) {
      ltCalls().forEach(function (c) {
        var i = index[c.date];
        if (i != null) days[i].value += c.sold * set.callPrice - c.bought * set.callCost;
      });
      ltRefunds().forEach(function (r) { var i = index[r.date]; if (i != null) days[i].value -= r.amount; });
      ltWipes().forEach(function (x) { var i = index[x.date]; if (i != null) days[i].value += x.amount; });
    }
    return days;
  }

  /* The same chart sits beside the hero on every dashboard, scoped to
     whatever that page is about: the tiles say how the period went, this
     says which way the whole thing has been running. */
  function lifetimePanel(scope, title) {
    var days = lifetimeProfitByDay(scope);
    if (!days || days.length < 2) {
      return '<section class="panel"><div class="panel-head"><h3>' + esc(title) + "</h3></div>" +
        '<div class="empty"><p>Not enough history yet to draw a line.</p></div></section>';
    }
    var color = scope === "lt" ? "var(--s-lt)" : "var(--s-loa)";
    var fill = scope === "lt" ? "var(--lt-fill)" : "var(--loa-fill)";
    var total = days.reduce(function (t, d) { return t + d.value; }, 0);
    var best = days.reduce(function (a, b) { return b.value > a.value ? b : a; });
    return '<section class="panel"><div class="panel-head"><h3>' + esc(title) + "</h3>" +
      '<span class="note">' + esc(intf(days.length)) + " days on record</span></div>" +
      '<div class="panel-body">' +
      lineChart(days, [{
        label: title, color: color, fill: fill,
        values: days.map(function (d) { return d.value; })
      }], { legend: false, height: 168 }) +
      '<p style="margin:10px 0 0;font-size:12px;color:var(--muted)">' +
        esc(money(total)) + " all in · best day " + esc(prettyDate(best.date)) + " at " + esc(money(best.value)) +
      "</p></div></section>";
  }

  function sectionHead(eyebrow, title, sub, right) {
    return '<div class="section-head"><div><p class="eyebrow">' + esc(eyebrow) + "</p>" +
      "<h3>" + esc(title) + '</h3><p class="sub">' + sub + "</p></div>" +
      (right || "") + "</div>";
  }

  /* Title and range control only. The explanatory sentence that used to
     sit under each title is gone — an owner who opens this every day
     does not need the page explained to them again. */
  function pageHead(title, right) {
    return '<div class="page-head"><div><p class="eyebrow">Thrive Companies</p>' +
      "<h2>" + esc(title) + "</h2></div>" +
      '<div class="headtools">' + refreshButton() + (right || "") + "</div></div>";
  }
  /* Every dashboard opens the same way: the period's bottom line, big,
     with two or three supporting figures under a rule. Same shape on
     Overview, LOA, Lead Tech and Thrive Companies, so the eye lands in
     the same place whichever tab you open. */
  /* `negative` is deliberately three-valued: true is red, false is green,
     and leaving it off keeps the figure white — a hero that is not a
     profit should not be coloured as though it were one. */
  function hero(label, value, foot, splits, negative, style) {
    var tone = negative === true ? " neg" : negative === false ? " pos" : "";
    var out = '<div class="hero"' + (style ? ' style="' + style + '"' : "") + '>' +
      '<p class="eyebrow">' + esc(label) + "</p>" +
      '<span class="v' + tone + '">' + esc(value) + "</span>" +
      '<span class="foot">' + esc(foot) + "</span>";
    if (splits && splits.length) {
      out += '<div class="split">';
      splits.forEach(function (s) { out += "<div>" + esc(s.k) + "<b>" + esc(s.v) + "</b></div>"; });
      out += "</div>";
    }
    return out + "</div>";
  }

  function tile(cls, label, value, foot, tone) {
    return '<div class="tile ' + cls + '"><p class="eyebrow">' + esc(label) + "</p>" +
      '<span class="v' + (tone ? " " + tone : "") + '">' + esc(value) + "</span>" +
      '<span class="foot">' + esc(foot || "") + "</span></div>";
  }

  /* ------------------------------------------------------ LOA production */
  function pageLOA() {
    if (!hasLOA()) return pageHead("LOA Program") + notSynced("loa");
    var w = rangeWindow(), m = loaMetrics(w.from, w.to), org = loaOrg();

    var out = pageHead("LOA Program", rangePicker());

    out += '<div class="headline">';
    out += hero("LOA profit · " + w.label, money(m.net), "Commission spread the house kept, less what the calls cost.", [
      { k: "Written premium", v: money(m.apWritten) },
      { k: "Policies", v: intf(m.written) },
      { k: "Placement", v: pct(m.placement, 0) }
    ], m.net < 0);
    out += lifetimePanel("loa", "LOA profit, day by day");
    out += "</div>";

    out += '<div class="tiles">';
    out += tile("src-loa", "Written premium", money(m.apWritten), intf(m.written) + " policies · " + money(m.mpWritten) + "/mo");
    out += tile("src-loa", "Advanced premium", money(m.advPaid), Math.round(org.advanceRate * 100) + "% advance on issued business");
    out += tile("src-loa", "House commission", money(m.houseGrossPaid), "gross, before agent splits");
    out += tile("src-loa", "Agent commission", money(m.agentCommPaid), "paid out on issued business");
    out += tile("is-good", "Commission spread", money(m.spreadPaid), "house keeps this");
    out += tile("src-loa", "Call spend", money(m.marketingCost), intf(m.callsTaken) + " calls at " + money(org.costPerCall));
    out += tile(m.placement >= 70 ? "is-good" : "is-warn", "Placement rate", pct(m.placement), "of settled premium stuck");
    out += tile(m.net >= 0 ? "is-good" : "is-bad", "Net after marketing", money(m.net), "spread minus call spend", m.net < 0 ? "neg" : "pos");
    out += "</div>";

    /* agents */
    out += '<div class="section-head"><p class="eyebrow">By producer</p><h3>Who wrote what</h3>' +
      '<p class="sub">Ranked by the spread the house kept after their split.</p></div>';
