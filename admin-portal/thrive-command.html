    var rows = loaAgents().map(function (a) {
      var am = loaMetrics(w.from, w.to, [a.id]);
      return { agent: a, m: am };
    }).filter(function (r) { return r.m.written > 0 || r.m.callsTaken > 0; })
      .sort(function (x, y) { return y.m.spreadPaid - x.m.spreadPaid; });

    if (!rows.length) {
      out += '<div class="panel"><div class="empty"><strong>No production in this range</strong><p>Widen the range to see earlier business.</p></div></div>';
    } else {
      out += '<div class="panel"><div class="panel-body flush"><div class="tblwrap"><table class="data"><thead><tr>' +
        "<th>Producer</th><th>Contract</th><th class=\"n\">Calls</th><th class=\"n\">Written</th><th class=\"n\">Written AP</th>" +
        "<th class=\"n\">Paid AP</th><th class=\"n\">Agent comm</th><th class=\"n\">Spread</th><th>Placement</th>" +
        "</tr></thead><tbody>";
      rows.forEach(function (r) {
        var p = r.m.placement;
        out += "<tr><td class=\"who\">" + esc(r.agent.name) + '<div class="dim">' + esc(r.agent.role === "admin" ? "Admin" : "Producer") + " · " + esc(r.agent.status || "active") + "</div></td>" +
          '<td class="num">' + esc(r.agent.level || "—") + "%</td>" +
          '<td class="n">' + esc(intf(r.m.callsTaken)) + "</td>" +
          '<td class="n">' + esc(intf(r.m.written)) + "</td>" +
          '<td class="n">' + esc(money(r.m.apWritten)) + "</td>" +
          '<td class="n">' + esc(money(r.m.apPaid)) + "</td>" +
          '<td class="n">' + esc(money(r.m.agentCommPaid)) + "</td>" +
          '<td class="n">' + esc(money(r.m.spreadPaid)) + "</td>" +
          '<td><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="bar-mini" style="flex:1 1 54px"><i class="' + (p >= 70 ? "good" : p < 50 ? "bad" : "") + '" style="width:' + Math.min(100, p).toFixed(0) + '%"></i></div>' +
          '<span class="num" style="font-size:12px">' + esc(pct(p, 0)) + "</span></div></td></tr>";
      });
      var tot = m;
      out += '<tr class="total"><td>All producers</td><td class="num">—</td>' +
        '<td class="n">' + esc(intf(tot.callsTaken)) + '</td><td class="n">' + esc(intf(tot.written)) + "</td>" +
        '<td class="n">' + esc(money(tot.apWritten)) + '</td><td class="n">' + esc(money(tot.apPaid)) + "</td>" +
        '<td class="n">' + esc(money(tot.agentCommPaid)) + '</td><td class="n">' + esc(money(tot.spreadPaid)) + "</td>" +
        "<td>" + esc(pct(tot.placement, 0)) + "</td></tr>";
      out += "</tbody></table></div></div></div>";
    }

    /* carrier mix */
    var byCarrier = {};
    m.deals.forEach(function (d) {
      var k = d.carrierId || "—";
      byCarrier[k] = byCarrier[k] || { ap: 0, n: 0, spread: 0 };
      byCarrier[k].ap += num(d.ap);
      byCarrier[k].n += 1;
      if (statusOf(d.status).group === "paid") byCarrier[k].spread += spreadOn(d);
    });
    var carrierRows = Object.keys(byCarrier).map(function (k) {
      return { label: carrierName(k) + "  ·  " + byCarrier[k].n + " policies", value: byCarrier[k].ap };
    }).sort(function (a, b) { return b.value - a.value; });
    var shown = carrierRows.slice(0, 8);
    if (carrierRows.length > 8) {
      var rest = carrierRows.slice(8).reduce(function (t, r) { return t + r.value; }, 0);
      shown.push({ label: "Other carriers  ·  " + (carrierRows.length - 8), value: rest });
    }

    out += '<div class="charts c2" style="margin-top:18px">';
    out += '<section class="panel"><div class="panel-head"><h3>Carrier mix</h3><span class="note">Written premium</span></div>' +
      '<div class="panel-body">' + barRows(shown, "var(--s-loa)") + "</div></section>";

    var slices = [
      { label: "Issued & paid", value: m.apPaid, color: "var(--paid)" },
      { label: "Still pending", value: m.apPending, color: "var(--pipe)" },
      { label: "Fell off", value: m.apLost, color: "var(--fell)" }
    ];
    out += '<section class="panel"><div class="panel-head"><h3>Outcome</h3><span class="note">Annualized premium</span></div>' +
      '<div class="panel-body">' + donut(slices, shortMoney(m.apWritten), "written AP") + "</div></section>";
    out += "</div>";

    /* deals */
    out += '<div class="section-head"><p class="eyebrow">Policy ledger</p><h3>Every deal in the range</h3>' +
      '<p class="sub">Read-only. Corrections belong in the Producer Desk — this console mirrors whatever the desk last said.</p></div>';

    out += '<div class="filters">' +
      '<div class="field"><label for="f-status">Status</label><select id="f-status" data-filter="dealStatus">' +
        '<option value="">Any status</option>' +
        Object.keys(LOA_STATUS).map(function (k) {
          return '<option value="' + k + '"' + (ui.filters.dealStatus === k ? " selected" : "") + ">" + esc(LOA_STATUS[k].label) + "</option>";
        }).join("") + "</select></div>" +
      '<div class="field"><label for="f-agent">Producer</label><select id="f-agent" data-filter="dealAgent">' +
        '<option value="">Everyone</option>' +
        loaAgents().map(function (a) {
          return '<option value="' + esc(a.id) + '"' + (ui.filters.dealAgent === a.id ? " selected" : "") + ">" + esc(a.name) + "</option>";
        }).join("") + "</select></div>" +
      '<div class="field searchbox"><label for="f-q">Search</label>' +
        '<input type="search" id="f-q" data-filter="dealQuery" value="' + esc(ui.filters.dealQuery) + '" placeholder="Client, policy number or carrier"></div>' +
      "</div>";

    var q = ui.filters.dealQuery.trim().toLowerCase();
    var list = m.deals.filter(function (d) {
      if (ui.filters.dealStatus && d.status !== ui.filters.dealStatus) return false;
      if (ui.filters.dealAgent && d.agentId !== ui.filters.dealAgent) return false;
      if (q) {
        var hay = (d.client + " " + (d.policyNo || "") + " " + carrierName(d.carrierId) + " " + (d.product || "")).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    }).sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });

    if (!list.length) {
      out += '<div class="panel"><div class="empty"><strong>No deals match</strong><p>Clear a filter or widen the range.</p></div></div>';
    } else {
      out += '<div class="panel"><div class="panel-body flush"><div class="tblwrap"><table class="data"><thead><tr>' +
        "<th>Date</th><th>Client</th><th>Producer</th><th>Carrier &amp; product</th><th class=\"n\">Monthly</th>" +
        "<th class=\"n\">Annualized</th><th class=\"n\">Agent</th><th class=\"n\">House</th><th class=\"n\">Spread</th><th>Status</th>" +
        "</tr></thead><tbody>";
      list.forEach(function (d) {
        var s = statusOf(d.status);
        out += "<tr><td class=\"nowrap dim\">" + esc(prettyDate(d.date)) + "</td>" +
          '<td class="who">' + esc(d.client) + (d.policyNo ? '<div class="dim">' + esc(d.policyNo) + "</div>" : "") + "</td>" +
          "<td>" + esc(agentName(d.agentId)) + "</td>" +
          "<td>" + esc(carrierName(d.carrierId)) + '<div class="dim">' + esc(d.product || "") + "</div></td>" +
          '<td class="n">' + esc(money(d.mp)) + "</td>" +
          '<td class="n">' + esc(money(d.ap)) + "</td>" +
          '<td class="n">' + esc(money(agentCommOn(d))) + '<div class="dim">' + esc(d.agentPct) + "%</div></td>" +
          '<td class="n">' + esc(money(houseCommOn(d))) + '<div class="dim">' + esc(d.housePct) + "%</div></td>" +
          '<td class="n">' + esc(money(spreadOn(d))) + "</td>" +
          '<td><span class="pill ' + s.tone + '">' + esc(s.label) + "</span></td></tr>";
      });
      out += "</tbody></table></div></div></div>";
    }
    return out;
  }

  /* -------------------------------------------------------- Lead Tech */
  function pageLT() {
    if (!hasLT()) return pageHead("Lead Tech") + notSynced("lt");
    var w = rangeWindow(), m = ltMetrics(w.from, w.to), set = ltSettings();

    var out = pageHead("Lead Tech", rangePicker());

    /* The bottom line first — this business lives or dies on the gap
       between what a call costs and what it sells for. */
    out += '<div class="headline">';
    out += hero("Lead Tech net profit · " + w.label, money(m.pnl),
      "Calls sold and wiped wallets, less calls bought and refunds.", [
        { k: "Calls sold", v: intf(m.callsSold) },
        { k: "Calls bought", v: intf(m.callsBought) },
        { k: "Margin", v: m.margin == null ? "—" : pct(m.margin, 0) }
      ], m.pnl < 0);
    out += lifetimePanel("lt", "Lead Tech profit, day by day");
    out += "</div>";

    /* Money in on the left, money out on the right, the call counts
       under the figures they explain, and the net across the bottom —
       read it down a column or across a row and it still adds up. */
    out += '<div class="ledger">';
    out += tile("src-lt", "Collected", money(m.callRevenue), "cash in from calls sold");
    out += tile("src-lt", "Spent", money(m.callSpend), "cash out buying calls");
    out += tile("src-lt", "Calls sold", intf(m.callsSold), "agents bought these at " + money(set.callPrice));
    out += tile("src-lt", "Calls purchased", intf(m.callsBought), "Lead Tech bought these at " + money(set.callCost));
    out += tile(m.wiped > 0 ? "is-good" : "src-lt", "Wallet wipes", money(m.wiped),
      intf(m.wipeRows.length) + " wipes — unspent balance kept", m.wiped > 0 ? "pos" : "");
    out += tile(m.refunded > 0 ? "is-warn" : "src-lt", "Total refunds", money(m.refunded),
      (m.callsRefunded ? intf(m.callsRefunded) + " calls refunded" : intf(m.refunds.length) + " refunds"));
    out += '<div class="span2">' +
      tile(m.pnl >= 0 ? "is-good" : "is-bad", "Fulfillment net", money(m.pnl),
        "collected and wallet wipes, less spent and refunds", m.pnl < 0 ? "neg" : "pos") +
      "</div>";
    out += "</div>";

    /* ---- the daily call ledger ---- */
    out += '<div class="section-head"><p class="eyebrow">Call ledger</p><h3>Day by day</h3>' +
      '<p class="sub">Straight from the Calls tab on the board. The gap column is calls sold less calls bought — ' +
      "sell more than you buy and the day pays for itself.</p></div>";

    if (!m.callRows.length) {
      out += '<div class="panel"><div class="empty"><strong>No call days logged in this range</strong>' +
        "<p>Nothing has been entered on the board's Calls tab for these dates.</p></div></div>";
    } else {
      var days = m.callRows.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
      out += '<div class="panel"><div class="panel-body flush"><div class="tblwrap"><table class="data"><thead><tr>' +
        '<th>Day</th><th class="n">Bought</th><th class="n">Sold</th><th class="n">Gap</th>' +
        '<th class="n">Spent</th><th class="n">Collected</th><th class="n">Profit</th>' +
        "</tr></thead><tbody>";
      days.slice(0, 120).forEach(function (c) {
        var spend = c.bought * set.callCost, rev = c.sold * set.callPrice, p = rev - spend;
        var gap = c.sold - c.bought;
        out += "<tr><td class=\"nowrap dim\">" + esc(prettyDate(c.date)) + "</td>" +
          '<td class="n">' + esc(intf(c.bought)) + '</td><td class="n">' + esc(intf(c.sold)) + "</td>" +
          '<td class="n" style="color:' + (gap >= 0 ? "var(--good)" : "var(--bad)") + '">' + (gap > 0 ? "+" : "") + esc(intf(gap)) + "</td>" +
          '<td class="n">' + esc(money(spend)) + '</td><td class="n">' + esc(money(rev)) + "</td>" +
          '<td class="n"><b>' + esc(money(p)) + "</b></td></tr>";
      });
      out += '<tr class="total"><td>' + esc(intf(m.callRows.length)) + " days</td>" +
        '<td class="n">' + esc(intf(m.callsBought)) + '</td><td class="n">' + esc(intf(m.callsSold)) + "</td>" +
        '<td class="n">' + ((m.callsSold - m.callsBought) > 0 ? "+" : "") + esc(intf(m.callsSold - m.callsBought)) + "</td>" +
        '<td class="n">' + esc(money(m.callSpend)) + '</td><td class="n">' + esc(money(m.callRevenue)) + "</td>" +
        '<td class="n">' + esc(money(m.callRevenue - m.callSpend)) + "</td></tr>";
      out += "</tbody></table></div>";
      if (days.length > 120) out += '<div class="panel-body" style="border-top:1px solid var(--line)"><span style="color:var(--muted);font-size:12px">The 120 most recent of ' + esc(intf(days.length)) + " days.</span></div>";
      out += "</div></div>";
    }

    /* ---- wiped wallets ---- */
    if (m.wipeRows.length) {
      out += '<div class="section-head"><p class="eyebrow">Wiped wallets</p><h3>Credit cleared, cash kept</h3>' +
        '<p class="sub">Unspent balance written off a customer\'s wallet. The money was collected and stays collected — what ends is the obligation to deliver calls against it — so it counts as profit, not as a refund.</p></div>';
      out += '<div class="panel"><div class="panel-body flush"><div class="tblwrap"><table class="data">' +
        '<thead><tr><th>Date</th><th>Who</th><th>Reason</th><th class="n">Amount</th></tr></thead><tbody>';
      m.wipeRows.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); }).forEach(function (x) {
        out += "<tr><td class=\"nowrap dim\">" + esc(prettyDate(x.date)) + "</td>" +
          '<td class="who">' + esc(x.customer) + "</td><td>" + esc(x.reason || "—") + "</td>" +
          '<td class="n">' + esc(money(x.amount, 2)) + "</td></tr>";
      });
      out += '<tr class="total"><td colspan="3">All wipes</td><td class="n">' + esc(money(m.wiped, 2)) + "</td></tr>";
      out += "</tbody></table></div></div></div>";
    }

    /* ---- fulfillment orders (the other side of the board) ---- */
    var byProd = {};
    m.orders.forEach(function (o) {
      if (!o.paid) return;
      var k = o.product || "—";
      byProd[k] = byProd[k] || { value: 0, n: 0 };
      byProd[k].value += o.amount;
      byProd[k].n += 1;
    });
    var prodRows = Object.keys(byProd).map(function (k) {
      return { label: k + "  ·  " + byProd[k].n + " orders", value: byProd[k].value };
    }).sort(function (a, b) { return b.value - a.value; });

    if (prodRows.length) {
      out += '<div class="section-head"><p class="eyebrow">Fulfillment orders</p><h3>Products and subscriptions</h3>' +
        '<p class="sub">The other half of the board — campaigns, subscriptions and software, kept out of the call ledger above so neither figure absorbs the other.</p></div>';
      out += '<div class="panel"><div class="panel-head"><h3>Revenue by product</h3><span class="note">' +
        esc(money(m.collected)) + " collected across " + esc(intf(m.count)) + ' orders</span></div>' +
        '<div class="panel-body">' + barRows(prodRows, "var(--s-lt)") + "</div></div>";
    }

    return out;
  }

  /* -------------------------------------------------- Thrive Companies */
  /* The holding company's own scorecard: one profit and loss across both
     businesses, then where the house's commission actually came from. */
  function pageCompany() {
    var w = rangeWindow();
    var lm = hasLOA() ? loaMetrics(w.from, w.to) : null;
    var tm = hasLT() ? ltMetrics(w.from, w.to) : null;
    var out = pageHead("Thrive Companies", rangePicker());

    if (!lm && !tm) return out + notSynced("loa");

    var loaProfit = lm ? lm.net : 0;
    var ltPnl = tm ? tm.pnl : 0;
    var companyNet = loaProfit + ltPnl;
    /* The carrier keeps 25% of first-year commission back and pays it as
       the policy earns. It is real money already written, just not yet
       in the bank — so it is a memo line, never in the net. */
    var tail = lm ? (lm.houseFullPaid - lm.houseGrossPaid) : 0;

    out += '<div class="headline">';
    out += hero("Company net · " + w.label, money(companyNet),
      "Both businesses, after everything paid out.", [
        { k: "LOA profit", v: lm ? money(loaProfit) : "—" },
        { k: "Lead Tech P&L", v: tm ? money(ltPnl) : "—" },
        { k: "Still to come", v: lm ? money(tail) : "—" }
      ], companyNet < 0);
    out += lifetimePanel("company", "Company profit, day by day");
    out += "</div>";

    if (!hasBrokerage()) {
      out += '<div class="section-head"><div><p class="eyebrow">Brokerage</p><h3>The brokerage book</h3>' +
        '<p class="sub">Its own numbers, once it has a source here.</p></div></div>';
      out += brokerageNotConnected();
    } else {
      var bm = brokerageMetrics(w.from, w.to);
      out += '<div class="section-head"><div><p class="eyebrow">Brokerage</p><h3>The brokerage book</h3>' +
        '<p class="sub">Deals sold and the average monthly premium behind them, logged day by day.</p></div></div>';
      out += '<div class="tiles t3">';
      out += tile("src-loa", "Total deals sold", intf(bm.deals), bm.rows.length + " day" + (bm.rows.length === 1 ? "" : "s") + " logged");
      out += tile("src-loa", "Average deal monthly premium", money(bm.avgMp, 2), "weighted across those deals");
      out += tile("is-good", "Annual premium written", money(bm.apTotal), money(bm.mpTotal) + "/mo \u00d7 12", "pos");
      out += "</div>";
    }

    /* ---- the P&L itself ---- */
    out += '<div class="section-head"><p class="eyebrow">Profit and loss</p><h3>Where the money went</h3>' +
      '<p class="sub">Money in, money out, in the order it moves. Memo lines are marked and are not part of the net.</p></div>';

    function plRow(label, note, amount, kind) {
      var cls = kind === "total" ? ' class="total"' : "";
      var v = kind === "memo" ? '<span class="dim">' + esc(money(amount)) + "</span>" : esc(money(amount));
      return "<tr" + cls + '><td class="who">' + esc(label) +
        (note ? '<div class="dim">' + esc(note) + "</div>" : "") + "</td>" +
        '<td class="n">' + v + "</td>" +
        "<td>" + (kind === "memo" ? '<span class="pill">memo</span>' : kind === "out" ? '<span class="pill bad">out</span>' : kind === "in" ? '<span class="pill good">in</span>' : "") + "</td></tr>";
    }

    out += '<div class="panel"><div class="panel-body flush"><div class="tblwrap"><table class="data pl">' +
      '<thead><tr><th>Line</th><th class="n">Amount</th><th></th></tr></thead><tbody>';

    if (lm) {
      out += '<tr><td colspan="3" style="background:var(--mist);font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)">LOA program</td></tr>';
      out += plRow("Written premium", intf(lm.written) + " policies written", lm.apWritten, "memo");
      out += plRow("Thrive upfront commission", "house cut of the " + Math.round(loaOrg().advanceRate * 100) + "% advance", lm.houseGrossPaid, "in");
      out += plRow("Agent commission", "paid out to producers", -lm.agentCommPaid, "out");
      out += plRow("Inbound call spend", intf(lm.callsTaken) + " calls at " + money(loaOrg().costPerCall), -lm.marketingCost, "out");
      out += plRow("LOA profit", "", loaProfit, "total");
      out += plRow("First-year commission still to be earned", "paid by the carrier as the policy earns", tail, "memo");
    }
    if (tm) {
      var set = ltSettings();
      out += '<tr><td colspan="3" style="background:var(--mist);font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)">Lead Tech</td></tr>';
      out += plRow("Cash collected on calls", intf(tm.callsTaken) + " at " + money(set.callPrice), tm.callRevenue, "in");
      out += plRow("Spent on calls", intf(tm.callsTaken) + " at " + money(set.callCost), -tm.callSpend, "out");
      out += plRow("Refunds", intf(tm.refunds.length) + " refunds", -tm.refunded, "out");
      out += plRow("Wiped wallets", intf(tm.wipeRows.length) + " wipes — credit kept, no calls owed against it", tm.wiped, "in");
      out += plRow("Lead Tech profit & loss", "", ltPnl, "total");
      if (tm.collected > 0) out += plRow("Product & subscription orders", intf(tm.count) + " orders — fulfillment side, not in this ledger", tm.collected, "memo");
    }
    out += plRow("Company net", w.label, companyNet, "total");
    out += "</tbody></table></div></div></div>";

    /* ---- where the commission came from ---- */
    if (lm) {
      out += '<div class="section-head"><p class="eyebrow">Commission by carrier</p><h3>Who is actually paying us</h3>' +
        '<p class="sub">Issued and paid business only. Total commission is the full first year; upfront is the share the carrier has already advanced.</p></div>';

      var byCarrier = {};
      lm.paid.forEach(function (d) {
        var k = d.carrierId || "—";
        byCarrier[k] = byCarrier[k] || { n: 0, ap: 0, upfront: 0, full: 0, agent: 0 };
        var c = byCarrier[k];
        c.n += 1; c.ap += num(d.ap);
        c.upfront += houseCommOn(d); c.full += houseCommFullOn(d); c.agent += agentCommOn(d);
      });
      var keys = Object.keys(byCarrier).sort(function (a, b) { return byCarrier[b].full - byCarrier[a].full; });

      if (!keys.length) {
        out += '<div class="panel"><div class="empty"><strong>No issued business in this range</strong><p>Widen the range to see earlier commission.</p></div></div>';
      } else {
        out += '<div class="panel"><div class="panel-body flush"><div class="tblwrap"><table class="data"><thead><tr>' +
          '<th>Carrier</th><th class="n">Policies</th><th class="n">Annualized</th><th class="n">Upfront</th>' +
          '<th class="n">Total</th><th class="n">Agent</th><th class="n">House spread</th>' +
          "</tr></thead><tbody>";
        keys.forEach(function (k) {
          var c = byCarrier[k];
          out += "<tr><td class=\"who\">" + esc(carrierName(k)) + "</td>" +
            '<td class="n">' + esc(intf(c.n)) + '</td><td class="n">' + esc(money(c.ap)) + "</td>" +
            '<td class="n">' + esc(money(c.upfront)) + '</td><td class="n">' + esc(money(c.full)) + "</td>" +
            '<td class="n">' + esc(money(c.agent)) + '</td><td class="n">' + esc(money(c.upfront - c.agent)) + "</td></tr>";
        });
        out += '<tr class="total"><td>All carriers</td><td class="n">' + esc(intf(lm.paid.length)) + "</td>" +
          '<td class="n">' + esc(money(lm.apPaid)) + '</td><td class="n">' + esc(money(lm.houseGrossPaid)) + "</td>" +
          '<td class="n">' + esc(money(lm.houseFullPaid)) + '</td><td class="n">' + esc(money(lm.agentCommPaid)) + "</td>" +
          '<td class="n">' + esc(money(lm.spreadPaid)) + "</td></tr>";
        out += "</tbody></table></div></div></div>";
      }

      /* ---- producer contribution ---- */
      out += '<div class="section-head"><p class="eyebrow">Contribution</p><h3>What each producer returned to the house</h3>' +
        '<p class="sub">Their spread, less the calls it took to get there. This is the number that decides whether a seat pays for itself.</p></div>';

      var rows = loaAgents().map(function (a) {
        var am = loaMetrics(w.from, w.to, [a.id]);
        return { agent: a, m: am, contribution: am.spreadPaid - am.marketingCost };
      }).filter(function (r) { return r.m.written > 0 || r.m.callsTaken > 0; })
        .sort(function (x, y) { return y.contribution - x.contribution; });

      if (!rows.length) {
        out += '<div class="panel"><div class="empty"><p>No production in this range.</p></div></div>';
      } else {
        out += '<div class="panel"><div class="panel-body flush"><div class="tblwrap"><table class="data"><thead><tr>' +
          '<th>Producer</th><th>Contract</th><th class="n">Written AP</th><th class="n">Upfront comm</th>' +
          '<th class="n">Their commission</th><th class="n">Call spend</th><th class="n">Contribution</th>' +
          "</tr></thead><tbody>";
        rows.forEach(function (r) {
          out += "<tr><td class=\"who\">" + esc(r.agent.name) + '<div class="dim">' + esc(r.agent.role === "admin" ? "Admin" : "Producer") + "</div></td>" +
            '<td class="num">' + esc(r.agent.level || "—") + "%</td>" +
            '<td class="n">' + esc(money(r.m.apWritten)) + '</td><td class="n">' + esc(money(r.m.houseGrossPaid)) + "</td>" +
            '<td class="n">' + esc(money(r.m.agentCommPaid)) + '</td><td class="n">' + esc(money(r.m.marketingCost)) + "</td>" +
            '<td class="n"><b style="color:' + (r.contribution >= 0 ? "var(--good)" : "var(--bad)") + '">' + esc(money(r.contribution)) + "</b></td></tr>";
        });
        out += '<tr class="total"><td>All producers</td><td class="num">—</td>' +
          '<td class="n">' + esc(money(lm.apWritten)) + '</td><td class="n">' + esc(money(lm.houseGrossPaid)) + "</td>" +
          '<td class="n">' + esc(money(lm.agentCommPaid)) + '</td><td class="n">' + esc(money(lm.marketingCost)) + "</td>" +
          '<td class="n">' + esc(money(loaProfit)) + "</td></tr>";
        out += "</tbody></table></div></div></div>";
      }
    }
    return out;
  }

  /* -------------------------------------------------------------- Sync */
  function pageSync() {
    var out = pageHead("Sync & sources");

    out += '<div class="srcgrid">';
    out += srcCard(SOURCES.loa, ui.loa, loaCounts(), "The desk keeps its state inside its own published page, so a sync run reads it straight from the artifact and writes it here. Nothing needs to be open for that to work.");
    out += srcCard(SOURCES.lt, ui.lt, ltCounts(), "The board keeps its data in the browser it was worked in. It mirrors a scrubbed copy into its own database whenever it is open, and a sync run copies that across. Open the board once after a busy day and the numbers here catch up.");
    out += "</div>";

    out += '<div class="section-head"><p class="eyebrow">House rates</p><h3>Brokerage settings</h3>' +
      '<p class="sub">The blended rate Thrive takes on the brokerage side. It is kept here for when Thrive Companies has a source of its own — nothing on the dashboards reads it yet, because those figures are blank until then. ' +
      "Per-deal commission is untouched by this either way — that always comes from each carrier's own schedule.</p></div>";
    out += '<div class="panel"><div class="panel-body">' +
      '<div class="filters top" style="margin-bottom:0">' +
        '<div class="field" style="max-width:220px"><label for="spreadpct">Commission spread</label>' +
          '<input type="text" inputmode="decimal" id="spreadpct" value="' + esc(spreadPct()) + '" aria-describedby="spreadhint">' +
          '<span class="hint" id="spreadhint">Percent of annual premium written. Default ' + DEFAULT_SPREAD_PCT + '%.</span></div>' +
        '<div class="field"><label>&nbsp;</label><button class="btn accent" data-act="savespread">Save rate</button></div>' +
      "</div>" +
      '<div id="spreadmsg" style="margin-top:12px"></div>' +
      (ui.settings && ui.settings.updatedAt ?
        '<p style="margin:10px 0 0;font-size:12px;color:var(--muted)">Last changed ' + esc(agoLabel(ui.settings.updatedAt)) + ".</p>" : "") +
      "</div></div>";

    out += '<div class="section-head"><p class="eyebrow">Top it up by hand</p><h3>Paste a snapshot</h3>' +
      '<p class="sub">Export from either portal and drop the JSON here. The console works out which source it came from. This overwrites that source’s snapshot; it never touches the portal it came from.</p></div>';
    out += '<div class="panel"><div class="panel-body stack">' +
      '<textarea id="importbox" placeholder="Paste the exported JSON here" spellcheck="false"></textarea>' +
      '<div id="importmsg"></div>' +
      '<div class="row"><button class="btn accent" data-act="import">Load snapshot</button>' +
      '<button class="btn ghost" data-act="export">Download everything as JSON</button>' +
      '<span class="spacer"></span></div>' +
      "</div></div>";

    out += '<div class="section-head"><p class="eyebrow">Who can see this</p><h3>Access</h3>' +
      '<p class="sub">Straight answers, because a console full of company numbers deserves them.</p></div>';

        ? '<p style="margin:0;font-size:13px;line-height:1.65;max-width:70ch">This copy runs on your own domain and signs in against your Cloudflare relay. The relay account <b>is</b> the lock: anyone who reaches this page still needs your email and password, and the relay only answers browsers on the origins you listed.</p>' +
          '<p style="margin:0;font-size:13px;line-height:1.65;max-width:70ch">Signed in as <b>' + esc(ui.relayUser || "—") + '</b>. To change the password, rerun <code>make-credentials.mjs</code> and replace the two secrets on the worker.</p>'
        : '<p style="margin:0;font-size:13px;line-height:1.65;max-width:70ch">This artifact is private to your Claude workspace and, because it uses a shared database, it <b>cannot be made public at all</b> — every reader is a signed-in member of your organization. Sharing it with someone is a deliberate act.</p>' +
          '<p style="margin:0;font-size:13px;line-height:1.65;max-width:70ch">The passcode is a second door, not the lock. It stops a casual over-the-shoulder read; it will not stop someone determined who already has access to the page. Treat workspace access as the real boundary.</p>') +
      '<p style="margin:0;font-size:13px;line-height:1.65;max-width:70ch">Nothing here writes back. The Producer Desk and the fulfillment board stay the systems of record; this console only ever reads what they last published.</p>' +
      (store && store.mode === "relay" ? "" :
        '<div class="row"><button class="btn ghost sm" data-act="changepw">Change the owner passcode</button></div>') +
      '<div id="pwmsg"></div>' +
      "</div></div>";
    return out;
  }

  function loaCounts() {
    if (!ui.loa) return null;
    return [["Producers", intf(loaAgents().length)], ["Policies", intf(loaDeals().length)], ["Call days logged", intf(loaCalls().length)]];
  }
  function ltCounts() {
    if (!ui.lt) return null;
    return [["Orders", intf(ltOrders().length)], ["Products", intf(ltProducts().length)], ["Refunds", intf(ltRefunds().length)]];
  }
  function srcCard(src, snap, counts, how) {
    var when = snap && snap.syncedAt;
    var stale = when && hoursSince(when) > STALE_HOURS;
    var out = '<div class="srccard ' + src.cls + '"><div class="top"><i></i><div>' +
      "<h4>" + esc(src.name) + "</h4><p>" + esc(src.blurb) + "</p></div></div><div class=\"body\">";
    out += "<dl>";
    out += "<dt>Last sync</dt><dd>" + (isSample(snap) ? '<span class="pill warn">sample data</span>'
      : when ? esc(agoLabel(when)) + (stale ? ' <span class="pill warn">stale</span>' : "")
      : '<span class="pill warn">never</span>') + "</dd>";
    if (when) out += "<dt>Taken</dt><dd>" + esc(new Date(toMillis(when)).toLocaleString()) + "</dd>";
    if (snap && snap.syncedBy) out += "<dt>By</dt><dd>" + esc(snap.syncedBy === "import" ? "pasted by hand" : snap.syncedBy) + "</dd>";
    (counts || []).forEach(function (c) { out += "<dt>" + esc(c[0]) + "</dt><dd>" + esc(c[1]) + "</dd>"; });
    out += "</dl>";
    out += '<div class="how">' + esc(how) + "</div>";
    out += '<div class="row"><a class="btn ghost sm" href="' + esc(src.url) + '" target="_blank" rel="noopener">Open the portal →</a>' +
      (isSample(snap) ? '<button class="btn ghost sm" data-act="clearsample">Remove sample data</button>' : "") + "</div>";
    return out + "</div></div>";
  }

  /* ----------------------------------------------------- table row cap */
  /* Every table on the platform shows at most this many rows and then
     scrolls. Measured from the real rendered rows rather than a fixed
     pixel height, so a table of two-line rows caps at the same count as
     a table of one-line rows. */
  var ROW_CAP = 15;
  function capTables() {
    Array.prototype.forEach.call(app.querySelectorAll(".tblwrap"), function (box) {
      var tbl = box.querySelector("table.data");
      box.classList.remove("capped");
      box.style.maxHeight = "";
      if (!tbl || !tbl.tBodies.length) return;

      var all = Array.prototype.slice.call(tbl.tBodies[0].rows);
      var totalRow = all.filter(function (r) { return r.className.indexOf("total") >= 0; })[0] || null;
      var body = all.filter(function (r) { return r !== totalRow; });
      if (body.length <= ROW_CAP) return;

      var top = tbl.getBoundingClientRect().top;
      var cut = body[ROW_CAP - 1].getBoundingClientRect().bottom;
      var h = cut - top;
      if (totalRow) h += totalRow.getBoundingClientRect().height;
      /* Fifteen two-line rows can run past the bottom of the screen,
         which defeats the point. Never let a table box outgrow most of
         the viewport, but never squeeze it below a readable few rows
         either. */
      var ceiling = Math.max(320, window.innerHeight * 0.7);
      if (h > ceiling) h = ceiling;
      if (h > 0) {
        box.style.maxHeight = Math.ceil(h) + "px";
        box.classList.add("capped");
      }
    });
  }

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(capTables, 150);
  });

  /* -------------------------------------------------------- chart hover */
  function wireCharts() {
    Array.prototype.forEach.call(app.querySelectorAll('[data-chart="line"]'), function (box) {
      var svg = box.querySelector("svg"), tip = box.querySelector("[data-tip]");
      var cross = box.querySelector("[data-cross]"), line = cross ? cross.querySelector("line") : null;
      box.addEventListener("mousemove", function (ev) {
        var hit = ev.target.closest ? ev.target.closest(".hit") : null;
        if (!hit) return;
        var i = +hit.getAttribute("data-i");
        var d = chartData[box.getAttribute("data-cid")];
        if (!d) return;
        var r = svg.getBoundingClientRect(), br = box.getBoundingClientRect();
        var cx = hit.x.baseVal.value + hit.width.baseVal.value / 2;
        var px = (cx / 760) * r.width;
        if (line) { line.setAttribute("x1", cx); line.setAttribute("x2", cx); cross.removeAttribute("hidden"); }
        tip.innerHTML = "<b>" + esc(d.buckets[i].label) + "</b><br>" +
          d.series.map(function (s) {
            return '<span class="k" style="background:' + s.color + '"></span>' + esc(s.label) + " <b>" + esc(money(s.values[i])) + "</b>";
          }).join("<br>");
        tip.style.left = px + "px";
        tip.style.top = (r.top - br.top + 46) + "px";
        tip.classList.add("on");
      });
      box.addEventListener("mouseleave", function () {
        tip.classList.remove("on");
        if (cross) cross.setAttribute("hidden", "");
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-chart="donut"]'), function (box) {
      var tip = box.querySelector("[data-tip]");
      box.addEventListener("mousemove", function (ev) {
        var seg = ev.target.closest ? ev.target.closest(".seg") : null;
        if (!seg) { tip.classList.remove("on"); return; }
        var d = chartData[box.getAttribute("data-cid")];
        if (!d) return;
        var s = d[+seg.getAttribute("data-i")];
        var br = box.getBoundingClientRect();
        tip.innerHTML = '<span class="k" style="background:' + s.color + '"></span>' + esc(s.label) + " <b>" + esc(s.display || money(s.value)) + "</b>";
        tip.style.left = (ev.clientX - br.left) + "px";
        tip.style.top = (ev.clientY - br.top) + "px";
        tip.classList.add("on");
      });
      box.addEventListener("mouseleave", function () { tip.classList.remove("on"); });
    });
  }

  /* ------------------------------------------------------------- crypto */
  function subtle() { return window.crypto && window.crypto.subtle ? window.crypto.subtle : null; }
  function toHex(buf) {
    var b = new Uint8Array(buf), s = "";
    for (var i = 0; i < b.length; i++) s += ("0" + b[i].toString(16)).slice(-2);
    return s;
  }
  function randomSalt() {
    var b = new Uint8Array(16);
    window.crypto.getRandomValues(b);
    return toHex(b.buffer);
  }
  function hashPw(pw, saltHex, iter) {
    var s = subtle();
    if (!s) return Promise.reject(new Error("This browser cannot hash the passcode."));
    var enc = new TextEncoder();
    var salt = new Uint8Array(saltHex.match(/../g).map(function (h) { return parseInt(h, 16); }));
    return s.importKey("raw", enc.encode(pw), { name: "PBKDF2" }, false, ["deriveBits"])
      .then(function (k) {
        return s.deriveBits({ name: "PBKDF2", salt: salt, iterations: iter || PW_ITER, hash: "SHA-256" }, k, 256);
      })
      .then(toHex);
  }

  function rememberUnlock(hash) {
    try {
      localStorage.setItem(UNLOCK_KEY, hash.slice(0, 16) + ":" + (Date.now() + UNLOCK_HOURS * 3600000));
    } catch (e) {}
  }
  function unlockRemembered(hash) {
    try {
      var v = localStorage.getItem(UNLOCK_KEY);
      if (!v) return false;
      var p = v.split(":");
      return p[0] === hash.slice(0, 16) && Date.now() < +p[1];
    } catch (e) { return false; }
  }
  function forgetUnlock() { try { localStorage.removeItem(UNLOCK_KEY); } catch (e) {} }

  /* --------------------------------------------------------- snapshots */
  /* An import is a favour to the owner, not a parser exercise: work out
     which portal the JSON came from rather than making them tell us. */
  function classify(obj) {
    if (!obj || typeof obj !== "object") return null;
    if (obj.source === "loa" || obj.source === "leadtech") return obj.source === "loa" ? "loa" : "lt";
    if (Array.isArray(obj.deals) && Array.isArray(obj.agents)) return "loa";
    if (Array.isArray(obj.orders) && (Array.isArray(obj.products) || Array.isArray(obj.refundTypes))) return "lt";
    return null;
  }
  function normalizeLOA(o) {
    return {
      syncedAt: new Date().toISOString(), syncedBy: "import",
      sourceUrl: SOURCES.loa.url, sourceUpdatedAt: o.updatedAt || "",
      org: o.org || {}, agents: o.agents || [], deals: o.deals || [],
      calls: o.calls || [], goals: o.goals || {}, carriers: o.carriers || {}
    };
  }
  function normalizeLT(o) {
    var s = o.settings || {};
    return {
      syncedAt: new Date().toISOString(), syncedBy: "import",
      sourceUrl: SOURCES.lt.url, version: o.version || "",
      /* Only the four settings this console actually reads — a board's
         sync tokens and webhooks have no business in a shared store. */
      settings: { callCost: s.callCost, callPrice: s.callPrice, pastDueHours: s.pastDueHours, archiveAfterDays: s.archiveAfterDays },
      products: o.products || [], refundTypes: o.refundTypes || [],
      orders: o.orders || [], refunds: o.refunds || [],
      customers: o.customers || [], calls: o.calls || [], wipes: o.wipes || []
    };
  }
  /* The window of the same length immediately before this one, so "last
     30 days" is compared against the 30 before that. */
  function priorWindow(w) {
    var len = windowDays(w);
    var to = addDays(w.from, -1);
    return { from: addDays(to, -(len - 1)), to: to, label: "prior " + len + " day" + (len === 1 ? "" : "s") };
  }

  /* Percentage change, measured against the size of the earlier figure so
     that a period which lost money and then made money reads as a gain
     rather than as a nonsense negative. Null where no honest percentage
     exists: nothing to grow from, or no earlier period to compare with. */
  function growthPct(cur, prior) {
    if (!isFinite(cur) || !isFinite(prior)) return null;
    if (prior === 0) return null;
    return ((cur - prior) / Math.abs(prior)) * 100;
  }

  function growthChip(cur, prior, what, priorLabel) {
    /* All time has nothing before it to compare against. */
    if (ui.range === "all") return "";
    var g = growthPct(cur, prior);
    if (g === null) {
      var note = prior === 0 && cur !== 0 ? "no " + esc(what) + " in the " + esc(priorLabel) : "vs the " + esc(priorLabel);
      return '<div class="growth"><span class="g flat">\u2014</span><span class="gn">' + note + "</span></div>";
    }
    var cls = Math.abs(g) < 0.05 ? "flat" : g > 0 ? "up" : "down";
    var arrow = cls === "flat" ? "" : g > 0 ? "\u25B2 " : "\u25BC ";
    return '<div class="growth"><span class="g ' + cls + '">' + arrow + esc(pct(Math.abs(g), 1)) + "</span>" +
      '<span class="gn">' + esc(what) + " vs the " + esc(priorLabel) + "</span></div>";
  }

  function windowDays(w) {
    var d = Math.round((new Date(w.to + "T12:00:00") - new Date(w.from + "T12:00:00")) / 86400000) + 1;
    return d > 0 ? d : 1;
  }

  function doImport() {
    var box = document.getElementById("importbox");
    var msg = document.getElementById("importmsg");
    var raw = box ? box.value.trim() : "";
    if (!raw) { msg.innerHTML = '<div class="msg warnbar">Paste the exported JSON first.</div>'; return; }
    var obj;
    try { obj = JSON.parse(raw); }
    catch (e) { msg.innerHTML = '<div class="msg err">That is not valid JSON. Copy the whole export, including the outermost braces.</div>'; return; }
    var kind = classify(obj);
    if (!kind) {
      msg.innerHTML = '<div class="msg err">This does not look like either portal’s export. The desk export carries <b>agents</b> and <b>deals</b>; the board export carries <b>orders</b> and <b>products</b>.</div>';
      return;
    }
    var body = kind === "loa" ? normalizeLOA(obj) : normalizeLT(obj);
    msg.innerHTML = '<div class="msg info">Saving…</div>';
    store.set(SOURCES[kind].doc, body).then(function () {
      toast(SOURCES[kind].name + " snapshot loaded");
    }).catch(function (e) {
      var m = e && e.code === "invalid_argument"
        ? "That snapshot is too large for one document (the limit is 256 KB). Trim it, or let a sync run split it."
        : "Could not save it: " + ((e && e.message) || "unknown error");
      msg.innerHTML = '<div class="msg err">' + esc(m) + "</div>";
    });
  }

  function doExport() {
    var payload = JSON.stringify({
      exportedAt: new Date().toISOString(),
      company: "Thrive Companies",
      loa: ui.loa || null,
      leadtech: ui.lt || null
    }, null, 2);
    if (!downloads) { toast("Saving files is not available in this view"); return; }
    downloads.save({ filename: "thrive-command-" + todayISO() + ".json", data: payload })
      .then(function () { toast("Saved"); })
      .catch(function (e) { if (e && e.code !== "cancelled") toast("Could not save the file"); });
  }

  /* ---------------------------------------------------------- handlers */
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest ? ev.target.closest("[data-act]") : null;
    if (!t) return;
    var act = t.getAttribute("data-act");

    if (act === "tab") { ui.tab = t.getAttribute("data-tab"); window.scrollTo(0, 0); render(); }
    else if (act === "range") { ui.range = t.getAttribute("data-range"); render(); }
    else if (act === "refresh") { refreshNow(); }
    else if (act === "lock") {
      if (store && store.mode === "relay") {
        relayFetch("/auth/logout", { method: "POST" }).catch(function () {});
        setRelayToken("");
        ui.signedIn = false;
      } else {
        forgetUnlock();
        ui.unlocked = false;
      }
      render();
    }
    else if (act === "import") { doImport(); }
    else if (act === "export") { doExport(); }
    else if (act === "setpw") { setPasscode(); }
    else if (act === "unlock") { tryUnlock(); }
    else if (act === "changepw") { changePasscode(); }
    else if (act === "clearsample") { clearSample(); }
    else if (act === "savespread") { saveSpread(); }
    else if (act === "signin") { signIn(); }
  });

  function saveSpread() {
    var el = document.getElementById("spreadpct");
    var msg = document.getElementById("spreadmsg");
    var raw = el ? el.value.trim().replace(/%$/, "") : "";
    var v = parseFloat(raw);
    if (!isFinite(v) || v < 0 || v > 100) {
      msg.innerHTML = '<div class="msg err">Enter a percentage between 0 and 100 — for example 10, or 12.5.</div>';
      return;
    }
    msg.innerHTML = '<div class="msg info">Saving…</div>';
    store.set(SETTINGS_DOC, { brokerageSpreadPct: v, updatedAt: new Date().toISOString() })
      .then(function () { toast("Commission spread set to " + v + "%"); })
      .catch(function (e) {
        msg.innerHTML = '<div class="msg err">' + esc((e && e.message) || "Could not save the rate.") + "</div>";
      });
  }

  function clearSample() {
    var jobs = [];
    if (isSample(ui.loa)) jobs.push(store.del(SOURCES.loa.doc));
    if (isSample(ui.lt)) jobs.push(store.del(SOURCES.lt.doc));
    if (!jobs.length) return;
    Promise.all(jobs).then(function () { toast("Sample data removed"); })
      .catch(function () { toast("Could not remove it — try again"); });
  }

  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter") return;
    var el = ev.target;
    if (!el || !el.id) return;
    if (el.id === "si-email" || el.id === "si-pass") {
      ev.preventDefault();
      signIn();
      return;
    }
    if (el.id === "pw1" || el.id === "pw2") {
      ev.preventDefault();
      if (ui.owner) tryUnlock(); else setPasscode();
    } else if (el.id === "spreadpct") {
      ev.preventDefault();
      saveSpread();
    }
  });

  document.addEventListener("change", function (ev) {
    var el = ev.target;
    if (el.getAttribute && el.getAttribute("data-act") === "customdate") {
      var which = el.getAttribute("data-which");
      if (which === "from") ui.customFrom = el.value; else ui.customTo = el.value;
      render();
      return;
    }
    var f = el.getAttribute && el.getAttribute("data-filter");
    if (!f) return;
    ui.filters[f] = el.value;
    render();
  });
  var searchTimer = null;
  document.addEventListener("input", function (ev) {
    var f = ev.target.getAttribute && ev.target.getAttribute("data-filter");
    if (!f || ev.target.tagName !== "INPUT") return;
    ui.filters[f] = ev.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      var id = ev.target.id, pos = ev.target.selectionStart;
      render();
      var again = document.getElementById(id);
      if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} }
    }, 220);
  });

  function setPasscode() {
    var a = document.getElementById("pw1"), b = document.getElementById("pw2");
    var err = document.getElementById("autherr");
    var p1 = a ? a.value : "", p2 = b ? b.value : "";
    if (p1.length < 8) { err.innerHTML = '<div class="msg err">Use at least 8 characters.</div>'; return; }
    if (p1 !== p2) { err.innerHTML = '<div class="msg err">The two entries do not match.</div>'; return; }
    err.innerHTML = '<div class="msg info">Setting it…</div>';
    var salt = randomSalt();
    hashPw(p1, salt, PW_ITER).then(function (h) {
      return store.set(OWNER_DOC, { salt: salt, hash: h, iter: PW_ITER, setAt: new Date().toISOString() })
        .then(function () {
          ui.owner = { salt: salt, hash: h, iter: PW_ITER };
          ui.unlocked = true;
          rememberUnlock(h);
          render();
        });
    }).catch(function (e) {
      err.innerHTML = '<div class="msg err">' + esc((e && e.message) || "Could not set the passcode.") + "</div>";
    });
  }

  function signIn() {
    var email = document.getElementById("si-email");
    var pass = document.getElementById("si-pass");
    var err = document.getElementById("autherr");
    var e = email ? email.value.trim() : "", p = pass ? pass.value : "";
    if (!e || !p) { err.innerHTML = '<div class="msg err">Enter your email and password.</div>'; return; }
    err.innerHTML = '<div class="msg info">Signing in…</div>';
    fetch(RELAY + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: e, password: p })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) throw new Error(body.error || "That email and password don't match.");
        return body;
      });
    }).then(function (body) {
      setRelayToken(body.token);
      ui.signedIn = true;
      ui.relayUser = (body.user && body.user.email) || e;
      ui.booting = false;
      render();
      subscribe();
      setInterval(refreshData, refreshInterval());
    }).catch(function (ex) {
      var msg = (ex && ex.message) || "Could not sign in.";
      if (/failed to fetch|networkerror/i.test(msg)) {
        msg = "Could not reach the relay. Check that this page's address is listed in the relay's allowed origins.";
      }
      err.innerHTML = '<div class="msg err">' + esc(msg) + "</div>";
    });
  }

  function tryUnlock() {
    var a = document.getElementById("pw1");
    var err = document.getElementById("autherr");
    var pw = a ? a.value : "";
    if (!pw) { err.innerHTML = '<div class="msg err">Enter the passcode.</div>'; return; }
    err.innerHTML = '<div class="msg info">Checking…</div>';
    hashPw(pw, ui.owner.salt, ui.owner.iter).then(function (h) {
      if (h !== ui.owner.hash) {
        err.innerHTML = '<div class="msg err">That passcode does not match.</div>';
        return;
      }
      ui.unlocked = true;
      rememberUnlock(h);
      render();
    }).catch(function (e) {
      err.innerHTML = '<div class="msg err">' + esc((e && e.message) || "Could not check the passcode.") + "</div>";
    });
  }

  function changePasscode() {
    var msg = document.getElementById("pwmsg");
    var next = window.prompt("New owner passcode (at least 8 characters)");
    if (next == null) return;
    if (next.length < 8) { msg.innerHTML = '<div class="msg err">Use at least 8 characters.</div>'; return; }
    var salt = randomSalt();
    hashPw(next, salt, PW_ITER).then(function (h) {
      return store.set(OWNER_DOC, { salt: salt, hash: h, iter: PW_ITER, setAt: new Date().toISOString() });
    }).then(function () {
      msg.innerHTML = '<div class="msg ok">Passcode changed. Everyone else will be asked for the new one.</div>';
    }).catch(function (e) {
      msg.innerHTML = '<div class="msg err">' + esc((e && e.message) || "Could not change it.") + "</div>";
    });
  }

  /* ---------------------------------------------------------- bootstrap */
  render();

  function ready() {
    ui.booting = false;
    render();
    subscribe();
    /* The backstop that guarantees a page left open overnight is never
       showing yesterday's numbers. On the relay it is the only refresh
       there is. */
    setInterval(refreshData, refreshInterval());
  }

  function bootArtifact(d) {
    db = d;
    store = makeArtifactStore(d);
    return store.get(OWNER_DOC).then(function (owner) {
      ui.owner = owner;
      if (ui.owner && ui.owner.hash) ui.unlocked = unlockRemembered(ui.owner.hash);
      ready();
    });
  }

  function bootRelay() {
    store = makeRelayStore();
    if (!relayToken()) { ui.booting = false; render(); return Promise.resolve(); }
    /* A stored token is worth nothing until the relay agrees. */
    return relayFetch("/auth/me").then(function (res) {
      if (!res.ok) throw new Error("signed out");
      return res.json();
    }).then(function (body) {
      ui.signedIn = true;
      ui.relayUser = (body && body.user && body.user.email) || "";
      ready();
    }).catch(function () {
      setRelayToken("");
      ui.signedIn = false;
      ui.booting = false;
      render();
    });
  }

  if (window.THRIVE_PREVIEW_DATA) {
    /* No gate on a preview: the passcode and the relay sign-in both
       guard real data, and there is none of it here. */
    store = makePreviewStore(window.THRIVE_PREVIEW_DATA);
    ui.unlocked = true;
    ready();
  } else if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(function (d) { downloads = d; }).catch(function () {});
    window.claude.use("db").then(function (d) {
      if (d) return bootArtifact(d);
      /* Served by claude.ai but without a database — fall through to the
         relay if this build has one configured. */
      if (RELAY) return bootRelay();
      ui.booting = false;
      ui.dbError = "This view could not open the company database.";
      render();
    }).catch(function (e) {
      if (RELAY) return bootRelay();
      ui.booting = false;
      ui.dbError = (e && e.message) || "Could not reach the company database.";
      render();
    });
  } else if (RELAY) {
    bootRelay();
  } else {
    ui.booting = false;
    ui.dbError = "This copy has no data source configured. On claude.ai it uses the artifact database; on your own domain it needs THRIVE_RELAY set to your relay URL.";
    render();
  }

  function subscribe() {
    store.watch(SOURCES.loa.doc, function (d) { ui.loa = d; render(); });
    store.watch(SOURCES.lt.doc, function (d) { ui.lt = d; render(); });
    store.watch(SETTINGS_DOC, function (d) { ui.settings = d; render(); });
    /* Only the artifact keeps a passcode; the relay's own sign-in is the
       gate there, so there is nothing to watch. */
    if (store.mode === "artifact") store.watch(OWNER_DOC, function (d) { if (d) ui.owner = d; });
  }
})();
</script>
