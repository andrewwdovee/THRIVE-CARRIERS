name = "thrive-relay"
main = "worker.js"
compatibility_date = "2026-09-01"

# Created with: npx wrangler kv namespace create THRIVE_KV
# A namespace id is an identifier, not a credential — it is safe here.
[[kv_namespaces]]
binding = "THRIVE_KV"
id = "cc65589c8dfe4579b355f3804db2fb65"

[vars]
# Every origin allowed to call this relay, comma separated, no trailing
# slashes. A wildcard is deliberately not supported: this API accepts
# credentials, so any page you list here can drive it as you.
#
# An entry may start with "https://*." to match subdomains of one domain —
# Pages gives every deployment its own hostname, and they are all yours.
# It still never matches another domain, and never plain http.
ALLOWED_ORIGINS = "https://thrive-command.pages.dev,https://*.thrive-command.pages.dev"

OWNER_EMAIL = "andrew.davidson.zenith@gmail.com"
# 100000 is the ceiling Cloudflare Workers allow for PBKDF2.
OWNER_PASSWORD_ITER = "100000"

# The three below are SECRETS. Do not put them here — set them with:
#   wrangler secret put TOKEN_SECRET
#   wrangler secret put OWNER_PASSWORD_SALT
#   wrangler secret put OWNER_PASSWORD_HASH
