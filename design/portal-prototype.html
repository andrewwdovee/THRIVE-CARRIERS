<title>Thrive Inbound Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#08090c; --rail:#0a0d12; --card:#11161f; --card2:#0d1219; --line:#1f2733;
  --line2:#161d27; --text:#e6edf3; --muted:#8b98a8; --muted2:#6b7280;
  --dim:#6e7b8b;
  --green:#3fb950; --amber:#d29922; --red:#f85149; --purple:#a371f7; --blue:#58a6ff;
  --pri:#e9eef4; --priText:#0b0f15;
  --r:8px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.num{font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* shell */
.shell{display:flex;min-height:100vh}
.rail{width:200px;flex:0 0 200px;background:var(--rail);border-right:1px solid var(--line2);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:9px;align-items:center;padding:14px 12px 12px}
.mark{width:18px;height:18px;flex:0 0 18px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;transform:skewY(-8deg)}
.mark i{background:var(--text);border-radius:1px}
.mark i:nth-child(2){background:#5b6878}
.mark i:nth-child(3){background:#5b6878}
.brand b{font-size:13px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.25}
.brand span{font-size:10.5px;color:var(--dim);display:block}
.nav{display:flex;flex-direction:column;gap:1px;padding:4px 8px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:6px;font-size:12.5px;color:#c3cdd9;transition:background .12s}
.nav button:hover{background:#141b25}
.nav button[aria-current="page"]{background:#1c2430;color:#fff;font-weight:500}
.nav svg{width:14px;height:14px;flex:0 0 14px;opacity:.85}
.railfoot{margin-top:auto;padding:12px;display:flex;align-items:center;gap:8px}
.avatar{width:22px;height:22px;border-radius:50%;background:#1c2430;border:1px solid var(--line);display:grid;place-items:center;font-size:9.5px;font-weight:600;color:#c3cdd9}
.railfoot span{font-size:10px;color:#4e5a68;letter-spacing:.06em;text-transform:uppercase}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:46px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:14px;padding:0 16px;position:sticky;top:0;background:var(--bg);z-index:5}
.topbar svg{width:15px;height:15px;color:var(--muted)}
.topbar b{font-size:13.5px;font-weight:600}
.page{padding-block:26px;padding-left:24px;padding-right:24px;max-width:1280px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance;display:flex;align-items:center;gap:9px}
h1 svg{width:22px;height:22px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 20px}
.rowhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* pieces */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:14px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 15px}
.tile .t{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;color:var(--muted);font-size:12px;margin-bottom:9px}
.tile .t svg{width:14px;height:14px;opacity:.7}
.tile .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tile .c{font-size:11px;color:var(--dim);margin-top:3px}
.g{color:var(--green)} .a{color:var(--amber)} .r{color:var(--red)} .p{color:var(--purple)} .b{color:var(--blue)}

h2{font-size:16px;font-weight:600;margin:0 0 3px;display:flex;align-items:center;gap:7px}
h2 svg{width:15px;height:15px;color:var(--muted)}
h3{font-size:19px;font-weight:600;margin:0 0 3px}
.h2sub{color:var(--muted);font-size:12px;margin:0 0 14px}
label{display:block;font-size:11.5px;color:#b8c3cf;margin-bottom:5px;font-weight:500}
input,select,textarea{width:100%;background:#080b10;border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--text);font:inherit;font-size:12.5px}
input::placeholder,textarea::placeholder{color:#55606e}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b98a8' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 9px center;background-size:13px;padding-right:28px}
.field-search{position:relative}
.field-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:#55606e}
.field-search input{padding-left:30px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.btn{display:inline-flex;align-items:center;gap:7px;background:#161d27;border:1px solid var(--line);border-radius:7px;padding:8px 13px;font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:#1b2431}
.btn svg{width:13px;height:13px}
.btn.pri{background:var(--pri);color:var(--priText);border-color:var(--pri)}
.btn.pri:hover{background:#fff}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.icon{padding:6px;border-radius:6px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#241c05;border:1px solid #4a3a08;color:#f0d68a;border-radius:9px;padding:11px 14px;font-size:12.5px;margin-bottom:18px}
.banner b{color:#ffd970;font-weight:600}
.banner a{color:#ffd970;text-decoration:underline;white-space:nowrap}
.note{background:#0f1720;border:1px dashed #27384a;color:#8fa3b8;border-radius:9px;padding:11px 14px;font-size:12px;margin-bottom:18px}
.note b{color:#cfe0f0}

/* tables */
.tw{overflow-x:auto;margin:0 -1px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#131a24}
.right{text-align:right}
.nm{font-weight:500}
.em{color:var(--dim);font-size:12px}
.dash{color:#4e5a68}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:500;white-space:nowrap}
.pill.out{border-color:#3b4553}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:2px 7px;font-size:10px;font-weight:600;letter-spacing:.04em;white-space:nowrap;font-family:"JetBrains Mono",monospace}
.bd-grey{background:#1b2430;color:#aab6c4}
.bd-green{background:#0d2a18;color:#56d364}
.bd-red{background:#2d0f0f;color:#ff7b72}
.bd-amber{background:#2a2105;color:#e3b341}
.bd-purple{background:#221238;color:#c297ff}
.bd-blue{background:#0d2033;color:#79c0ff}
.st{display:flex;align-items:center;gap:7px}
.st svg{width:13px;height:13px}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px;background:#3d4754}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 2px 0;color:var(--muted);font-size:12px}
.pages{display:flex;align-items:center;gap:3px}
.pages button{background:none;border:0;padding:5px 9px;border-radius:6px;font-size:12px;color:var(--muted)}
.pages button:hover{background:#161d27;color:var(--text)}
.pages button[aria-current="true"]{background:#1c2430;color:#fff;font-weight:600}
.cnt{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--muted)}

/* dashboard tier cards */
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(288px,1fr));gap:14px}
.tier{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px;display:flex;flex-direction:column;gap:9px}
.tier .tn{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.kv{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}
.kv b{color:var(--text);font-weight:600;font-size:13px}
.live{border-top:1px solid var(--line2);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0d131c;border-radius:6px;padding:7px 9px}
.lrow .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.lrow .who span:first-child{font-size:11.5px;font-family:"JetBrains Mono",monospace}
.lrow .who span:last-child{font-size:10.5px;color:var(--dim)}

/* recordings player */
.player{display:flex;align-items:center;gap:9px;min-width:300px}
.play{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:1px solid #3a4553;background:none;display:grid;place-items:center}
.play svg{width:9px;height:9px}
.ptime{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{flex:1;height:3px;background:#222c39;border-radius:2px;position:relative;min-width:80px}
.track i{position:absolute;left:0;top:-3.5px;width:10px;height:10px;border-radius:50%;background:#c9d4e0}
.spd{background:#131a24;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:11px;color:#b8c3cf;width:auto;background-image:none;padding-right:6px}

/* leaderboard */
.lb td{padding:12px}
.lb .rk{font-weight:700;font-size:13px;color:#aab6c4;width:52px}
.lb tr.top1{background:linear-gradient(90deg,rgba(210,153,34,.13),rgba(210,153,34,.03))}
.lb tr.top2{background:linear-gradient(90deg,rgba(160,175,190,.11),rgba(160,175,190,.02))}
.lb tr.top3{background:linear-gradient(90deg,rgba(176,110,60,.12),rgba(176,110,60,.02))}
.lb .medal{font-size:15px}
.lb .den{color:var(--dim);font-size:11.5px}
.agentcell{display:flex;align-items:center;gap:9px;flex-wrap:wrap}

/* goals */
.goal{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:12px}
.goal.has{border-color:#2b3a4c;background:#121a25}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.gwho{display:flex;align-items:center;gap:10px}
.gav{width:26px;height:26px;border-radius:6px;background:#1c2430;border:1px solid var(--line);display:grid;place-items:center;font-size:9.5px;font-weight:600;color:#aab6c4;letter-spacing:.04em}
.gwho b{font-size:13px;font-weight:600;display:block}
.gwho span{font-size:11px;color:var(--dim)}
.gmetrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px}
.gm .gl{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.gm .gv{font-size:15px;font-weight:600;margin-bottom:7px}
.bar{height:4px;background:#1b2430;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.gm .gc{font-size:10.5px;color:var(--dim);margin-top:6px}
.glink{margin-top:12px;font-size:11.5px;color:var(--muted)}
.glink a{color:#a9bdd1;text-decoration:underline}

/* settings */
.sec{margin-bottom:16px}
.tierrow{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:13px 14px;margin-bottom:10px}
.tierrow .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.tierrow .fee{font-size:12.5px;margin-bottom:3px}
.tierrow .cap{font-size:11.5px;color:var(--dim);margin-bottom:6px}
.tid{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.tid code{background:#0a0e14;border:1px solid var(--line2);border-radius:5px;padding:2px 6px;font-family:"JetBrains Mono",monospace;font-size:10.5px}
.tid button{background:none;border:0;padding:2px;color:#55606e}
.tid button:hover{color:var(--text)}
.acts{display:flex;gap:7px;flex:0 0 auto}
.chars{font-size:11px;color:var(--dim);margin-top:7px}
.sendrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.selected{font-size:11px;color:var(--dim);margin-top:6px}
.savebar{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

@media (max-width:820px){
  .shell{flex-direction:column}
  .rail{position:static;width:100%;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line2)}
  .nav{flex-direction:row;overflow-x:auto;padding:4px 8px 8px}
  .nav button{white-space:nowrap}
  .railfoot{display:none}
  .page{padding-left:16px;padding-right:16px}
  h1{font-size:22px}
}
</style>

<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div><b>LeadTech</b><span>Admin Portal</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="railfoot"><div class="avatar">HR</div><span>Prototype</span></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
      <b>Admin Portal</b>
    </header>
    <main class="page" id="view"></main>
  </div>
</div>

<script>
const ICON = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/>',
  building:'<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  dollar:'<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  headphones:'<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>',
  trophy:'<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.7V17a2 2 0 0 1-2 2M14 14.7V17a2 2 0 0 0 2 2M18 2H6v7a6 6 0 0 0 12 0z"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  trend:'<path d="M22 7l-8.5 8.5-4-4L2 19"/><path d="M16 7h6v6"/>',
  check:'<circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 5-5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  xc:'<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/>',
  pct:'<path d="M19 5L5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
  filter:'<path d="M3 5h18l-7 8v6l-4 2v-8z"/>',
  ext:'<path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  power:'<path d="M18.4 6.6a9 9 0 1 1-12.8 0"/><path d="M12 2v10"/>',
  mega:'<path d="M3 11l16-7v16l-16-7z"/><path d="M3 11v4a2 2 0 0 0 2 2h2"/>',
  send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  play:'<path d="M6 3l14 9-14 9z" fill="currentColor" stroke="none"/>',
  dl:'<path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 21h16"/>',
  left:'<path d="M15 5l-7 7 7 7"/>',
  rightc:'<path d="M9 5l7 7-7 7"/>'
};
const svg=(n,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]||''}</svg>`;

const PAGES=[
  ['dashboard','Dashboard','grid'],['agents','Agents','users'],['orgs','Organizations','globe'],
  ['agencies','Agencies','building'],['calls','Calls','phone'],['pings','True Pings','activity'],
  ['costs','Call Costs','dollar'],['recordings','Call Recordings','headphones'],
  ['leaderboard','Leaderboard','trophy'],['goals','Goals','target'],['settings','Settings','gear']
];

/* ---------- example data, transcribed from the reference screenshots ---------- */
const TIERS=[

const AVAIL={available:['Available','#d29922'],away:['Away','#3d4754'],oncall:['On Call','#3fb950']};

const statusBadge=s=>s==='COMPLETED'?`<span class="st g">${svg('check')}<span class="badge bd-green">COMPLETED</span></span>`
  :s==='FAILED'?`<span class="st r">${svg('xc')}<span class="badge bd-red">FAILED</span></span>`
  :`<span class="st a">${svg('clock')}<span class="badge bd-grey">INITIATED</span></span>`;
const dispo=d=>d==='—'?'<span class="dash">—</span>':d==='NO_SALE'?'<span class="badge bd-grey">NO_SALE</span>':d==='Pending'?'<span class="badge bd-amber">Pending</span>':`<span class="badge bd-green">${d}</span>`;

const pager=(pages,label)=>`<div class="pager"><span>${label}</span><div class="pages"><button>${svg('left')} Previous</button><button aria-current="true">1</button><button>2</button><button>3</button><button>4</button><button>…</button><button>${pages}</button><button>Next ${svg('rightc')}</button></div></div>`;
const sel=(lab,opts)=>`<div><label>${lab}</label><select>${opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
const money=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const cpaColor=v=>v<130?'g':v<220?'a':'r';
const initials=n=>n.trim().slice(0,2).toUpperCase();

/* ---------- router ---------- */
let current='dashboard';
const nav=document.getElementById('nav'), view=document.getElementById('view');
nav.innerHTML=PAGES.map(([id,label,icon])=>`<button data-id="${id}">${svg(icon)}<span>${label}</span></button>`).join('');
function render(id){
  current=id;
  [...nav.children].forEach(b=>b.setAttribute('aria-current',b.dataset.id===id?'page':'false'));
  view.innerHTML=V[id]?V[id]():'';
  window.scrollTo({top:0});
  const bc=document.getElementById('bc');
  if(bc)bc.addEventListener('input',()=>document.getElementById('bcn').textContent=bc.value.length);
}
nav.addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)render(b.dataset.id)});
render('dashboard');
</script>
