<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <link rel="icon" href="/icon.svg" />
    <title>Lead Tech Fulfillment</title>
    <meta name="description" content="Order fulfillment board and admin console for Lead Tech." />
    <script>
      /* Runs before the first paint. Deciding the theme in React instead
         means a dark screen flashes white on every load, which looks broken
         even though it corrects itself a moment later. */
      (function () {
        try {
          var pick = localStorage.getItem("ltf_theme") || "system";
          var dark = pick === "dark" || (pick !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) { document.documentElement.classList.add("dark"); }
      })();
    </script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
