  /* ==================================================================== */
  /*                        ANALYTICS + CHARTS                            */
  /* ==================================================================== */

  /* ---- goals ---------------------------------------------------------- */
  function goalsRoot() {
    if (!state.goals) state.goals = { org: {}, byAgent: {} };
    if (!state.goals.org) state.goals.org = {};
    if (!state.goals.byAgent) state.goals.byAgent = {};
    return state.goals;
  }
  function orgGoals() { return goalsRoot().org; }
  function agentGoals(id) {
    var g = goalsRoot().byAgent;
    if (!g[id]) g[id] = {};
    return g[id];
  }
  /** The commission goal is not typed — it follows from the premium goal, the
      carrier advance and the producer's own contract:
        $25,000 x 75% advance x 30% = $5,625. */
  function commissionGoal(premiumGoal, agent) {
    var a = agent || me();
    return num(premiumGoal) * advanceRate() * (num(a ? a.level : 0) / 100);
  }
  function commissionGoalLine(premiumGoal, agent) {
    var a = agent || me(), lvl = num(a ? a.level : 0);
    return money(premiumGoal, 0) + "  \u00d7  " + dec(advanceRate() * 100, 0) + "%  \u00d7  "
      + dec(lvl, 0) + "%  =  " + money(commissionGoal(premiumGoal, a), 2);
  }

  function daysInMonth(iso) {
    var y = +iso.slice(0, 4), m = +iso.slice(5, 7);
    return new Date(y, m, 0).getDate();
  }
  /** How far through the month we are, as a 0–1 fraction. */
  function monthPace() {
    var t = todayISO();
    return Math.min(1, (+t.slice(8, 10)) / daysInMonth(t));
  }

  /**
   * A goal card: actual against an MTD target, with a pace marker showing
   * where you should be today rather than at month end.
   */
  function goalCard(label, actual, goal, fmt) {
    var f = fmt || intf;
    if (!goal || goal <= 0) {
      return '<div class="goal unset"><p class="eyebrow">' + esc(label) + "</p>"
        + '<div class="top"><span class="v">' + esc(f(actual)) + '</span><span class="of">no goal</span></div>'
        + '<div class="track"><i style="width:0"></i></div>'
        + '<div class="foot"><span class="rest">Set a target below to track pace</span></div></div>';
    }
    var pace = monthPace();
    var expected = goal * pace;
    var done = ratio(actual, goal);
    var ahead = actual >= expected;
    var gap = Math.abs(actual - expected);
    return '<div class="goal"><p class="eyebrow">' + esc(label) + "</p>"
      + '<div class="top"><span class="v">' + esc(f(actual)) + '</span><span class="of">of ' + esc(f(goal)) + "</span></div>"
      + '<div class="track"><i class="' + (ahead ? "ahead" : "behind") + '" style="width:' + Math.min(100, Math.round(done)) + '%"></i>'
      + '<span class="mark-pace" style="left:' + Math.min(100, Math.round(pace * 100)) + '%" title="Where you should be today"></span></div>'
      + '<div class="foot"><span class="st ' + (ahead ? "ahead" : "behind") + '">' + (ahead ? "Ahead" : "Behind") + " by " + esc(f(gap))
      + '</span><span class="rest">· ' + pct(done, 0) + " of target</span></div></div>";
  }

  /* ---- day series ------------------------------------------------------ */
  /** One row per calendar day in range: calls, deals, premium, economics. */
  function daySeries(agentIds, from, to) {
    var setOf = {};
    agentIds.forEach(function (id) { setOf[id] = 1; });
    var byDay = {};
    function slot(d) {
      if (!byDay[d]) byDay[d] = { date: d, calls: 0, deals: 0, paidCount: 0, mp: 0, ap: 0, apPaid: 0, gross: 0, comp: 0 };
      return byDay[d];
    }
    var cursor = from, guard = 0;
    if (from > "0001-01-01" && to < "9000-01-01") {
      while (cursor <= to && guard++ < 800) { slot(cursor); cursor = addDays(cursor, 1); }
    }
    state.calls.forEach(function (c) {
      if (!setOf[c.agentId] || !inRange(c.date, from, to)) return;
      slot(c.date).calls += num(c.calls);
    });
    state.deals.forEach(function (d) {
      if (!setOf[d.agentId] || !inRange(d.date, from, to)) return;
      var s = slot(d.date);
      s.deals += 1; s.mp += num(d.mp); s.ap += num(d.ap);
      if (statusOf(d.status).group === "paid") {
        s.paidCount += 1;
        s.apPaid += num(d.ap);
        s.gross += houseCommOn(d);
        s.comp += agentCommOn(d);
      }
    });
    return Object.keys(byDay).sort().map(function (k) {
      var r = byDay[k];
      r.marketing = r.calls * costPerCall();
      r.net = r.gross - r.comp - r.marketing;
      return r;
    });
  }
  /** Close rate day by day, computed on the running totals rather than the
      day alone — a single day is too small a sample to mean anything. */
  function runningCloseRate(rows, paidOnly) {
    var c = 0, d = 0;
    return rows.map(function (r) {
      c += num(r.calls);
      d += paidOnly ? num(r.paidCount) : num(r.deals);
      return c > 0 ? (d / c) * 100 : 0;
    });
  }
  function pctAxis(v) { return dec(v, 0) + "%"; }

  function runningTotal(rows, key) {
    var t = 0;
    return rows.map(function (r) { t += num(r[key]); return t; });
  }

  /* ---- svg helpers ----------------------------------------------------- */
  var vizSeq = 0;
  /** Round up to a readable step, so gridlines land on whole numbers. */
  function niceStep(x) {
    if (x <= 0) return 1;
    var mag = Math.pow(10, Math.floor(Math.log10(x)));
    var n = x / mag, f = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
    return f * mag;
  }
  /**
   * A shared scale for the whole chart: one step size, so every gridline
   * lands on a round number even when the series crosses zero.
   */
  function axisScale(minV, maxV, div, int) {
    if (minV > 0) minV = 0;
    if (maxV < 0) maxV = 0;
    var step = niceStep(((maxV - minV) || 1) / div);
    if (int) step = Math.max(1, Math.ceil(step));
    var bot = Math.floor(minV / step) * step;
    var top = Math.ceil(maxV / step) * step;
    var guard = 0;
    while ((top - bot) / step > div + 1 && guard++ < 24) {
      step = niceStep(step * 1.6);
      if (int) step = Math.max(1, Math.ceil(step));
      bot = Math.floor(minV / step) * step;
      top = Math.ceil(maxV / step) * step;
    }
    if (top <= bot) top = bot + step;
    return { bot: bot, top: top, step: step, n: Math.round((top - bot) / step) };
  }
  function shortDate(iso) {
    var d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString("en-US", { month: "numeric", day: "numeric" });
  }

  /**
   * Line chart. `series` is [{name, color, values[], fmt, fill?, dash?}].
   * Every series must share one unit — this never draws a second y-axis.
   */
  function svgLine(labels, series, opts) {
    opts = opts || {};
    var W = opts.width || 640, H = opts.height || 200, P = { t: 12, r: 14, b: 26, l: 52 };
    var iw = W - P.l - P.r, ih = H - P.t - P.b;
    if (!labels.length) return '<div class="empty" style="padding:26px">Nothing logged in this range yet.</div>';

    var maxV = 0;
    series.forEach(function (s) { s.values.forEach(function (v) { if (num(v) > maxV) maxV = num(v); }); });
    var minV = 0;
    series.forEach(function (s) { s.values.forEach(function (v) { if (num(v) < minV) minV = num(v); }); });
    var sc = axisScale(minV, maxV, 4, !!opts.integer);
    var top = sc.top, bot = sc.bot, DIV = sc.n;
    var n = labels.length;
    var x = function (i) { return P.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw); };
    var span = top - bot || 1;
    var y = function (v) { return P.t + ih - ((num(v) - bot) / span) * ih; };

    var g = "";
    for (var t = 0; t <= DIV; t++) {
      var gv = bot + sc.step * t, gy = y(gv);
      g += '<line class="gridline" x1="' + P.l + '" y1="' + gy.toFixed(1) + '" x2="' + (W - P.r) + '" y2="' + gy.toFixed(1) + '"></line>'
        + '<text class="tick" x="' + (P.l - 7) + '" y="' + (gy + 3.5).toFixed(1) + '" text-anchor="end">' + esc((opts.axisFmt || intf)(gv)) + "</text>";
    }
    var every = Math.max(1, Math.ceil(n / 8));
    for (var i = 0; i < n; i++) {
      if (i % every && i !== n - 1) continue;
      g += '<text class="tick" x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(shortDate(labels[i])) + "</text>";
    }

    var paths = "";
    series.forEach(function (s) {
      var d = s.values.map(function (v, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); }).join(" ");
      if (s.fill && n > 1) {
        paths += '<path d="' + d + " L" + x(n - 1).toFixed(1) + " " + y(Math.max(bot, 0)).toFixed(1) + " L" + x(0).toFixed(1) + " " + y(Math.max(bot, 0)).toFixed(1)
          + ' Z" fill="var(--s1-fill)" stroke="none"></path>';
      }
      paths += '<path class="' + (s.dash ? "pace" : "mark") + '" d="' + d + '"' + (s.dash ? "" : ' stroke="' + s.color + '"') + "></path>";
      if (n <= 32 && !s.dash) {
        s.values.forEach(function (v, i) {
          paths += '<circle class="dot" cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="3.5" fill="' + s.color + '"></circle>';
        });
      }
    });

    /* hover bands — one per x, carrying every series' value for that day */
    var hits = "";
    var bw = n > 1 ? iw / (n - 1) : iw;
    for (var j = 0; j < n; j++) {
      var tip = "<b>" + shortDate(labels[j]) + "</b>"
        + series.map(function (s) {
          return "<br>" + esc(s.name) + ": <b>" + esc((s.fmt || intf)(s.values[j])) + "</b>";
        }).join("");
      hits += '<rect class="hit" data-tip="' + esc(tip) + '" data-cx="' + x(j).toFixed(1) + '" x="' + (x(j) - bw / 2).toFixed(1)
        + '" y="' + P.t + '" width="' + bw.toFixed(1) + '" height="' + ih + '"></rect>';
    }

    var legend = series.length > 1 ? '<div class="viz-legend">' + series.map(function (s) {
      return "<span><i" + (s.dash ? ' class="dash"' : ' style="background:' + s.color + '"') + "></i>" + esc(s.name) + "</span>";
    }).join("") + "</div>" : "";

    return '<div class="chart" data-viz="' + (++vizSeq) + '"><div class="chart-tip"></div>'
      + '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(opts.alt || "Line chart") + '">'
      + g
      + '<line class="axisline" x1="' + P.l + '" y1="' + (P.t + ih) + '" x2="' + (W - P.r) + '" y2="' + (P.t + ih) + '"></line>'
      + '<line class="crosshair" x1="0" y1="' + P.t + '" x2="0" y2="' + (P.t + ih) + '" style="opacity:0"></line>'
      + paths + hits + "</svg>" + legend + "</div>";
  }

  /** Donut — part-to-whole at a glance, three segments, each direct-labeled
      in the key below. The ring is centred in a square field with the count
      sitting in its hole; the 2px surface stroke is the only gap between
      segments, so no angular padding is needed. */
  function svgDonut(slices, centerLabel, centerValue, fmt) {
    var live = slices.filter(function (s) { return num(s.value) > 0; });
    var total = live.reduce(function (t, s) { return t + num(s.value); }, 0);
    if (total <= 0) return '<div class="empty" style="padding:26px">No deals in this range yet.</div>';
    var f = fmt || intf;
    var W = 224, H = 224, cx = W / 2, cy = H / 2, R = 104, r = 66;
    function pt(ang, rad) {
      return [(cx + Math.cos(ang) * rad).toFixed(2), (cy + Math.sin(ang) * rad).toFixed(2)];
    }

    var a = -Math.PI / 2, arcs = "";
    live.forEach(function (s) {
      var frac = num(s.value) / total;
      var tip = esc(esc(s.name) + ": <b>" + f(s.value) + "</b> \u00b7 " + pct(frac * 100, 0));
      if (live.length === 1) {
        /* One arc cannot close a full circle — its two ends land on the same
           point and the path draws nothing. Stroke a plain ring instead. */
        arcs += '<circle data-tip="' + tip + '" cx="' + cx + '" cy="' + cy + '" r="' + ((R + r) / 2)
          + '" fill="none" stroke="' + s.color + '" stroke-width="' + (R - r) + '"></circle>';
        return;
      }
      var a0 = a, a1 = a + frac * Math.PI * 2;
      a = a1;
      var large = (a1 - a0) > Math.PI ? 1 : 0;
      var o0 = pt(a0, R), o1 = pt(a1, R), i1 = pt(a1, r), i0 = pt(a0, r);
      arcs += '<path class="seg" fill="' + s.color + '" data-tip="' + tip + '"'
        + ' d="M' + o0[0] + " " + o0[1] + " A" + R + " " + R + " 0 " + large + " 1 " + o1[0] + " " + o1[1]
        + " L" + i1[0] + " " + i1[1] + " A" + r + " " + r + " 0 " + large + " 0 " + i0[0] + " " + i0[1] + ' Z"></path>';
    });

    /* Aligned columns beat a ragged run-on line: swatch, name, count, share. */
    var rows = live.map(function (s) {
      return "<div><i style=\"background:" + s.color + '"></i><span class="k">' + esc(s.name) + "</span>"
        + '<span class="v">' + esc(f(s.value)) + "</span>"
        + '<span class="p">' + pct(ratio(num(s.value), total), 0) + "</span></div>";
    }).join("");

    return '<div class="chart donut" data-viz="' + (++vizSeq) + '"><div class="chart-tip"></div>'
      + '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(centerLabel) + '">' + arcs
      + '<text class="center-v" x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle">' + esc(centerValue) + "</text>"
      + '<text class="center-l" x="' + cx + '" y="' + (cy + 19) + '" text-anchor="middle">' + esc(centerLabel.toUpperCase()) + "</text>"
      + "</svg>"
      + '<div class="donut-key">' + rows + "</div></div>";
  }

  /** Horizontal bars — magnitude, one hue, values direct-labeled. */
  function svgBars(items, opts) {
    opts = opts || {};
    if (!items.length) return '<div class="empty" style="padding:26px">Nothing to rank yet.</div>';
    var f = opts.fmt || money;
    var rows = items.slice(0, opts.limit || 8);
    var maxV = Math.max.apply(null, rows.map(function (i) { return num(i.value); }).concat([1]));
    var rh = 30, W = 640, H = rows.length * rh + 8, labW = opts.labelWidth || 168, valW = 76;
    var bw = W - labW - valW;
    var out = rows.map(function (it, i) {
      var y = i * rh + 4, w = Math.max(2, (num(it.value) / maxV) * bw);
      return '<text class="cat" x="0" y="' + (y + 18) + '">' + esc(it.name.length > 24 ? it.name.slice(0, 23) + "…" : it.name) + "</text>"
        /* The tip round-trips through an attribute and lands in innerHTML, so
           every caller-supplied fragment is escaped once for the attribute and
           once for that innerHTML. Only the <b> here is meant as markup. */
        + '<rect class="bar" data-tip="' + esc(esc(it.name) + ": <b>" + f(it.value) + "</b>" + (it.sub ? " · " + esc(it.sub) : ""))
        + '" x="' + labW + '" y="' + (y + 5) + '" width="' + w.toFixed(1) + '" height="16" fill="' + (opts.color || "var(--s1)") + '"></rect>'
        + '<text class="val" x="' + (labW + w + 8).toFixed(1) + '" y="' + (y + 18) + '">' + esc(f(it.value)) + "</text>";
    }).join("");
    return '<div class="chart" data-viz="' + (++vizSeq) + '"><div class="chart-tip"></div>'
      + '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(opts.alt || "Bar chart") + '">' + out + "</svg></div>";
  }

  function panel(title, note, body) {
    return '<div class="panel"><div class="panel-head"><h3>' + esc(title) + "</h3>"
      + (note ? '<span class="note">' + esc(note) + "</span>" : "") + "</div>"
      + '<div class="panel-body">' + body + "</div></div>";
  }

  /* ---- shared chart blocks --------------------------------------------- */
  function statusDonut(k) {
    return svgDonut([
      { name: "Issued & paid", value: k.paid.length, color: "var(--paid)" },
      { name: "In the pipeline", value: k.pending.length, color: "var(--pipe)" },

  function carrierBars(deals, opts) {
    var agg = {};
    deals.forEach(function (d) {

      a.mp += num(d.mp); a.n++;

    var items = Object.keys(agg).map(function (id) {
      return { name: (CARRIER_BY_ID[id] || {}).name || id, value: agg[id].mp, sub: agg[id].n + " deal" + (agg[id].n === 1 ? "" : "s") };
    }).sort(function (a, b) { return b.value - a.value; });
    return svgBars(items, { fmt: money, alt: "Monthly premium by carrier", limit: (opts && opts.limit) || 8 });

  /* ================================================================ CSV */
  function csvEscape(v) {
    var s = String(v == null ? "" : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function toCSV(rows) { return rows.map(function (r) { return r.map(csvEscape).join(","); }).join("\n"); }

  /** Build an export as text. The desk cannot hand you a file: a published
      artifact that offers downloads cannot be shared with anyone, and being
      shareable is the whole point of this desk. So the text is put on screen
      to copy into a spreadsheet instead. */
  function buildExport(what) {
    var filename, data;
    if (what === "deals") {
      filename = "thrive-loa-deals-" + todayISO() + ".csv";
      var rows = [["Date", "Producer", "Level", "Client", "Carrier", "Product", "Monthly premium", "Annualized premium", "Advance %", "Advanced premium", "Type of deal", "Producer comp %", "Producer commission", "Agency comp %", "Agency commission", "House spread", "Status", "Policy draft date", "Commission paid out", "Paid out on", "Policy number", "Notes"]];
      state.deals.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (d) {
        var a = agentById(d.agentId) || {};
        var adv = advancedAP(d);
        var ac = adv * num(d.agentPct) / 100, hc = adv * num(d.housePct) / 100;
        rows.push([d.date, a.name || "", a.level || "", d.client, (CARRIER_BY_ID[d.carrierId] || {}).name || d.carrierId, d.product,
          num(d.mp).toFixed(2), num(d.ap).toFixed(2), (advanceRate() * 100).toFixed(0), adv.toFixed(2), dealTypeOf(d).label, d.agentPct, ac.toFixed(2), d.housePct, hc.toFixed(2), (hc - ac).toFixed(2),
          statusOf(d.status).label, d.draftDate || "", d.paidOut ? "Yes" : "No", d.paidOutOn || "", d.policyNo, d.notes]);
      });
      data = toCSV(rows);
    } else if (what === "calls") {
      filename = "thrive-loa-calls-" + todayISO() + ".csv";
      var r2 = [["Date", "Producer", "Inbound calls", "Cost per call", "Marketing cost", "Notes"]];
      state.calls.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (c) {
        var a = agentById(c.agentId) || {};
        r2.push([c.date, a.name || "", c.calls, costPerCall(), (num(c.calls) * costPerCall()).toFixed(2), c.note]);
      });
      data = toCSV(r2);
    } else {
      filename = "thrive-loa-producer-desk-" + todayISO() + ".json";
      /* A full backup gets mailed around and parked in folders — no reason for
         it to carry credentials, hashed or not. */
      var safe = JSON.parse(JSON.stringify(state));
      safe.agents.forEach(function (a) {
        delete a.password; delete a.pwHash; delete a.pwSalt;
      });
      data = JSON.stringify(safe, null, 2);
    }
    return { name: filename, text: data, what: what };
  }

  /* ============================================================== ACTIONS */
  function saveCalls(form) {
    var agentId = byId("c-agent") ? byId("c-agent").value : form.getAttribute("data-agent");
    var date = val("c-date");
    if (!date) return;
    /* Inbound calls are counted, never fractional. */
    var row = { date: date, agentId: agentId, calls: wholeCalls(val("c-calls")), note: val("c-note") };
    setUI("callDate", date);
    commit(function (s) {
      var hit = null;
      s.calls.forEach(function (c) { if (c.agentId === agentId && c.date === date) hit = c; });
      if (hit) { hit.calls = row.calls; hit.note = row.note; }
      else { row.id = uid("cl"); row.createdAt = new Date().toISOString(); s.calls.push(row); }
    });
  }

  function saveDeal(form) {
    var id = form.getAttribute("data-id");
    var agentId = byId("d-agent") ? byId("d-agent").value : session.agentId;
    if (!agentId) { session.notice = { type: "err", text: "Pick the producer who wrote this deal." }; render(); return; }
    var carrierId = val("d-carrier"), product = val("d-product");
    var agent = agentById(agentId) || me();
    var mp = num(val("d-mp"));
    var apct = byId("d-apct") && val("d-apct") !== "" ? num(val("d-apct")) : compPctFor(agent, carrierId, product);
    var hRate = houseRateFor(carrierId, product);
    var hpct = byId("d-hpct") && val("d-hpct") !== "" ? num(val("d-hpct")) : (hRate == null ? 0 : hRate);

    var deal = {
      agentId: agentId, date: val("d-date"), client: val("d-client"),
      carrierId: carrierId, product: product,
      mp: mp, ap: mp * 12, dealType: val("d-type") || DEAL_TYPES[0].k,
      status: val("d-status"), draftDate: val("d-draft"),
      policyNo: val("d-policy"), notes: val("d-notes"),
      agentPct: apct, housePct: hpct,
      agentLevelAtWrite: agent.level, houseLevelAtWrite: state.org.houseLevel
    };
    /* Only the owner sets Agent paid. A producer's save omits the key
       entirely, so the stored flag survives their edit untouched. */
    var paidSel = isOwner() ? byId("d-paid") : null;
    if (paidSel) deal.paidOut = paidSel.value === "1";
    setUI("editDeal", "");
    commit(function (s) {
      if (id) {
        s.deals.forEach(function (d) {
          if (d.id !== id) return;
          /* Stamp the settle date the same way the Paid out cell does, so the
             two routes to the flag cannot disagree. */
          if (paidSel && deal.paidOut !== !!d.paidOut) deal.paidOutOn = deal.paidOut ? todayISO() : null;
          for (var k in deal) d[k] = deal[k];
          d.updatedAt = new Date().toISOString();
        });
      } else {
        if (deal.paidOut) deal.paidOutOn = todayISO();
        deal.id = uid("dl"); deal.createdAt = new Date().toISOString(); s.deals.push(deal);
      }
    });
  }

  /* Two-step confirm — sandboxed frames may block window.confirm(). */
  var armed = null, armTimer = null;
  function armConfirm(el, label) {
    if (armed === el) { armed = null; clearTimeout(armTimer); return true; }
    if (armed) armed.textContent = armed.getAttribute("data-label") || armed.textContent;
    armed = el;
    el.setAttribute("data-label", el.textContent);
    el.textContent = label;
    clearTimeout(armTimer);
    armTimer = setTimeout(function () {
      if (armed === el) { el.textContent = el.getAttribute("data-label"); armed = null; }
    }, 4000);
    return false;
  }

  function copyLink(btn, link) {
    var restore = function (msg) {
      btn.textContent = msg;
      setTimeout(function () { btn.textContent = "Copy"; }, 2200);
    };
    var fallback = function () {
      var box = btn.closest("tr") ? btn.closest("tr").querySelector(".codebox") : null;
      if (box && window.getSelection) {
        var rng = document.createRange();
        rng.selectNodeContents(box);
        var sel = window.getSelection();
        sel.removeAllRanges(); sel.addRange(rng);
        restore("Selected — copy it");
      } else restore("Copy manually");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(function () { restore("Copied"); }, fallback);
    } else fallback();
  }


  /* ---- chart hover ----------------------------------------------------- */
  function chartTip(host, tip, clientX, clientY) {
    var box = host.querySelector(".chart-tip");
    if (!box) return;
    box.innerHTML = tip;
    var r = host.getBoundingClientRect();
    box.style.left = Math.max(8, Math.min(r.width - 8, clientX - r.left)) + "px";
    box.style.top = (clientY - r.top) + "px";
    box.classList.add("on");
  }
  document.addEventListener("pointermove", function (ev) {
    var t = ev.target;
    if (!t || !t.getAttribute) return;
    var tip = t.getAttribute("data-tip");
    var host = t.closest ? t.closest(".chart") : null;
    if (!tip || !host) return;
    chartTip(host, tip, ev.clientX, ev.clientY);
    var cx = t.getAttribute("data-cx"), line = host.querySelector(".crosshair");
    if (line && cx) {
      line.setAttribute("x1", cx); line.setAttribute("x2", cx);
      line.style.opacity = "1";
    }
  }, true);
  document.addEventListener("pointerleave", function (ev) {
    var host = ev.target && ev.target.closest ? ev.target.closest(".chart") : null;
    if (!host) return;
    var box = host.querySelector(".chart-tip");
    if (box) box.classList.remove("on");
    var line = host.querySelector(".crosshair");
    if (line) line.style.opacity = "0";
  }, true);

  /* ============================================================ LISTENERS */
  document.addEventListener("click", function (ev) {
    var el = ev.target && ev.target.closest ? ev.target.closest("[data-act]") : null;
    if (!el) return;
    var act = el.getAttribute("data-act");

    if (act === "auth-tab") { setUI("authTab", el.getAttribute("data-tab")); render(); return; }
    if (act === "do-setup") { ev.preventDefault(); doSetup(); return; }
    if (act === "do-signin") { ev.preventDefault(); doSignin(); return; }
    if (act === "do-signup") { ev.preventDefault(); doSignup(); return; }
    if (act === "signout") {
      session.agentId = null;
      try { localStorage.removeItem("tc_agent"); } catch (e) {}
      setUI("view", ""); render(); return;
    }
    if (act === "nav") {
      setUI("view", el.getAttribute("data-view"));
      setUI("editDeal", ""); setUI("dealSearch", "");
      session.notice = null; render(); return;
    }
    if (act === "edit-deal") {
      setUI("editDeal", el.getAttribute("data-id"));
      setUI("view", isOwner() ? "deals" : "mydeals");
      render(); window.scrollTo(0, 0); return;
    }
    if (act === "cancel-edit") { setUI("editDeal", ""); render(); return; }
    if (act === "del-deal") {
      var did = el.getAttribute("data-id");
      if (!armConfirm(el, "Really delete?")) return;
      setUI("editDeal", "");
      commit(function (s) { s.deals = s.deals.filter(function (d) { return d.id !== did; }); });
      return;
    }
    if (act === "edit-day") { setUI("callDate", el.getAttribute("data-date")); render(); window.scrollTo(0, 0); return; }
    if (act === "del-day") {
      var cid = el.getAttribute("data-id");
      if (!armConfirm(el, "Really delete?")) return;
      commit(function (s) { s.calls = s.calls.filter(function (c) { return c.id !== cid; }); });
      return;
    }
    if (act === "toggle-paid") {
      if (!isOwner()) return;
      var tpId = el.getAttribute("data-id");
      commit(function (s) {
        s.deals.forEach(function (d) {
          if (d.id !== tpId) return;
          d.paidOut = !d.paidOut;
          d.paidOutOn = d.paidOut ? todayISO() : null;
        });
      });
      return;
    }
    if (act === "dealsearch-clear") {
      setUI("dealSearch", "");
      render();
      var box = byId("f-dsearch");
      if (box) box.focus();
      return;
    }
    if (act === "gridclear") {
      var cc = el.getAttribute("data-carrier"), cp = el.getAttribute("data-product");
      commit(function (s) {
        if (!s.grid || !s.grid[cc]) return;
        delete s.grid[cc][cp];
        if (!Object.keys(s.grid[cc]).length) delete s.grid[cc];
      });
      return;
    }
    if (act === "copy-link") { copyLink(el, el.getAttribute("data-link")); return; }
    if (act === "approve-agent") {
      var apId = el.getAttribute("data-id");
      commit(function (s) {
        s.agents.forEach(function (a) {
          if (a.id !== apId) return;
          a.status = "active";
          a.startedOn = todayISO();
          a.approvedOn = todayISO();
          a.approvedBy = session.agentId;
        });
      });
      return;
    }
    if (act === "decline-agent") {
      var dcId = el.getAttribute("data-id");
      if (!armConfirm(el, "Really decline?")) return;
      commit(function (s) {
        s.agents.forEach(function (a) { if (a.id === dcId) { a.status = "declined"; a.approvedBy = session.agentId; } });
      });
      return;
    }
    /* First confirmation: the button arms itself in place. */
    if (act === "del-agent") {
      if (!armConfirm(el, "Confirm delete")) return;
      session.delAgent = el.getAttribute("data-id");
      render();
      return;
    }
    if (act === "del-agent-cancel") { session.delAgent = null; render(); return; }
    /* Second confirmation. The account and everything it wrote go in one
       commit, so the desk is never left holding deals with no producer. */
    if (act === "del-agent-confirm") {
      var delId = el.getAttribute("data-id");
      session.delAgent = null;
      if (delId === session.agentId) {
        session.notice = { type: "err", text: "You cannot delete the account you are signed in with." };
        render();
        return;
      }
      var gone = agentById(delId);
      commit(function (s) {
        s.agents = s.agents.filter(function (a) { return a.id !== delId; });
        s.deals = s.deals.filter(function (d) { return d.agentId !== delId; });
        s.calls = s.calls.filter(function (c) { return c.agentId !== delId; });
        if (s.goals && s.goals.byAgent) delete s.goals.byAgent[delId];
      });
      session.notice = { type: "ok", text: (gone ? gone.name : "That producer") + " and everything they logged have been deleted." };
      render();
      return;
    }
    if (act === "toggle-agent") {
      var aid = el.getAttribute("data-id");
      commit(function (s) {
        s.agents.forEach(function (a) { if (a.id === aid) a.status = a.status === "active" ? "inactive" : "active"; });
      });
      return;
    }
    if (act === "export") {
      session.exportBox = buildExport(el.getAttribute("data-what"));
      render();
      var ta = byId("export-text");
      if (ta) { ta.focus(); ta.select(); }
      return;
    }
    if (act === "export-close") { session.exportBox = null; render(); return; }
    if (act === "export-copy") {
      var ta2 = byId("export-text");
      if (!ta2) return;
      var done = function (msg) {
        el.textContent = msg;
        setTimeout(function () { el.textContent = "Copy to clipboard"; }, 2200);
      };
      ta2.focus(); ta2.select();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta2.value).then(function () { done("Copied"); },
          function () { done("Selected \u2014 press \u2318C"); });
      } else done("Selected \u2014 press \u2318C");
      return;
    }
  });

  document.addEventListener("change", function (ev) {
    var el = ev.target && ev.target.closest ? ev.target.closest("[data-act]") : null;
    if (!el) return;
    var act = el.getAttribute("data-act");
    if (act === "range")  { setUI("range", el.value); render(); return; }
    if (act === "from")   { setUI("from", el.value); render(); return; }
    if (act === "to")     { setUI("to", el.value); render(); return; }
    if (act === "dealagent")  { setUI("dealAgent", el.value); render(); return; }
    if (act === "dealstatus") { setUI("dealStatus", el.value); render(); return; }
    if (act === "dealcarrier"){ setUI("dealCarrier", el.value); render(); return; }
    if (act === "notif-status") {
      var nsId = el.getAttribute("data-id"), nsV = el.value;
      commit(function (s) {
        s.deals.forEach(function (d) {
          if (d.id !== nsId) return;
          d.status = nsV;
          d.updatedAt = new Date().toISOString();
        });
      });
      return;
    }
    if (act === "gridcarrier") { setUI("gridCarrier", el.value); render(); return; }
    if (act === "gridrate") {
      var gc = el.getAttribute("data-carrier"), gp = el.getAttribute("data-product"), gv = el.value.trim();
      commit(function (s) {
        gridRoot();
        if (!s.grid[gc]) s.grid[gc] = {};
        if (gv === "") delete s.grid[gc][gp]; else s.grid[gc][gp] = num(gv);
        if (!Object.keys(s.grid[gc]).length) delete s.grid[gc];
      });
      return;
    }
    if (act === "carrier") { rebuildProductSelect(); return; }
    if (act === "product") { syncHousePct(); return; }
    if (act === "dealagentpick") { syncAgentPct(); return; }
    if (act === "callagent") { setUI("callAgent", el.value); render(); return; }

    if (act === "pend-level") {
      var pid = el.getAttribute("data-id"), plv = el.value;
      commit(function (s) { s.agents.forEach(function (a) { if (a.id === pid) a.level = plv; }); });
      return;
    }
    if (act === "pend-role") {
      var prid = el.getAttribute("data-id"), prl = el.value;
      commit(function (s) {
        s.agents.forEach(function (a) {
          if (a.id !== prid) return;
          a.role = prl;
          var ladder = levelsFor(prl);
          if (ladder.indexOf(String(a.level)) < 0) a.level = prl === "admin" ? String(state.org.houseLevel || "150") : "25";
        });
      });
      return;
    }
    if (act === "set-level") {
      var id = el.getAttribute("data-id"), lv = el.value;
      commit(function (s) { s.agents.forEach(function (a) { if (a.id === id) a.level = lv; }); });
      return;
    }
    if (act === "set-role") {
      var rid = el.getAttribute("data-id"), rl = el.value;
      var admins = state.agents.filter(function (a) { return a.role === "admin"; });
      if (rl === "agent" && admins.length === 1 && admins[0].id === rid) {
        session.notice = { type: "err", text: "Keep at least one owner. Promote someone else first." };
        render(); return;
      }
      commit(function (s) { s.agents.forEach(function (a) { if (a.id === rid) a.role = rl; }); });
      return;
    }
  });

  document.addEventListener("input", function (ev) {
    var el = ev.target && ev.target.closest ? ev.target.closest("[data-act]") : null;
    if (!el) return;
    var a = el.getAttribute("data-act");
    if (a === "dealsearch") {
      /* render() rebuilds the DOM, so put the cursor back where it was. */
      var caret = el.selectionStart;
      setUI("dealSearch", el.value);
      render();
      var again = byId("f-dsearch");
      if (again) {
        again.focus();
        try { again.setSelectionRange(caret, caret); } catch (e) {}
      }
      return;
    }
    if (a === "calls-int") {
      /* Drop the fraction rather than the dot — "12.7" is 12 calls, not 127. */
      var cleaned = el.value.replace(/[^0-9.]/g, "").split(".")[0];
      if (cleaned !== el.value) el.value = cleaned;
      refreshCalc();
      return;
    }
    if (a === "goalcalc") {
      var gbox = byId("g-comm");
      if (gbox) gbox.textContent = commissionGoalLine(num(el.value), me());
      return;
    }
    if (a === "recalc") refreshCalc();
  });

  document.addEventListener("submit", function (ev) {
    var form = ev.target && ev.target.closest ? ev.target.closest("form[data-act]") : null;
    if (!form) return;
    ev.preventDefault();
    var act = form.getAttribute("data-act");
    if (act === "add-product") {
      var apc = form.getAttribute("data-carrier"), apn = val("np-name"), apr = val("np-rate");
      if (!apn) { session.notice = { type: "err", text: "Give the product a name." }; render(); return; }
      var dupe = productsOf(apc).some(function (x) { return x.name.toLowerCase() === apn.toLowerCase(); });
      if (dupe) { session.notice = { type: "err", text: "That carrier already has a product by that name." }; render(); return; }
      return commit(function (s) {
        gridRoot();
        if (!s.grid[apc]) s.grid[apc] = {};
        s.grid[apc][apn] = num(apr);
      });
    }
    if (act === "save-calls") return saveCalls(form);
    if (act === "save-deal") return saveDeal(form);
    if (act === "save-settings") {
      return commit(function (s) {
        s.org.name = val("o-name") || s.org.name;
        s.org.houseLevel = byId("o-house").value;
        s.org.costPerCall = num(val("o-cpc"));
        s.org.defaultLevel = byId("o-deflvl").value;
        s.org.advanceRate = num(val("o-adv"));
      });
    }
    if (act === "add-agent") {
      var naName = val("na-name"), naEmail = normEmail(val("na-email")),
          naPw = val("na-pw"), naLevel = byId("na-level").value;
      var nbox = byId("na-msg");
      var nsay = function (t, k) {
        if (nbox) nbox.innerHTML = '<div class="msg ' + (k || "err") + '">' + esc(t) + "</div>";
      };
      if (!naName) return nsay("Enter their full name.");
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(naEmail)) return nsay("Enter a valid email address.");
      if (naPw.length < PW_MIN) return nsay("The starting password needs at least " + PW_MIN + " characters.");
      var clash = null;
      state.agents.forEach(function (a) { if (normEmail(a.email) === naEmail) clash = a; });
      if (clash) return nsay("An account already uses that email.");
      var fresh = {
        id: uid("ag"), name: naName, email: naEmail, phone: "",
        level: naLevel, role: "agent", status: "active",
        appliedOn: todayISO(), createdAt: new Date().toISOString(),
        startedOn: todayISO(), approvedOn: todayISO(), approvedBy: session.agentId
      };
      nsay("Securing the password\u2026", "info");
      setPw(fresh, naPw).then(function () {
        session.notice = { type: "ok", text: naName + " can sign in now with the password you set. They still need edit access to the desk before their entries save." };
        commit(function (s2) { s2.agents.push(fresh); });
      });
      return;
    }
    if (act === "save-password") {
      var m = me();
      var oldPw = val("pw-old"), newPw = val("pw-new"), newPw2 = val("pw-new2");
      var box = byId("pw-msg");
      var say = function (text, kind) {
        if (box) box.innerHTML = '<div class="msg ' + (kind || "err") + '">' + esc(text) + "</div>";
      };
      if (newPw.length < PW_MIN) return say("Choose a password of at least " + PW_MIN + " characters.");
      if (newPw !== newPw2) return say("Those passwords do not match.");
      if (newPw === oldPw) return say("That is the password you already have.");
      if (!subtle()) return say("This browser cannot secure a password here. Open the desk over https and try again.");
      say("Checking your current password\u2026", "info");
      verifyPw(m, oldPw).then(function (okPw) {
        if (!okPw) return say("That is not your current password.");
        return setPw(m, newPw).then(function () {
          session.notice = { type: "ok", text: "Password changed. It takes effect for your next sign-in." };
          commit(null);
        });
      });
      return;
    }
    if (act === "save-goals") {
      var scope = form.getAttribute("data-scope");
      return commit(function (s2) {
        goalsRoot();
        var g = scope === "org" ? s2.goals.org : (s2.goals.byAgent[session.agentId] = s2.goals.byAgent[session.agentId] || {});
        if (scope === "org") {
          g.calls = num(val("g-calls")); g.deals = num(val("g-deals"));
          g.placed = num(val("g-placed")); g.net = num(val("g-net"));
        } else {
          g.calls = num(val("g-calls")); g.deals = num(val("g-deals"));
          g.premium = num(val("g-premium"));
          g.commission = commissionGoal(g.premium, me());
        }
      });
    }
  });

  /* ================================================================= BOOT */
  var TITLE = "Thrive LOA Producer Desk";
  var FONT_HREF = "https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap";

  function startDesk() {
    if (session.agentId && !agentById(session.agentId)) {
      session.agentId = null;
      try { localStorage.removeItem("tc_agent"); } catch (e) {}
    }
    render();
    if (migrated && me()) commit(null);
  }

  if (RELAY) {
    /* Read the live record before drawing anything, so nobody is shown the
       numbers this page happened to be built with. */
    chip("Loading\u2026");
    RELAY.load().then(function (fresh) {
      if (fresh && typeof fresh === "object") {
        state = fresh;
        migrate();
      }
      chipOff();
      startDesk();
      /* Producers share this desk. Pick up other people's saves rather
         than sitting on a stale copy and overwriting them. */
      RELAY.watch(function (fresh2) {
        if (!fresh2 || fresh2.updatedAt === state.updatedAt) return;
        state = fresh2;
        migrate();
        render();
      });
    }).catch(function (err) {
      chipOff();
      session.notice = { type: "err", text: (err && err.message) || "Could not reach the relay. Your changes will not be saved." };
      session.readOnly = true;
      startDesk();
    });
  } else {
    startDesk();
  }
})();
</script>
