  function agentById(id) {
    for (var i = 0; i < state.agents.length; i++) if (state.agents[i].id === id) return state.agents[i];
    return null;
  }

  /* Thrive's own rate per product, editable on the Commission grid tab. The
     shipped carrier schedule is the fallback, never overwritten — clearing an
     override drops the product straight back onto it. */
  function gridRoot() {
    if (!state.grid) state.grid = {};
    return state.grid;
  }
  function overrideFor(cid, name) {
    var c = (state.grid || {})[cid];
    if (!c) return null;
    var v = c[name];
    return v == null || v === "" ? null : num(v);
  }
  /** Catalog products plus any the owner added by hand. */
  function productsOf(cid) {
    var c = CARRIER_BY_ID[cid];
    var out = c ? c.products.slice() : [];
    var ov = (state.grid || {})[cid];
    if (ov) {
      var seen = {};
      out.forEach(function (p) { seen[p.name] = 1; });
      Object.keys(ov).sort().forEach(function (n) {
        if (!seen[n]) out.push({ name: n, rates: null, custom: true });
      });
    }
    return out;
  }

    var ps = productsOf(cid);
    for (var i = 0; i < ps.length; i++) if (ps[i].name === name) return ps[i].rates;
    return null;
  }

  function gridRate(cid, name, level) {
    var r = productRates(cid, name);

    var v = r[houseIdx(level)];
    return typeof v === "number" ? v : null;
  }
  /** What the carrier pays Thrive on this product: the owner's own figure if
      they have set one, otherwise the schedule at Thrive's contract level. */
  function houseRateFor(cid, name) {
    var ov = overrideFor(cid, name);
    return ov == null ? gridRate(cid, name, state.org.houseLevel) : ov;
  }
  /** What this person earns on this product: owners off the grid at their
      own level, LOA producers as a flat share of annualized premium. */
  function compPctFor(agent, cid, name) {
    if (!agent) return 0;
    if (agent.role === "admin") {
      /* An owner writing at the agency's own level earns the agency's rate,
         overrides included. */
      if (String(agent.level) === String(state.org.houseLevel)) return num(houseRateFor(cid, name));
      var r = gridRate(cid, name, agent.level);

  /* ------------------------------------------------------------ migration */
  /* Carries a v1 book (dials/annual premium/carrier-grid agent levels) into
     the LOA model. Persists on the next save. */
  function migrate() {
    var v = num(state.version), changed = false;
    if (v >= 6) return false;
    changed = true;
    if (v < 2) { migrateV2(); }
    if (v < 4) { migrateV4(); }
    if (v < 5) { migrateV5(); }
    if (v < 6) { migrateV6(); }
    /* v3 — owners are contracted on the carrier grid, producers on 0-50 */
    state.version = 6;
    state.agents.forEach(function (a) {
      var ladder = levelsFor(a.role);
      if (ladder.indexOf(String(a.level)) < 0) {
        a.level = a.role === "admin" ? String(state.org.houseLevel || "150") : "25";
      }
    });
    goalsRoot();
    return changed;
  }

    if (state.org.advanceRate == null) state.org.advanceRate = 75;

    state.calls.forEach(function (c) { c.calls = wholeCalls(c.calls); });
    state.deals.forEach(function (d) {
      if (STATUS_ALIAS[d.status]) d.status = STATUS_ALIAS[d.status];
      if (!STATUS_BY_K[d.status]) d.status = "underwriting";

    return true;
  }

  /* v4 — invite links are gone: open signup plus an owner approval gate. */
  function migrateV4() {
    state.agents.forEach(function (a) {

  function migrateV2() {
    if (state.org.name === "Thrive Companies") state.org.name = "Thrive Companies LOA";

  var saveTimer = null;
  /** `done(err)` fires once the publish settles — null on success. Callers on
      the sign-in screen need it: their own notices never reach the authed
      shell, so without this a failed save looks exactly like a good one. */
  function commit(fn, done) {
    if (fn) fn(state);
    state.updatedAt = new Date().toISOString();
    render();
    /* The relay is checked first, and must be. artifactApi is only ever
       set inside claude.ai, so on the Cloudflare build it stays null —
       and with the artifact check above this one, every save fell into
       "saved in this browser only" and returned, leaving the relay
       branch below unreachable. The desk could read and never write. */
    if (!RELAY && !artifactApi) {
      session.notice = { type: "warnbar", text: window.THRIVE_PREVIEW
        ? "Preview copy — nothing here is saved, and the live desk is untouched. Reload to start over."
        : "Saved in this browser only — this view cannot publish, so your team will not see the change." };
      render();
      if (done) done({ code: "not_writer" });
      return;
    }
    chip("Saving…");
    clearTimeout(saveTimer);
    if (RELAY) {
      saveTimer = setTimeout(function () {
        RELAY.save(state, CARRIERS).then(function () {
          chip("Saved");
          setTimeout(chipOff, 1200);
          if (done) done(null);
        }).catch(function (err) {
          chipOff();
          session.notice = { type: "err", text: (err && err.message) || "Could not save to the relay." };
          render();
          if (done) done({ code: "relay_failed" });
        });
      }, 400);
      return;
    }
    saveTimer = setTimeout(function () {
      artifactApi.publish(buildDocument()).then(function () {
        chip("Saved");
        if (done) done(null);
      }).catch(function (err) {
        if (done) done(err || { code: "unknown" });
        var code = err && err.code;

             publish was refused, so nothing was clobbered — reload to pick
             their version up rather than carry stale numbers. */

          return;

          session.readOnly = true;
          session.notice = { type: "warnbar", text: "You have view-only access to this desk. Ask Thrive to share it with edit access so your entries save for the team." };
        } else if (code === "rate_limited") {
          session.notice = { type: "err", text: "Saving too quickly. Wait a few seconds and try again." };
        } else if (code === "too_large") {
          session.notice = { type: "err", text: "This desk has outgrown a single page. Export your data and split it by production year." };
        } else {
          session.notice = { type: "err", text: "That did not save. Check your connection and try again." };
        }
        render();
      });
    }, 250);
  }

  /* ------------------------------------------------------------- metrics */
  function inRange(iso, from, to) { return iso >= from && iso <= to; }

  function rangeBounds() {
    var mode = getUI("range", "mtd");
    var t = todayISO();
    if (mode === "mtd")   return { from: monthStart(t), to: t, label: "Month to date" };
    if (mode === "d30")   return { from: addDays(t, -29), to: t, label: "Last 30 days" };
    if (mode === "d7")    return { from: addDays(t, -6), to: t, label: "Last 7 days" };
    if (mode === "today") return { from: t, to: t, label: "Today" };
    if (mode === "ytd")   return { from: t.slice(0, 4) + "-01-01", to: t, label: "Year to date" };
    if (mode === "custom") return { from: getUI("from", monthStart(t)), to: getUI("to", t), label: "Custom range" };
    return { from: "0000-01-01", to: "9999-12-31", label: "All time" };
  }

  /** Roll up inbound calls + written business for a set of agents. */
  function metrics(agentIds, from, to) {
    var setOf = {};
    agentIds.forEach(function (id) { setOf[id] = 1; });
    var calls = state.calls.filter(function (c) { return setOf[c.agentId] && inRange(c.date, from, to); });
    var deals = state.deals.filter(function (d) { return setOf[d.agentId] && inRange(d.date, from, to); });

    var m = { callRows: calls, deals: deals };
    m.callsTaken = sumBy(calls, "calls");
    m.daysLogged = calls.filter(function (c) { return num(c.calls) > 0; }).length;
    m.marketingCost = m.callsTaken * costPerCall();
    m.written = deals.length;
    m.mpWritten = sumBy(deals, "mp");
    m.apWritten = sumBy(deals, "ap");

    var paid = [], pend = [], lost = [];
    deals.forEach(function (d) {
      var g = statusOf(d.status).group;
      if (g === "paid") paid.push(d); else if (g === "pending") pend.push(d); else lost.push(d);
    });
    m.paid = paid; m.pending = pend; m.lost = lost;
    m.mpPaid = sumBy(paid, "mp");
    m.apPaid = sumBy(paid, "ap");
    m.apPending = sumBy(pend, "ap");
    m.advPaid = paid.reduce(function (t, d) { return t + advancedAP(d); }, 0);
    m.apLost = sumBy(lost, "ap");

    function agentComm(list) { return list.reduce(function (t, d) { return t + agentCommOn(d); }, 0); }
    function houseComm(list) { return list.reduce(function (t, d) { return t + houseCommOn(d); }, 0); }
    m.agentCommWritten = agentComm(deals);
    m.agentCommPaid = agentComm(paid);
    m.houseGrossPaid = houseComm(paid);
    m.spreadPaid = m.houseGrossPaid - m.agentCommPaid;
    m.net = m.spreadPaid - m.marketingCost;

    m.callsPerDeal = m.written ? m.callsTaken / m.written : 0;
    m.callsPerPaid = paid.length ? m.callsTaken / paid.length : 0;
    m.closeRate = ratio(m.written, m.callsTaken);
    m.placement = ratio(m.apPaid, m.apWritten);
    m.avgMp = m.written ? m.mpWritten / m.written : 0;
    m.costPerDeal = m.written ? m.marketingCost / m.written : 0;
    m.costPerPaid = paid.length ? m.marketingCost / paid.length : 0;
    m.roi = m.marketingCost > 0 ? ratio(m.net, m.marketingCost) : 0;
    return m;
  }

  function daysBetween(a, b) {

  /**

   * issued & paid, or one of the ways a deal falls off. Pass `ahead` to look
   * forward instead: draft dates landing in the next N days.

  function draftDue(ahead) {
    var t = todayISO(), mine = me();
    var from = ahead ? addDays(t, 1) : "0000-01-01";
    var to = ahead ? addDays(t, ahead) : t;

      if (!d.draftDate || statusOf(d.status).group !== "pending") return false;

        + '<p style="margin:0;color:var(--muted);line-height:1.65">This link opened the desk in view-only mode, so nothing you enter can be saved. '
        + esc(state.org.name) + ' never received your application, and creating it again on this link will not change that.</p>'
        + '<p style="margin:0;color:var(--muted);line-height:1.65">Ask ' + esc(state.org.name)
        + ' to share the desk with you with <strong style="color:var(--ink)">edit access</strong>, then apply again \u2014 or to add you directly from their end.</p>'
        + '<button class="btn ghost" data-act="auth-tab" data-tab="signin">Back to sign in</button>'
        + "</div>";
    } else if (tab === "pending") {
      body = '<div class="auth-body">'
        + '<div class="msg ok" style="line-height:1.6">Account created for <strong>' + esc(getUI("pendingEmail", "")) + "</strong>.</div>"
        + '<p style="margin:0;color:var(--muted);line-height:1.6">' + esc(state.org.name)
        + " has to approve you before you can sign in. You will not be able to log in until then \u2014 check back, or ask your manager to approve you.</p>"
        + '<button class="btn ghost" data-act="auth-tab" data-tab="signin">Back to sign in</button>'
        + "</div>";
    } else if (tab === "signup") {
      body = '<div class="auth-body">'
        + '<p style="margin:0;color:var(--muted)">Create your producer account. ' + esc(state.org.name) + " approves it before you get in.</p>"
        /* An application is itself a write to this desk, so it only reaches
           anyone if the owner has already given this person edit access. On a
           read-only link it cannot be submitted at all — better to say that
           before they type a password than after. */
        + '<div class="msg info" style="line-height:1.55">' + esc(state.org.name)
        + ' has to give you access to this desk before an application can be submitted. '
        + "If you have not been added yet, ask them first \u2014 otherwise this will not go through.</div>"
        + '<div class="field"><label for="u-name">Full name</label><input type="text" id="u-name" placeholder="Jordan Reyes" autocomplete="name"></div>'
        + '<div class="field"><label for="u-email">Email</label><input type="email" id="u-email" placeholder="jordan@example.com" autocomplete="email"></div>'
        + '<div class="field"><label for="u-pw">Password</label><input type="password" id="u-pw" placeholder="At least 8 characters" autocomplete="new-password"></div>'
        + '<div class="field"><label for="u-pw2">Confirm password</label><input type="password" id="u-pw2" autocomplete="new-password"></div>'
        + '<div id="auth-msg"></div>'
        + '<button class="btn accent" data-act="do-signup">Create account</button>'
        + "</div>";
    } else {
      body = '<div class="auth-body">'
        /* A preview nobody can get into is not a preview. */
        + (window.THRIVE_PREVIEW && state.agents.length
          ? '<div class="msg info" style="line-height:1.6">Preview copy \u2014 sign in with <b>'
            + esc(state.agents[0].email) + '</b> and <b>' + esc(state.agents[0].password || "")
            + "</b>. Nothing you do here is saved, and the live desk is untouched.</div>"
          : "")
        + '<div class="field"><label for="l-email">Email</label><input type="email" id="l-email" autocomplete="username"></div>'
        + '<div class="field"><label for="l-pw">Password</label><input type="password" id="l-pw" autocomplete="current-password"></div>'
        + '<div id="auth-msg"></div>'
        + '<button class="btn accent" data-act="do-signin">Sign in</button>'
        + "</div>";
    }

    var tabs = (setup || tab === "pending" || tab === "blocked") ? "" : '<div class="auth-tabs">'
      + '<button data-act="auth-tab" data-tab="signin"' + (tab === "signin" ? ' aria-current="page"' : "") + ">Sign in</button>"
      + '<button data-act="auth-tab" data-tab="signup"' + (tab === "signup" ? ' aria-current="page"' : "") + ">Create an account</button>"
      + "</div>";

    root.innerHTML = '<div class="auth-shell"><div>'
      + '<div class="auth-card">' + top + tabs + body + "</div>"
      + (VERSION ? '<p class="auth-ver">' + esc(VERSION) + "</p>" : "")
      + "</div></div>";
  }

  function authMsg(text, kind) {
    var el = byId("auth-msg");
    if (el) el.innerHTML = '<div class="msg ' + (kind || "err") + '">' + esc(text) + "</div>";
  }

  var PW_MIN = 8;

  function doSetup() {
    var name = val("s-name"), email = normEmail(val("s-email")), pw = val("s-pw"), org = val("s-org");
    if (!name || !email || pw.length < PW_MIN) {
      return authMsg("Enter your name, email, and a password of at least " + PW_MIN + " characters.");
    }
    var admin = {
      id: uid("ag"), name: name, email: email, phone: "",
      level: byId("s-house").value, role: "admin", status: "active",
      startedOn: todayISO(), createdAt: new Date().toISOString(),
      approvedOn: todayISO()
    };
    authMsg("Securing your password\u2026", "info");
    setPw(admin, pw).then(function () {
      session.agentId = admin.id;
      try { localStorage.setItem("tc_agent", admin.id); } catch (e) {}
      commit(function (s) {
        s.org.name = org || s.org.name;
        s.org.houseLevel = byId("s-house").value;
        s.org.costPerCall = num(byId("s-cpc").value);
        if (s.org.advanceRate == null) s.org.advanceRate = 75;
        s.agents.push(admin);
      });
    });
  }

  function doSignin() {
    var email = normEmail(val("l-email")), pw = val("l-pw");
    var byEmail = null;
    state.agents.forEach(function (a) { if (normEmail(a.email) === email) byEmail = a; });
    /* Without WebCrypto a hashed password cannot be checked at all. Say that,
       rather than telling someone their correct password is wrong. */
    if (byEmail && byEmail.pwHash && !subtle()) {
      return authMsg("This browser cannot verify passwords here. Open the desk over https in a current browser \u2014 a private or embedded view may be blocking it.");
    }
    /* Hashing takes a beat; say so rather than leaving the button dead. */
    if (byEmail) authMsg("Checking\u2026", "info");
    Promise.resolve(byEmail ? verifyPw(byEmail, pw) : false).then(function (ok) {
      if (!ok) return authMsg("That email and password do not match an account.");
      if (byEmail.status === "pending") {
        return authMsg(state.org.name + " has not approved your account yet. You will be able to sign in once they do.", "warnbar");
      }
      if (byEmail.status === "declined") return authMsg("This account was not approved. Contact your manager.");
      if (byEmail.status !== "active") return authMsg("That account is inactive. Ask Thrive to reactivate it.");
      session.agentId = byEmail.id;
      try { localStorage.setItem("tc_agent", byEmail.id); } catch (e) {}
      setUI("view", "");
      /* Sign-in is the one moment the password is in hand, so it is the only
         chance to replace a legacy plaintext entry with a hash. */
      upgradePw(byEmail, pw).then(function (upgraded) {
        /* A migration that ran at boot has nobody to save it until someone
           signs in — persist it now so the stored book stops being legacy. */
        if (upgraded) return;
        if (migrated) commit(null); else render();
      });
    });
  }

  /** Open self-signup. The account lands in the owner's approval queue. */
  function doSignup() {
    var name = val("u-name"), email = normEmail(val("u-email")),
        pw = val("u-pw"), pw2 = val("u-pw2");
    if (!name) return authMsg("Enter your full name.");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return authMsg("Enter a valid email address.");
    if (pw.length < PW_MIN) return authMsg("Choose a password of at least " + PW_MIN + " characters.");
    if (pw !== pw2) return authMsg("Those passwords do not match.");
    var dupe = null;
    state.agents.forEach(function (a) { if (normEmail(a.email) === email) dupe = a; });
    if (dupe) {
      return authMsg(dupe.status === "pending"
        ? "An account for that email is already waiting for approval."
        : "An account already uses that email. Sign in instead.");
    }
    var agent = {
      id: uid("ag"), name: name, email: email, phone: "",
      level: String(state.org.defaultLevel || "25"), role: "agent", status: "pending",
      appliedOn: todayISO(), createdAt: new Date().toISOString(),
      startedOn: null, approvedOn: null, approvedBy: null
    };
    authMsg("Securing your password\u2026", "info");
    setPw(agent, pw).then(function () {
      setUI("authTab", "pending");
      setUI("pendingEmail", email);
      /* An applicant opening a view-only link cannot publish, so the account
         would live in their browser and nowhere else. Saying "you're in the
         queue" then would be a lie — the owner never sees them. */
      commit(function (s) { s.agents.push(agent); }, function (err) {
        if (!err) return;
        state.agents = state.agents.filter(function (a) { return a.id !== agent.id; });
        setUI("authTab", "blocked");
        setUI("pendingEmail", email);
        render();
      });
    });
  }

  /* =============================================================== SHELL */
  /* The commission grid and the roster live inside Settings — they configure
     the desk rather than report on it, and the rail stays short. */
  var OWNER_TABS = [
    ["overview", "Overview"], ["analytics", "Analytics"], ["producers", "Producers"],
    ["deals", "All deals"], ["pnl", "Profitability"],
    ["notifications", "Notifications"], ["settings", "Settings"]
  ];
  var AGENT_TABS = [["mydesk", "My desk"], ["myanalytics", "Analytics"], ["mycalls", "Daily calls"],
    ["mydeals", "My deals"], ["notifications", "Notifications"]];

  function tabsFor() { return isOwner() ? OWNER_TABS : AGENT_TABS; }
  /* Reached from the masthead rather than the rail — everyone needs it, but
     not often enough to spend a tab on it. */
  var OFF_RAIL = { account: 1 };
  function currentView() {
    var tabs = tabsFor();
    var cur = getUI("view", "");
    if (OFF_RAIL[cur]) return cur;
    for (var i = 0; i < tabs.length; i++) if (tabs[i][0] === cur) return cur;
    return tabs[0][0];
  }

  function navTabs() {
    var cur = currentView();
    var waiting = isOwner() ? pendingAgents().length : 0;
    var due = draftDue().length;
    return '<nav class="rail"><div class="rail-in">' + tabsFor().map(function (t) {
      var n = t[0] === "settings" ? waiting : t[0] === "notifications" ? due : 0;
      var badge = n ? '<span class="tab-badge">' + n + "</span>" : "";
      return '<button data-act="nav" data-view="' + t[0] + '"' + (cur === t[0] ? ' aria-current="page"' : "") + ">" + esc(t[1]) + badge + "</button>";
    }).join("") + "</div></nav>";
  }

  function masthead() {
    var m = me(), owner = isOwner();
    var due = draftDue().length;
    return '<header class="mast' + (owner ? " is-owner" : "") + '"><div class="mast-in">'
      + '<div class="wordmark"><div class="bar"></div><div class="lock">'
      + "<h1>" + esc(state.org.name) + "</h1><p>" + (owner ? "Owner desk" : "LOA Producer Desk") + "</p></div></div>"
      + '<div class="mast-right">'
      /* Sits beside the contract chip and stays until the status moves. */
      + (due
          ? '<button class="alert-chip" data-act="nav" data-view="notifications" title="'
            + esc(due + " polic" + (due === 1 ? "y has" : "ies have") + " passed their draft date and still need a status") + '">'
            + '<i></i>' + due + " to update</button>"
          : "")
      + (owner
          ? '<span class="lvl-chip">AGENCY <b>' + esc(state.org.houseLevel) + "%</b></span>"
          : '<span class="lvl-chip">CONTRACT <b>' + esc(m.level) + "%</b></span>")
      + '<button class="whoami" data-act="nav" data-view="account" title="Your account and password">'
      + '<p class="eyebrow">' + (owner ? "Owner" : "Producer") + "</p><strong>" + esc(m.name) + "</strong></button>"
      + '<button class="btn ghost sm" data-act="signout" style="color:#C7D6E8;border-color:rgba(255,255,255,.22)">Sign out</button>'
      + "</div></div></header>";
  }

  function render() {
    var root = byId("root");
    if (!root) return;
    if (!me()) { renderAuth(); return; }
    var view = currentView();
    var inner = view === "overview" ? viewOverview()
      : view === "analytics" ? viewAnalytics()
      : view === "myanalytics" ? viewMyAnalytics()
      : view === "producers" ? viewProducers()
      : view === "deals" ? viewAllDeals()
      : view === "pnl" ? viewPnl()
      : view === "notifications" ? viewNotifications()
      : view === "settings" ? viewSettings()
      : view === "account" ? viewAccount()
      : view === "mycalls" ? viewMyCalls()
      : view === "mydeals" ? viewMyDeals()
      : viewMyDesk();
    root.innerHTML = masthead() + navTabs() + '<main class="wrap">' + noticeBar() + inner + "</main>"
      + deleteDialog();
    refreshCalc();
  }

  /* The second of the two confirmations. The first arms the button in
     place; this one names the person and spells out what leaves with
     them, because a roster row and a book of business look the same from
     a button that only says "Delete". */
  function deleteDialog() {
    var id = session.delAgent;
    if (!id) return "";
    var a = agentById(id);
    if (!a) return "";
    var f = agentFootprint(id);
    var loses = [];
    if (f.deals) loses.push(f.deals + " deal" + (f.deals === 1 ? "" : "s") + " worth " + money(f.ap) + " in written premium");
    if (f.callDays) loses.push(f.calls + " inbound call" + (f.calls === 1 ? "" : "s") + " across " + f.callDays + " logged day" + (f.callDays === 1 ? "" : "s"));

    return '<div class="modal-shade"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="del-h">'
      + '<h3 id="del-h">Are you sure you want to delete this user?</h3>'
      + '<p class="who">' + esc(a.name) + '<span>' + esc(a.email) + "</span></p>"
      + (loses.length
        ? '<p class="warn">Deleting ' + esc(a.name.split(" ")[0]) + " also removes:</p><ul>"
          + loses.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"
          + '<p class="warn">That business disappears from every total on this desk and from the owner console. It cannot be undone.</p>'
        : '<p class="warn">They have logged nothing yet, so only the account itself goes. It cannot be undone.</p>')
      + '<div class="row end">'
      + '<button class="btn ghost" data-act="del-agent-cancel">Cancel</button>'
      + '<button class="btn danger" data-act="del-agent-confirm" data-id="' + esc(id) + '">Yes, delete ' + esc(a.name.split(" ")[0]) + " and their data</button>"
      + "</div></div></div>";
  }

      + '<div class="field"><label for="c-date">Date</label><input type="date" id="c-date" value="' + esc(d.date) + '" max="' + todayISO() + '" required></div>'
      + '<div class="field"><label for="c-calls">Inbound calls taken</label><input type="number" id="c-calls" min="0" step="1" inputmode="numeric" pattern="[0-9]*" data-act="calls-int" value="' + esc(d.calls) + '" required></div>'
      + '<div class="field"><label for="c-note">Notes</label><input type="text" id="c-note" value="' + esc(d.note || "") + '" placeholder="Phones slow after 2pm, three no-shows…"></div>'

        + '<td class="n"><button class="btn ghost sm" data-act="edit-day" data-date="' + esc(c.date) + '">Edit</button> '
        + '<button class="btn danger sm" data-act="del-day" data-id="' + esc(c.id) + '">Delete</button></td>'
        + "</tr>";

    h += '<div class="panel"><div class="panel-head"><h3>Logged days</h3><span class="note">' + rows.length + " day" + (rows.length === 1 ? "" : "s") + " in range</span></div>"

      + (rows.length
        ? '<div class="tblwrap"><table class="data"><thead><tr><th>Date</th><th class="n">Calls</th><th class="n">Deals closed</th><th class="n">Calls / deal</th><th>Notes</th><th></th></tr></thead><tbody>'

  function viewMyDeals() {
    var m = me(), r = rangeBounds();
    var fStatus = getUI("dealStatus", ""), q = getUI("dealSearch", "");

      return d.agentId === m.id && inRange(d.date, r.from, r.to) && (!fStatus || d.status === fStatus);

    var deals = mine.filter(function (d) { return dealMatches(d, q, false); })
      .sort(function (a, b) { return b.date < a.date ? -1 : 1; });

    var editing = getUI("editDeal", "");

      + "<div>" + rangeControls() + "</div></div>";

  /* ==================================================================== */
  /*                          SHARED: DEALS                               */
  /* ==================================================================== */

  /** Everything you might reasonably type to find a deal again. */
  function dealHaystack(d, withAgent) {
    var c = CARRIER_BY_ID[d.carrierId] || {};
    var bits = [d.client, d.policyNo, c.name, d.product, d.date, prettyDate(d.date),
                d.draftDate, d.draftDate ? prettyDate(d.draftDate) : "",
                statusOf(d.status).label, d.notes, "$" + num(d.mp).toFixed(2), num(d.mp).toFixed(0),
                d.paidOut ? "paid out" : "not paid out unpaid owed"];
    if (withAgent) bits.push((agentById(d.agentId) || {}).name);
    return bits.join(" \u2022 ").toLowerCase();
  }
  /** Every whitespace-separated term has to appear somewhere in the row. */
  function dealMatches(d, q, withAgent) {
    if (!q) return true;
    var hay = dealHaystack(d, withAgent);
    var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    for (var i = 0; i < terms.length; i++) if (hay.indexOf(terms[i]) < 0) return false;
    return true;
  }
  function searchField(total, shown) {
    var q = getUI("dealSearch", "");
    return '<div class="field searchbox"><label for="f-dsearch">Find a deal</label>'
      + '<input type="search" id="f-dsearch" data-act="dealsearch" value="' + esc(q)
      + '" placeholder="Client, policy number, carrier, date\u2026" autocomplete="off">'
      + (q
        ? '<span class="hint">' + shown + " of " + total + " deal" + (total === 1 ? "" : "s")
          + ' \u00b7 <button type="button" class="linkbtn" data-act="dealsearch-clear">Clear</button></span>'
        : '<span class="hint">Type any part of a client name, policy number, carrier or date.</span>')
      + "</div>";
  }

  /** Has the producer actually been handed their commission yet? Every deal
      starts at No, and only the owner can move it — the producer reads it. */
  function payoutCell(d, editable) {
    var yes = !!d.paidOut;
    var pill = '<span class="pill ' + (yes ? "good" : "bad") + '">' + (yes ? "Yes" : "No") + "</span>";
    if (!editable) return pill;
    return '<button class="pillbtn" data-act="toggle-paid" data-id="' + esc(d.id) + '" title="Mark commission '
      + (yes ? "unpaid" : "paid") + '">' + pill + "</button>";
  }

  function dealsTable(deals, showAgent, showHouse) {
    if (!deals.length) return emptyState("No deals in this range", "Write one and it lands here.");
    var owner = isOwner();
    var rows = deals.map(function (d) {
      var c = CARRIER_BY_ID[d.carrierId];
      var comm = agentCommOn(d);
      var spread = spreadOn(d);
      return "<tr>"
        + '<td class="mono nowrap">' + esc(prettyDate(d.date)) + "</td>"
        + (showAgent ? '<td class="who">' + esc((agentById(d.agentId) || {}).name || "\u2014") + "</td>" : "")
        + '<td class="who">' + esc(d.client || "\u2014") + "</td>"
        + "<td>" + esc(c ? c.name : d.carrierId) + "</td>"
        + '<td class="dim">' + esc(d.product || "\u2014") + "</td>"
        + '<td class="n">' + money(d.ap) + "</td>"
        + '<td class="n">' + (d.agentPct ? pct(d.agentPct, 0) : "\u2014") + "</td>"
        + '<td class="n">' + money(comm) + "</td>"
        + '<td class="ctr">' + payoutCell(d, owner) + "</td>"
        + (showHouse ? '<td class="n">' + money(spread) + "</td>" : "")
        + "<td>" + statusPill(d.status) + "</td>"
        + '<td class="mono nowrap">' + esc(d.draftDate ? prettyDate(d.draftDate) : "\u2014") + "</td>"
        + '<td class="mono dim nowrap">' + esc(d.policyNo || "\u2014") + "</td>"
        + '<td class="n"><button class="btn ghost sm" data-act="edit-deal" data-id="' + esc(d.id) + '">Edit</button></td>'
        + "</tr>";
    }).join("");

    var totComm = deals.reduce(function (t, d) { return t + agentCommOn(d); }, 0);
    var totSpread = deals.reduce(function (t, d) { return t + spreadOn(d); }, 0);
    var owed = deals.reduce(function (t, d) {
      return t + (statusOf(d.status).group === "paid" && !d.paidOut ? agentCommOn(d) : 0);
    }, 0);

    return '<div class="tblwrap"><table class="data"><thead><tr>'
      + "<th>Date</th>" + (showAgent ? "<th>Producer</th>" : "")
      + '<th>Client</th><th>Carrier</th><th>Product</th>'
      + '<th class="n">Annualized</th><th class="n">Comp %</th><th class="n">Commission</th>'
      + '<th class="ctr">Paid out</th>'
      + (showHouse ? '<th class="n">House spread</th>' : "")
      + "<th>Status</th><th>Draft date</th><th>Policy #</th><th></th>"
      + "</tr></thead><tbody>" + rows
      + '<tr class="total"><td>Total</td>' + (showAgent ? "<td></td>" : "")
      + "<td>" + deals.length + " deal" + (deals.length === 1 ? "" : "s") + "</td><td></td><td></td>"
      + '<td class="n">' + money(sumBy(deals, "ap")) + '</td><td></td><td class="n">' + money(totComm) + "</td>"
      + '<td class="ctr">' + (owed > 0 ? '<span class="dim nowrap">' + money(owed) + " owed</span>" : "") + "</td>"
      + (showHouse ? '<td class="n">' + money(totSpread) + "</td>" : "")
      + "<td></td><td></td><td></td><td></td></tr>"
      + "</tbody></table></div>";
  }

  function dealForm(deal) {
    var m = me(), owner = isOwner();
    var d = deal || {
      id: "", agentId: owner ? "" : m.id, date: todayISO(), client: "", carrierId: "", product: "",
      mp: "", dealType: DEAL_TYPES[0].k, status: "underwriting", policyNo: "", notes: "",
      agentPct: "", housePct: "", paidOut: false, draftDate: ""
    };
    var prods = productsOf(d.carrierId);
    var prodSel = '<select id="d-product" data-act="product"' + (prods.length ? "" : " disabled") + ">"
      + '<option value="">' + (d.carrierId ? (prods.length ? "Select product…" : "No grid on file for this carrier") : "Pick a carrier first") + "</option>"
      + prods.map(function (p) { return '<option value="' + esc(p.name) + '"' + (d.product === p.name ? " selected" : "") + ">" + esc(p.name) + "</option>"; }).join("")
      + "</select>";

    return '<form data-act="save-deal" data-id="' + esc(d.id) + '">'
      + '<div class="grid g2">'
      + (owner ? '<div class="field"><label for="d-agent">Writing producer</label><select id="d-agent" data-act="dealagentpick" required><option value="">Select producer…</option>' + agentOptions(d.agentId, false) + "</select></div>" : "")
      + '<div class="field"><label for="d-date">Date written</label><input type="date" id="d-date" value="' + esc(d.date) + '" required></div>'
      + '<div class="field"><label for="d-client">Client name</label><input type="text" id="d-client" value="' + esc(d.client) + '" placeholder="Doris Whitfield" required></div>'
      + '<div class="field"><label for="d-carrier">Carrier</label><select id="d-carrier" data-act="carrier" required>' + carrierOptions(d.carrierId) + "</select></div>"
      + '<div class="field"><label for="d-product">Product</label>' + prodSel + "</div>"
      + '<div class="field"><label for="d-mp">Monthly premium</label><input type="number" id="d-mp" min="0" step="0.01" data-act="recalc" value="' + esc(d.mp) + '" required></div>'
      + '<div class="field"><label for="d-type">Type of deal</label><select id="d-type">' + dealTypeOptions(d.dealType) + '</select></div>'
      + '<div class="field"><label for="d-status">Status</label><select id="d-status">' + statusOptions(d.status) + "</select></div>"
      + '<div class="field"><label for="d-policy">Policy number</label><input type="text" id="d-policy" value="' + esc(d.policyNo) + '"></div>'
      + '<div class="field"><label for="d-draft">Policy draft date</label><input type="date" id="d-draft" value="' + esc(d.draftDate || "") + '"><span class="hint">The day the carrier pulls first premium.</span></div>'
      + '<div class="field"><label for="d-paid">Agent paid</label>'
      + (owner
          ? '<select id="d-paid">'
            + '<option value="0"' + (d.paidOut ? "" : " selected") + ">No</option>"
            + '<option value="1"' + (d.paidOut ? " selected" : "") + ">Yes</option>"
            + '</select><span class="hint">Whether the producer has been handed this commission. Only you can set it.</span>'
          : '<select disabled aria-readonly="true"><option>' + (d.paidOut ? "Yes" : "No") + "</option></select>"
            + '<span class="hint">Set by Thrive when the commission is actually paid out.</span>')
      + "</div>"
      + (owner ? '<div class="field"><label for="d-apct">Producer comp %</label><input type="number" id="d-apct" min="0" max="100" step="0.5" data-act="recalc" value="' + esc(d.agentPct) + '"><span class="hint">Defaults to the producer’s contract level. Override only if you paid something else.</span></div>' : "")
      + (owner ? '<div class="field"><label for="d-hpct">Agency comp %</label><input type="number" id="d-hpct" min="0" step="0.5" data-act="recalc" value="' + esc(d.housePct) + '"><span class="hint">From the carrier grid at ' + esc(state.org.houseLevel) + "%.</span></div>" : "")
      + "</div>"
      + '<div class="field" style="margin-top:14px"><label for="d-notes">Notes</label><textarea id="d-notes" placeholder="Draft date, bank info pending, replacement…">' + esc(d.notes) + "</textarea></div>"
      + '<div id="d-calc" class="msg info mono" style="margin-top:14px"></div>'
      + '<div class="row end" style="margin-top:14px">'
      + (d.id ? '<button class="btn danger" type="button" data-act="del-deal" data-id="' + esc(d.id) + '">Delete deal</button>' : "")
      + (d.id ? '<button class="btn ghost" type="button" data-act="cancel-edit">Cancel</button>' : "")
      + '<button class="btn accent" type="submit">' + (d.id ? "Save changes" : "Add deal") + "</button></div>"
      + "</form>";
  }

  /** Live math under the deal form, and the marketing line under the calls form. */
  function refreshCalc() {
    var box = byId("d-calc");
    if (box) {
      var mp = num(val("d-mp")), ap = mp * 12;
      var agent = byId("d-agent") ? agentById(byId("d-agent").value) : me();
      var apct = byId("d-apct") ? num(val("d-apct")) : compPctFor(agent || me(), val("d-carrier"), val("d-product"));
      var advPct = advanceRate() * 100, adv = ap * advanceRate();
      var comm = adv * apct / 100;
      var txt = money(mp, 2) + "/mo  \u00d7  12  =  " + money(ap) + " annualized"
        + "  \u00d7  " + dec(advPct, 0) + "% advance  =  " + money(adv, 2)
        + "  \u00d7  " + (apct || 0) + "%  =  " + money(comm, 2) + " to the producer";
      if (byId("d-hpct")) {
        var hp = num(val("d-hpct"));
        if (hp > 0) {
          var hc = adv * hp / 100;
          txt += "   \u2502   agency " + money(hc, 2) + "   \u2502   spread " + money(hc - comm, 2);
        }
      }
      box.textContent = txt;
    }
    /* What Thrive pays for an inbound call is owner-only. The element only
       renders on the owner's calls form; the role check keeps it that way. */
    var cbox = isOwner() ? byId("c-cost") : null;
    if (cbox) {
      var n = num(val("c-calls"));
      cbox.textContent = intf(n) + " call" + (n === 1 ? "" : "s") + "  ×  " + money(costPerCall()) + "  =  " + money(n * costPerCall()) + " in marketing";
    }
  }

  /* ==================================================================== */
  /*                            OWNER DESK                                */
  /* ==================================================================== */

  function viewOverview() {
    var r = rangeBounds();
    var ids = producerIds();
    var k = metrics(ids, r.from, r.to);
    var producers = activeAgents().filter(function (a) { return a.role !== "admin"; });
    var logging = producers.filter(function (a) {
      var pk = metrics([a.id], r.from, r.to);
      return pk.callsTaken > 0 || pk.written > 0;
    }).length;
    var profitable = k.net >= 0;

    var h = '<div class="page-head"><div><p class="eyebrow">' + esc(r.label) + "</p><h2>The floor</h2>"
      + '<p class="sub">Every inbound call costs ' + money(costPerCall()) + ". The question this page answers is how many of them turn into premium that actually pays.</p></div>"
      + "<div>" + rangeControls() + "</div></div>";

    h += '<div class="tiles">'
      + tile("Calls taken", intf(k.callsTaken), { foot: money(k.marketingCost) + " in marketing" })
      + tile("Deals closed", intf(k.written), { foot: k.written ? money(k.costPerDeal) + " of calls each" : "No deals yet" })
      + tile("Close rate", k.callsTaken ? pct(k.closeRate, 1) : "\u2014", { tone: "key",
          foot: k.written ? "1 deal per " + dec(k.callsPerDeal, 1) + " calls" : "Deals \u00f7 calls taken" })
      + tile("Issued & paid", money(k.apPaid), { tone: "good",
          foot: k.paid.length + " polic" + (k.paid.length === 1 ? "y" : "ies") + " \u00b7 " + pct(k.placement, 0) + " placement" })
      + "</div>";

    /* The money the owner actually asked to see, in the order it is earned. */
    h += '<div class="tiles" style="margin-top:12px">'
      + tile("Gross commission", money(k.houseGrossPaid), { tone: "key",
          foot: "Carriers paid Thrive on " + money(k.advPaid) + " advanced" })
      + tile("Agent commission", money(k.agentCommPaid), { tone: "warn",
          foot: "Out to producers on " + k.paid.length + " placed deal" + (k.paid.length === 1 ? "" : "s") })
      + tile("Thrive commission", money(k.spreadPaid), {
          foot: "What the agency keeps before marketing" })
      + tile("Net commission", money(k.net), { tone: profitable ? "good" : "bad", sign: profitable ? "pos" : "neg",
          foot: "After agents and " + money(k.marketingCost) + " marketing" })
      + "</div>";

    h += '<div class="panel"><div class="panel-head"><h3>Where the commission goes</h3>'
      + '<span class="note">Issued &amp; paid business only \u2014 nothing counts until the carrier settles</span></div>'
      + '<div class="panel-body flush">' + commissionLadder(k) + "</div></div>";

    h += '<div class="tiles" style="margin-top:18px">'
      + tile("Monthly premium", money(k.mpWritten), { foot: "Avg " + money(k.avgMp) + " / deal" })
      + tile("Close rate on paid", k.callsTaken ? pct(ratio(k.paid.length, k.callsTaken), 1) : "\u2014", { tone: k.paid.length ? "good" : "",
          foot: k.paid.length ? money(k.costPerPaid) + " a paid deal" : "Nothing paid yet" })
      + tile("Producers on the board", intf(logging), { foot: "of " + producers.length + " active" })
      + tile("Return on marketing", k.marketingCost > 0 ? pct(k.roi, 0) : "\u2014", { tone: profitable ? "good" : "bad",
          foot: k.marketingCost > 0 ? money(k.net) + " on " + money(k.marketingCost) : "Log calls to see this" })
      + "</div>";

    h += producerTable(r, false);
    return h;
  }

  /** Gross commission down to net, one line per step, so every figure on the
      owner desk can be traced back to premium x advance x rate. */
  function commissionLadder(k) {
    var lines = [
      ["Gross commission", "What the carriers paid Thrive", k.houseGrossPaid, ""],
      ["Less agent commission", k.paid.length + " placed deal" + (k.paid.length === 1 ? "" : "s"), -k.agentCommPaid, ""],
      ["Thrive commission", "What the agency keeps on the business", k.spreadPaid, "sub"],
      ["Less marketing", intf(k.callsTaken) + " inbound calls at " + money(costPerCall()), -k.marketingCost, ""],
      ["Net commission", "The program\u2019s profit for the period", k.net, "total"]
    ];
    return '<div class="tblwrap"><table class="data"><tbody>' + lines.map(function (l) {
      var cls = l[3] === "total" ? ' class="total"' : "";
      var col = l[3] === "total" ? (l[2] >= 0 ? "var(--good)" : "var(--bad)")
        : l[2] < 0 ? "var(--bad)" : "var(--ink)";
      return "<tr" + cls + "><td><strong>" + esc(l[0]) + '</strong><div class="dim">' + esc(l[1]) + "</div></td>"
        + '<td class="n" style="color:' + col + (l[3] ? ";font-weight:700" : "") + '">' + money(l[2], 2) + "</td></tr>";
    }).join("") + "</tbody></table></div>";
  }

  function producerTable(r, detailed) {
    /* Owners appear only once they have actually written or taken calls —
       an idle owner row is noise on a floor report. */
    var rows = activeAgents().map(function (a) {
      return { a: a, k: metrics([a.id], r.from, r.to) };
    }).filter(function (x) {
      return x.a.role !== "admin" || x.k.callsTaken > 0 || x.k.written > 0;
    }).sort(function (x, y) { return y.k.apPaid - x.k.apPaid || y.k.apWritten - x.k.apWritten; });
    if (!rows.length) return "";
    var top = Math.max.apply(null, rows.map(function (x) { return x.k.apWritten; }).concat([1]));
    var team = metrics(producerIds(), r.from, r.to);

    var body = rows.map(function (x) {
      var a = x.a, k = x.k;
      var w = Math.round(ratio(k.apWritten, top));
      return "<tr>"
        + '<td class="who">' + esc(a.name) + (a.role === "admin" ? ' <span class="pill key">Owner</span>' : "") + '<div class="dim">' + esc(a.email) + "</div></td>"
        + '<td class="n">' + esc(a.level) + "%</td>"
        + '<td class="n">' + intf(k.callsTaken) + "</td>"
        + '<td class="n">' + intf(k.written) + "</td>"
        + '<td class="n">' + (k.written ? dec(k.callsPerDeal, 1) : "—") + "</td>"
        + '<td class="n">' + pct(k.closeRate, 1) + "</td>"
        + '<td class="n">' + money(k.mpWritten) + '<div class="bar-mini" style="margin-top:4px"><i style="width:' + w + '%"></i></div></td>'
        + '<td class="n">' + money(k.avgMp) + "</td>"
        + '<td class="n">' + money(k.apPaid) + "</td>"
        + '<td class="n">' + pct(k.placement, 0) + "</td>"
        + '<td class="n">' + money(k.agentCommPaid) + "</td>"
        + (detailed ? '<td class="n" style="color:' + (k.net >= 0 ? "var(--good)" : "var(--bad)") + ';font-weight:700">' + money(k.net) + "</td>" : "")
        + "</tr>";
    }).join("");

    return '<div class="panel"><div class="panel-head"><h3>Producers</h3><span class="note">Ranked by premium that paid · bars are monthly premium written</span></div>'
      + '<div class="panel-body flush"><div class="tblwrap"><table class="data"><thead><tr>'
      + '<th>Producer</th><th class="n">Level</th><th class="n">Calls</th><th class="n">Deals</th><th class="n">Calls / deal</th><th class="n">Close %</th>'
      + '<th class="n">Monthly prem.</th><th class="n">Avg deal</th><th class="n">AP paid</th><th class="n">Placement</th><th class="n">Their comp</th>'
      + (detailed ? '<th class="n">Net to house</th>' : "")
      + "</tr></thead><tbody>" + body
      + '<tr class="total"><td>Floor</td><td class="n">—</td><td class="n">' + intf(team.callsTaken) + '</td><td class="n">' + intf(team.written)
      + '</td><td class="n">' + (team.written ? dec(team.callsPerDeal, 1) : "—") + '</td><td class="n">' + pct(team.closeRate, 1)
      + '</td><td class="n">' + money(team.mpWritten) + '</td><td class="n">' + money(team.avgMp) + '</td><td class="n">' + money(team.apPaid)
      + '</td><td class="n">' + pct(team.placement, 0) + '</td><td class="n">' + money(team.agentCommPaid) + "</td>"
      + (detailed ? '<td class="n">' + money(team.net) + "</td>" : "")
      + "</tr></tbody></table></div></div></div>";
  }

  function viewProducers() {
    var r = rangeBounds();
    var h = '<div class="page-head"><div><p class="eyebrow">' + esc(r.label) + "</p><h2>Producers</h2>"
      + '<p class="sub">Calls per deal is the number that matters here: at ' + money(costPerCall())
      + " a call, a producer who closes one in eight costs half what one who closes one in sixteen does.</p></div>"
      + "<div>" + rangeControls() + "</div></div>";
    h += producerTable(r, true);

    var who = getUI("callAgent", "") || (state.agents[0] || {}).id || "";
    if (!agentById(who)) who = (state.agents[0] || {}).id || "";
    if (who) {
      h += '<div class="panel"><div class="panel-head"><h3>Log a day for a producer</h3>'
        + '<span class="note">Producers log their own from their desk — this is for catching up a missed day.</span></div>'
        + '<div class="panel-body">' + callsForm(who, getUI("callDate", todayISO()), true) + "</div></div>";
    }

    /* Per-producer daily call log, so the owner can see the floor day by day */
    var rows = state.calls.filter(function (c) { return inRange(c.date, r.from, r.to); })
      .sort(function (a, b) { return b.date < a.date ? -1 : (b.date > a.date ? 1 : 0); });
    var dealsByKey = {};
    state.deals.forEach(function (d) {
      if (!inRange(d.date, r.from, r.to)) return;
      var key = d.agentId + "|" + d.date;
      dealsByKey[key] = (dealsByKey[key] || 0) + 1;
    });

    h += '<div class="panel"><div class="panel-head"><h3>Call log</h3><span class="note">' + rows.length + " day" + (rows.length === 1 ? "" : "s") + " logged across the floor</span></div>"
      + '<div class="panel-body flush">'
      + (rows.length
        ? '<div class="tblwrap"><table class="data"><thead><tr><th>Date</th><th>Producer</th><th class="n">Calls</th><th class="n">Cost</th><th class="n">Deals</th><th class="n">Calls / deal</th><th>Notes</th></tr></thead><tbody>'
          + rows.map(function (c) {
            var closed = dealsByKey[c.agentId + "|" + c.date] || 0;
            return "<tr><td class=\"mono\">" + esc(prettyDate(c.date)) + "</td>"
              + '<td class="who">' + esc((agentById(c.agentId) || {}).name || "—") + "</td>"
              + '<td class="n">' + intf(c.calls) + "</td>"
              + '<td class="n">' + money(num(c.calls) * costPerCall()) + "</td>"
              + '<td class="n">' + intf(closed) + "</td>"
              + '<td class="n">' + (closed ? dec(num(c.calls) / closed, 1) : "—") + "</td>"
              + '<td class="dim">' + esc(c.note || "") + "</td></tr>";
          }).join("")
          + "</tbody></table></div>"
        : emptyState("No calls logged yet", "Producers log their own days from their desk."))
      + "</div></div>";
    return h;
  }

  function viewAllDeals() {
    var r = rangeBounds();
    var fAgent = getUI("dealAgent", ""), fStatus = getUI("dealStatus", ""),
        fCarrier = getUI("dealCarrier", ""), q = getUI("dealSearch", "");
    var ids = fAgent ? [fAgent] : producerIds();
    var setOf = {}; ids.forEach(function (i) { setOf[i] = 1; });
    var scoped = state.deals.filter(function (d) {
      if (!setOf[d.agentId] || !inRange(d.date, r.from, r.to)) return false;
      if (fStatus && d.status !== fStatus) return false;
      if (fCarrier && d.carrierId !== fCarrier) return false;
      return true;
    });
    var deals = scoped.filter(function (d) { return dealMatches(d, q, true); })
      .sort(function (a, b) { return b.date < a.date ? -1 : 1; });

    var editing = getUI("editDeal", "");
    var editDeal = null;
    if (editing) state.deals.forEach(function (d) { if (d.id === editing) editDeal = d; });

    var h = '<div class="page-head"><div><p class="eyebrow">' + esc(r.label) + "</p><h2>All deals</h2>"
      + '<p class="sub">The whole book. Search it, write a deal on any producer’s behalf, and click a “Paid out” cell to mark a commission settled.</p></div>'
      + "<div>" + rangeControls() + "</div></div>";

    h += '<div class="panel"><div class="panel-head"><h3>' + (editDeal ? "Edit deal" : "New deal") + "</h3></div>"
      + '<div class="panel-body">' + dealForm(editDeal) + "</div></div>";

    h += '<div class="panel"><div class="panel-body"><div class="filters top">'
      + searchField(scoped.length, deals.length)
      + '<div class="field"><label for="f-dagent">Producer</label><select id="f-dagent" data-act="dealagent">' + agentOptions(fAgent, true) + "</select></div>"
      + '<div class="field"><label for="f-dstatus">Status</label><select id="f-dstatus" data-act="dealstatus"><option value="">All statuses</option>' + statusOptions(fStatus) + "</select></div>"
      + '<div class="field"><label for="f-dcarrier">Carrier</label><select id="f-dcarrier" data-act="dealcarrier"><option value="">All carriers</option>'
      + CARRIERS.map(function (c) { return '<option value="' + esc(c.id) + '"' + (fCarrier === c.id ? " selected" : "") + ">" + esc(c.name) + "</option>"; }).join("")
      + "</select></div></div></div></div>";

    h += '<div class="panel"><div class="panel-head"><h3>' + deals.length + " deal" + (deals.length === 1 ? "" : "s") + "</h3>"
      + '<span class="note">' + (q ? "Matching \u201c" + esc(q) + "\u201d" : "Newest first") + "</span></div>"
      + '<div class="panel-body flush">' + dealsTable(deals, !fAgent, true) + "</div></div>";
    return h;
  }

  function carrierPanel(deals) {
    var agg = {};
    deals.forEach(function (d) {
      var k = agg[d.carrierId] || (agg[d.carrierId] = { n: 0, mp: 0, ap: 0, paid: 0, apPaid: 0, lost: 0, spread: 0 });
      k.n++; k.mp += num(d.mp); k.ap += num(d.ap);
      var g = statusOf(d.status).group;
      if (g === "paid") { k.paid++; k.apPaid += num(d.ap); k.spread += spreadOn(d); }
      if (g === "lost") k.lost++;
    });
    var list = Object.keys(agg).map(function (id) {
      return { id: id, name: (CARRIER_BY_ID[id] || {}).name || id, k: agg[id] };
    }).sort(function (a, b) { return b.k.apPaid - a.k.apPaid || b.k.ap - a.k.ap; });
    if (!list.length) return "";

    var rows = list.map(function (x) {
      var p = ratio(x.k.apPaid, x.k.ap);
      return "<tr><td class=\"who\">" + esc(x.name) + "</td>"
        + '<td class="n">' + intf(x.k.n) + "</td>"
        + '<td class="n">' + money(x.k.mp) + "</td>"
        + '<td class="n">' + money(x.k.ap) + "</td>"
        + '<td class="n">' + intf(x.k.paid) + "</td>"
        + '<td class="n">' + money(x.k.apPaid) + "</td>"
        + '<td class="n">' + pct(p, 0) + '<div class="bar-mini" style="margin-top:4px"><i class="good" style="width:' + Math.round(p) + '%"></i></div></td>'
        + '<td class="n">' + intf(x.k.lost) + "</td>"
        + '<td class="n">' + money(x.k.spread) + "</td></tr>";
    }).join("");
    return '<div class="panel"><div class="panel-head"><h3>By carrier</h3><span class="note">Which paper actually issues and pays</span></div>'
      + '<div class="panel-body flush"><div class="tblwrap"><table class="data"><thead><tr><th>Carrier</th><th class="n">Deals</th><th class="n">Monthly</th><th class="n">Annualized</th><th class="n">Paid</th><th class="n">AP paid</th><th class="n">Placement</th><th class="n">Fell off</th><th class="n">House spread</th></tr></thead><tbody>'
      + rows + "</tbody></table></div></div></div>";
  }

  function viewPnl() {
    var r = rangeBounds();
    var k = metrics(producerIds(), r.from, r.to);
    var profitable = k.net >= 0;
    var breakeven = k.paid.length ? k.spreadPaid / k.paid.length : 0;

    var h = '<div class="page-head"><div><p class="eyebrow">' + esc(r.label) + "</p><h2>Is the program making money?</h2>"
      + '<p class="sub">You buy the calls at ' + money(costPerCall()) + " each and collect at Thrive’s "
      + esc(state.org.houseLevel) + "% contract on business that issues and pays. Producer commission and marketing come out of that.</p></div>"
      + "<div>" + rangeControls() + "</div></div>";

    h += '<div class="tiles t3">'
      + tile("Agency gross", money(k.houseGrossPaid), { tone: "key", foot: "On " + money(k.apPaid) + " placed AP" })
      + tile("Paid to producers", money(k.agentCommPaid), { foot: k.paid.length + " placed deal" + (k.paid.length === 1 ? "" : "s") })
      + tile("Marketing", money(k.marketingCost), { tone: "warn", foot: intf(k.callsTaken) + " calls at " + money(costPerCall()) })
      + tile("Net to the program", money(k.net), { tone: profitable ? "good" : "bad", sign: profitable ? "pos" : "neg", foot: profitable ? "In the black" : "In the red" })
      + tile("Return on marketing", k.marketingCost > 0 ? pct(k.roi, 0) : "—", { tone: profitable ? "good" : "bad", sign: profitable ? "pos" : "neg", foot: k.marketingCost > 0 ? money(k.net) + " on " + money(k.marketingCost) : "Log calls to see this" })
      + tile("Spread per placed deal", k.paid.length ? money(breakeven) : "—", { foot: k.paid.length ? "Covers " + dec(breakeven / Math.max(costPerCall(), 1), 0) + " calls" : "Nothing paid yet" })
      + "</div>";

    var lines = [
      ["Agency commission on issued &amp; paid", k.houseGrossPaid],
      ["Less producer commission", -k.agentCommPaid],
      ["Less marketing (" + intf(k.callsTaken) + " inbound calls)", -k.marketingCost]
    ];
    h += '<div class="panel"><div class="panel-head"><h3>Program P&amp;L</h3><span class="note">Cash basis — only business that issued and paid</span></div>'
      + '<div class="panel-body flush"><div class="tblwrap"><table class="data"><tbody>'
      + lines.map(function (l) {
        return "<tr><td>" + l[0] + '</td><td class="n" style="color:' + (l[1] < 0 ? "var(--bad)" : "var(--ink)") + '">' + money(l[1], 2) + "</td></tr>";
      }).join("")
      + '<tr class="total"><td>Net to the program</td><td class="n" style="color:' + (profitable ? "var(--good)" : "var(--bad)") + '">' + money(k.net, 2) + "</td></tr>"
      + "</tbody></table></div></div></div>";

    var rows = activeAgents().map(function (a) { return { a: a, k: metrics([a.id], r.from, r.to) }; })
      .filter(function (x) { return x.a.role !== "admin" || x.k.callsTaken > 0 || x.k.written > 0; })
      .sort(function (x, y) { return y.k.net - x.k.net; });

    h += '<div class="panel"><div class="panel-head"><h3>Contribution by producer</h3><span class="note">Spread on their placed business, less the calls they burned</span></div>'
      + '<div class="panel-body flush">'
      + (rows.length ? '<div class="tblwrap"><table class="data"><thead><tr><th>Producer</th><th class="n">Level</th><th class="n">Calls</th><th class="n">AP paid</th><th class="n">Agency gross</th><th class="n">Their comp</th><th class="n">Spread</th><th class="n">Marketing</th><th class="n">Net</th><th class="n">ROI</th></tr></thead><tbody>'
        + rows.map(function (x) {
          var pos = x.k.net >= 0;
          return "<tr><td class=\"who\">" + esc(x.a.name) + "</td>"
            + '<td class="n">' + esc(x.a.level) + "%</td>"
            + '<td class="n">' + intf(x.k.callsTaken) + "</td>"
            + '<td class="n">' + money(x.k.apPaid) + "</td>"
            + '<td class="n">' + money(x.k.houseGrossPaid) + "</td>"
            + '<td class="n">' + money(x.k.agentCommPaid) + "</td>"
            + '<td class="n">' + money(x.k.spreadPaid) + "</td>"
            + '<td class="n">' + money(x.k.marketingCost) + "</td>"
            + '<td class="n" style="color:' + (pos ? "var(--good)" : "var(--bad)") + ';font-weight:700">' + money(x.k.net) + "</td>"
            + '<td class="n">' + (x.k.marketingCost > 0 ? pct(x.k.roi, 0) : "—") + "</td></tr>";
        }).join("")
        + "</tbody></table></div>"
        : emptyState("Nothing to weigh yet", "Once deals are marked issued and paid, contribution shows up here."))
      + "</div></div>";

    var bestSpread = k.pending.reduce(function (t, d) { return t + spreadOn(d); }, 0);
    h += '<div class="panel"><div class="panel-head"><h3>Pipeline</h3><span class="note">Not counted above — nothing is money until it pays</span></div>'
      + '<div class="panel-body"><div class="tiles">'
      + tile("Open AP", money(k.apPending), { tone: "warn", foot: k.pending.length + " deal" + (k.pending.length === 1 ? "" : "s") })
      + tile("Spread if it all places", money(bestSpread), { foot: "Best case" })
      + tile("At current placement", money(bestSpread * (k.placement / 100)), { foot: pct(k.placement, 0) + " placement" })
      + tile("Already fell off", money(k.apLost), { tone: "bad", foot: k.lost.length + " deal" + (k.lost.length === 1 ? "" : "s") })
      + "</div></div></div>";
    return h;
  }

  /* =============================================================== ROSTER */
  function pendingAgents() {
    return state.agents.filter(function (a) { return a.status === "pending"; })
      .sort(function (x, y) { return (x.appliedOn || "") < (y.appliedOn || "") ? -1 : 1; });
  }

  /** The roster, the approval queue and the join instructions. Lives inside
      Settings rather than on a tab of its own — who is on the floor and what
      they are contracted at is configuration, not a daily report. */
  function rosterSection() {
    var pend = pendingAgents();
    var roster = state.agents.filter(function (a) { return a.status !== "pending"; });

    var h = sectionHead("Roster", "Agents & approvals",
      "Producers create their own accounts from the sign-in page. Nobody can log in until you approve them here — set their contract level as you do.");

    /* --- approval queue ------------------------------------------------ */
    h += '<div class="panel"><div class="panel-head"><h3>Waiting for approval</h3>'
      + '<span class="note">' + (pend.length ? pend.length + " account" + (pend.length === 1 ? "" : "s") + " to review" : "Nothing waiting") + "</span></div>"
      + '<div class="panel-body flush">'
      + (pend.length
        ? '<div class="tblwrap"><table class="data"><thead><tr><th>Name</th><th>Email</th><th>Applied</th><th class="n">Start them at</th><th>Role</th><th></th></tr></thead><tbody>'
          + pend.map(function (a) {
            return "<tr><td class=\"who\">" + esc(a.name) + "</td>"
              + '<td class="dim">' + esc(a.email) + "</td>"
              + '<td class="mono">' + esc(prettyDate(a.appliedOn || a.createdAt.slice(0, 10))) + "</td>"
              + '<td class="n"><select data-act="pend-level" data-id="' + esc(a.id) + '" style="width:92px">' + levelOptionsFor(a.role, a.level) + "</select></td>"
              + '<td><select data-act="pend-role" data-id="' + esc(a.id) + '" style="width:110px"><option value="agent"' + (a.role === "agent" ? " selected" : "") + ">Producer</option><option value=\"admin\"" + (a.role === "admin" ? " selected" : "") + ">Owner</option></select></td>"
              + '<td class="n"><button class="btn accent sm" data-act="approve-agent" data-id="' + esc(a.id) + '">Approve</button> '
              + '<button class="btn danger sm" data-act="decline-agent" data-id="' + esc(a.id) + '">Decline</button></td></tr>';
          }).join("")
          + "</tbody></table></div>"
        : emptyState("No accounts waiting", "New sign-ups land here for you to approve."))
      + "</div></div>";

    /* --- the roster ---------------------------------------------------- */
    h += '<div class="panel"><div class="panel-head"><h3>Agents</h3><span class="note">' + roster.length + " on the roster</span></div><div class=\"panel-body flush\">"
      + (roster.length
        ? '<div class="tblwrap"><table class="data"><thead><tr><th>Name</th><th>Email</th><th class="n">Level</th><th>Role</th><th>Status</th><th>Started</th><th class="n">Lifetime AP paid</th><th></th></tr></thead><tbody>'
          + roster.map(function (a) {
            var life = metrics([a.id], "0000-01-01", "9999-12-31");
            var pill = a.status === "active" ? '<span class="pill good">Active</span>'
              : a.status === "declined" ? '<span class="pill bad">Declined</span>'
              : '<span class="pill">Inactive</span>';
            return "<tr><td class=\"who\">" + esc(a.name) + "</td><td class=\"dim\">" + esc(a.email) + "</td>"
              + '<td class="n"><select data-act="set-level" data-id="' + esc(a.id) + '" style="width:92px">' + levelOptionsFor(a.role, a.level) + "</select></td>"
              + '<td><select data-act="set-role" data-id="' + esc(a.id) + '" style="width:110px"><option value="agent"' + (a.role === "agent" ? " selected" : "") + ">Producer</option><option value=\"admin\"" + (a.role === "admin" ? " selected" : "") + ">Owner</option></select></td>"
              + "<td>" + pill + "</td>"
              + '<td class="mono">' + esc(a.startedOn ? prettyDate(a.startedOn) : "\u2014") + "</td>"
              + '<td class="n">' + money(life.apPaid) + "</td>"
              + '<td class="n nowrap"><button class="btn ghost sm" data-act="toggle-agent" data-id="' + esc(a.id) + '">' + (a.status === "active" ? "Deactivate" : "Reactivate") + "</button> "
              + '<button class="btn danger sm" data-act="del-agent" data-id="' + esc(a.id) + '">Delete</button></td></tr>';
          }).join("")
          + "</tbody></table></div>"
        : emptyState("Nobody on the roster yet", "Approved accounts show up here."))
      + "</div></div>";

    /* --- add someone directly ------------------------------------------- */
    /* Self-signup only reaches you if the applicant can write to the artifact.
       Anyone on a view-only link cannot, so the owner needs a way in that does
       not depend on the applicant's access at all. */
    h += '<div class="panel"><div class="panel-head"><h3>Add a producer directly</h3>'
      + '<span class="note">Creates the account approved and ready \u2014 no application needed</span></div>'
      + '<div class="panel-body"><form data-act="add-agent"><div class="grid g2">'
      + '<div class="field"><label for="na-name">Full name</label><input type="text" id="na-name" placeholder="Jordan Reyes" required></div>'
      + '<div class="field"><label for="na-email">Email</label><input type="email" id="na-email" placeholder="jordan@example.com" required></div>'
      + '<div class="field"><label for="na-pw">Starting password</label><input type="text" id="na-pw" placeholder="At least ' + PW_MIN + ' characters" required><span class="hint">Give it to them, and have them change it from their account page.</span></div>'
      + '<div class="field"><label for="na-level">Contract level</label><select id="na-level">' + agentLevelOptions(state.org.defaultLevel || "30") + "</select></div>"
      + "</div>"
      + '<div id="na-msg" style="margin-top:14px"></div>'
      + '<div class="row end" style="margin-top:14px"><button class="btn accent" type="submit">Create account</button></div>'
      + "</form></div></div>";

    /* --- how producers get in ------------------------------------------ */
    h += '<div class="panel"><div class="panel-head"><h3>How producers join</h3></div><div class="panel-body">'
      + '<p style="margin:0 0 10px;color:var(--muted);max-width:70ch;line-height:1.65">Send them this desk\u2019s link. They pick <strong style="color:var(--ink)">Create an account</strong> on the sign-in page, enter their name, email and a password, and land in the queue above. They cannot see any data until you approve them.</p>'
      + '<div class="codebox">' + esc(location.href.split("#")[0]) + "</div>"
      + '<div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="copy-link" data-link="' + esc(location.href.split("#")[0]) + '">Copy link</button>'
      + '<span class="hint">They need edit access to the artifact for their entries to save.</span></div>'
      + "</div></div>";
    return h;
  }

  /* ========================================================== NOTIFICATIONS */
  /** One row per policy whose draft date has come and gone with the deal
      still open. The status dropdown resolves it here — no round trip. */
  function notifRows(list, showAgent) {
    var t = todayISO();
    return list.map(function (d) {
      var c = CARRIER_BY_ID[d.carrierId], late = daysBetween(d.draftDate, t);
      var when = late === 0 ? '<span class="pill warn">Drafts today</span>'
        : late > 0 ? '<span class="pill bad">' + late + " day" + (late === 1 ? "" : "s") + " past</span>"
        : '<span class="pill">In ' + Math.abs(late) + " days</span>";
      return "<tr>"
        + '<td class="mono nowrap">' + esc(prettyDate(d.draftDate)) + "</td>"
        + '<td class="nowrap">' + when + "</td>"
        + (showAgent ? '<td class="who">' + esc((agentById(d.agentId) || {}).name || "\u2014") + "</td>" : "")
        + '<td class="who">' + esc(d.client || "\u2014") + "</td>"
        + "<td>" + esc(c ? c.name : d.carrierId) + '<div class="dim">' + esc(d.product || "") + "</div></td>"
        /* Chasing a carrier means quoting this number, so it belongs on
           the row you are chasing from rather than one click away. */
        + '<td class="mono nowrap">' + (d.policyNo ? esc(d.policyNo) : '<span class="dim">\u2014</span>') + "</td>"
        + '<td class="n">' + money(d.mp, 2) + "</td>"
        + '<td><select data-act="notif-status" data-id="' + esc(d.id) + '" style="min-width:170px">'
        + statusOptions(d.status) + "</select></td>"
        + '<td class="n"><button class="btn ghost sm" data-act="edit-deal" data-id="' + esc(d.id) + '">Open</button></td>'
        + "</tr>";
    }).join("");
  }

  function viewNotifications() {
    var owner = isOwner();
    var due = draftDue(), soon = draftDue(7);

    var h = '<div class="page-head"><div><p class="eyebrow">Draft dates</p><h2>Notifications</h2>'
      + '<p class="sub">A policy lands here the day the carrier is due to pull its first premium and stays until you say what happened \u2014 mark it issued &amp; paid, or record why it fell off.'
      + (owner ? " You are seeing the whole floor." : "") + "</p></div></div>";

    var head = "<tr><th>Draft date</th><th>Due</th>" + (owner ? "<th>Producer</th>" : "")
      + "<th>Client</th><th>Carrier &amp; product</th><th>Policy #</th>"
      + '<th class="n">Monthly</th><th>Status</th><th class="n"></th></tr>';

    h += '<div class="panel"><div class="panel-head"><h3>Needs a status</h3>'
      + '<span class="note">' + (due.length ? due.length + " polic" + (due.length === 1 ? "y" : "ies") + " past the draft date" : "All clear") + "</span></div>"
      + '<div class="panel-body flush">'
      + (due.length
        ? '<div class="tblwrap"><table class="data"><thead>' + head + "</thead><tbody>"
          + notifRows(due, owner) + "</tbody></table></div>"
        : emptyState("Nothing to chase", "Every policy past its draft date has a settled status."))
      + "</div></div>";

    h += '<div class="panel"><div class="panel-head"><h3>Coming up</h3>'
      + '<span class="note">Drafting in the next 7 days \u00b7 not counted in the badge</span></div>'
      + '<div class="panel-body flush">'
      + (soon.length
        ? '<div class="tblwrap"><table class="data"><thead>' + head + "</thead><tbody>"
          + notifRows(soon, owner) + "</tbody></table></div>"
        : emptyState("Nothing drafting this week", "Policies with a draft date in the next seven days land here."))
      + "</div></div>";
    return h;
  }

  /* ========================================================= COMMISSION GRID */
  /** Thrive's rate on every product it writes. The shipped schedule is the
      default; anything typed here overrides it for deals written from now on.
      A deal snapshots its rate when written, so editing never re-prices the
      book behind you. */
  function gridSection() {
    var cid = getUI("gridCarrier", "") || CARRIERS[0].id;
    if (!CARRIER_BY_ID[cid]) cid = CARRIERS[0].id;
    var carrier = CARRIER_BY_ID[cid];
    var prods = productsOf(cid);
    var setCount = 0;
    CARRIERS.forEach(function (c) {
      var ov = (state.grid || {})[c.id] || {};
      setCount += Object.keys(ov).filter(function (n) { return ov[n] != null && ov[n] !== ""; }).length;
    });

    var h = sectionHead("Carrier schedule", "Commission grid",
      "What each carrier pays Thrive on each product. Your own figure wins; anything you leave blank falls back to the schedule at Thrive’s "
      + state.org.houseLevel + "% contract. Deals snapshot the rate when they are written, so editing here never re-prices business already on the books.");

    h += '<div class="panel"><div class="panel-body"><div class="filters">'
      + '<div class="field" style="flex:1 1 320px;max-width:420px"><label for="g-carrier">Carrier</label>'
      + '<select id="g-carrier" data-act="gridcarrier">'
      + CARRIERS.map(function (c) {
          var ov = (state.grid || {})[c.id] || {};
          var n = Object.keys(ov).filter(function (k2) { return ov[k2] != null && ov[k2] !== ""; }).length;
          return '<option value="' + esc(c.id) + '"' + (c.id === cid ? " selected" : "") + ">" + esc(c.name)
            + " \u2014 " + productsOf(c.id).length + " product" + (productsOf(c.id).length === 1 ? "" : "s")
            + (n ? " \u00b7 " + n + " set" : "") + "</option>";
        }).join("")
      + '</select><span class="hint">' + setCount + " rate" + (setCount === 1 ? "" : "s") + " set by hand across all carriers.</span></div>"
      + "</div></div></div>";

    var body = prods.map(function (pr) {
      var sched = pr.rates ? gridRate(cid, pr.name, state.org.houseLevel) : null;
      var ov = overrideFor(cid, pr.name);
      return "<tr>"
        + '<td class="who">' + esc(pr.name)
        + (pr.custom ? ' <span class="pill key">Added</span>' : "") + "</td>"
        + '<td class="n dim">' + (sched == null ? "\u2014" : dec(sched, 1) + "%") + "</td>"
        + '<td class="n"><input type="number" min="0" step="0.5" style="width:104px;text-align:right" '
        + 'data-act="gridrate" data-carrier="' + esc(cid) + '" data-product="' + esc(pr.name) + '" '
        + 'value="' + (ov == null ? "" : esc(ov)) + '" placeholder="' + (sched == null ? "\u2014" : dec(sched, 1)) + '"></td>'
        + '<td class="n"' + (ov == null ? ' style="color:var(--muted);font-weight:400"' : ' style="font-weight:700"') + ">"
        + dec(houseRateFor(cid, pr.name) || 0, 1) + "%</td>"
        + '<td class="n">' + (ov == null
            ? '<span class="dim">Schedule</span>'
            : '<button class="linkbtn" data-act="gridclear" data-carrier="' + esc(cid) + '" data-product="' + esc(pr.name) + '">Reset</button>')
        + "</td></tr>";
    }).join("");

    h += '<div class="panel"><div class="panel-head"><h3>' + esc(carrier.name) + "</h3>"
      + '<span class="note">Type a rate to override the schedule \u00b7 clear it to fall back</span></div>'
      + '<div class="panel-body flush">'
      + (prods.length
        ? '<div class="tblwrap"><table class="data"><thead><tr><th>Product</th>'
          + '<th class="n">Schedule</th><th class="n">Your rate</th><th class="n">In use</th><th class="n"></th>'
          + "</tr></thead><tbody>" + body + "</tbody></table></div>"
        : emptyState("No products on file for " + carrier.name, "Add one below and set its rate."))
      + "</div></div>";

    h += '<div class="panel"><div class="panel-head"><h3>Add a product</h3>'
      + '<span class="note">For paper that is not on the shipped schedule</span></div><div class="panel-body">'
      + '<form data-act="add-product" data-carrier="' + esc(cid) + '"><div class="grid g2">'
      + '<div class="field"><label for="np-name">Product name</label><input type="text" id="np-name" placeholder="Final Expense \u2014 Level Benefit" required></div>'
      + '<div class="field"><label for="np-rate">Thrive\u2019s rate</label><input type="number" id="np-rate" min="0" step="0.5" placeholder="130" required><span class="hint">Percent of the advanced premium.</span></div>'
      + '</div><div class="row end" style="margin-top:14px"><button class="btn accent" type="submit">Add to ' + esc(carrier.name) + "</button></div></form>"
      + "</div></div>";
    return h;
  }

  /* ================================================================ ACCOUNT */
  /** Your own name, contract and password. Everyone gets this — a producer has
      no Settings tab, and rotating a password cannot be an owner-only act. */
  function viewAccount() {
    var m = me(), owner = isOwner();

    var h = '<div class="page-head"><div><p class="eyebrow">Your account</p><h2>' + esc(m.name) + "</h2>"

      + (owner ? "Owner at the agency\u2019s " : "Producer at ") + esc(m.level) + "% contract."
      + (owner ? "" : " Your name and contract level are set by Thrive.") + "</p></div></div>";

    h += '<div class="panel"><div class="panel-head"><h3>Change your password</h3>'
      + '<span class="note">You will stay signed in</span></div><div class="panel-body">'
      + '<form data-act="save-password"><div class="grid g2">'
      + '<div class="field"><label for="pw-old">Current password</label><input type="password" id="pw-old" autocomplete="current-password" required></div>'
      + '<div class="field"><label for="pw-new">New password</label><input type="password" id="pw-new" autocomplete="new-password" required><span class="hint">At least ' + PW_MIN + ' characters. Use one you use nowhere else.</span></div>'
      + '<div class="field"><label for="pw-new2">Confirm new password</label><input type="password" id="pw-new2" autocomplete="new-password" required></div>'
      + "</div>"
      + '<div id="pw-msg" style="margin-top:14px"></div>'
      + '<div class="row end" style="margin-top:14px"><button class="btn accent" type="submit">Change password</button></div>'
      + "</form></div></div>";

    h += '<div class="panel"><div class="panel-head"><h3>What a password here can and cannot do</h3></div><div class="panel-body">'
      + '<p style="margin:0;color:var(--muted);line-height:1.65;max-width:70ch">Your password is stored as a hash, so nobody can read it off this page. '
      + 'But this desk lives in a page your whole team can open, and a hash in a page can be attacked offline by anyone holding it. '
      + 'Pick something long and unique \u2014 above all, never a password you also use for email, a carrier portal, or banking.</p>'
      + "</div></div>";
    return h;
  }

  /** Export text on screen rather than as a file. A published artifact that
      declares the downloads capability cannot be shared at all, and a desk

  function exportBox() {
