<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lead Tech Marketplace</title>
<meta name="description" content="Every Lead Tech product for insurance agencies: inbound transfers, inbound calls, recruiting tools, the CRM and the Limitless Program.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: one page, many views. A centred hero, then a card grid; each
   product opens its own view (#transfers, #google ...) with pricing
   tiers, features and a closing call to action. Dark only, by design. */
:root{
  color-scheme: dark;
  --bg:#07090D; --panel:#11141B; --panel-2:#161A23; --line:#262B36; --line-2:#3A414F;
  --fg:#F4F6FA; --muted:#9AA3B2; --faint:#6B7383;
  --cyan:#22C3EE; --blue:#3B82F6; --teal:#14B8A6; --green:#22C58B; --gold:#EAB308; --rose:#F43F5E;
  --grad:linear-gradient(90deg,#22D3EE,#60A5FA 45%,#5EEAD4);
  --btn:linear-gradient(90deg,#06B6D4,#3B82F6);
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--fg); font-family:var(--font); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(900px 520px at 50% -10%, rgba(34,195,238,.10), transparent 65%),
    radial-gradient(700px 420px at 15% 0%, rgba(59,130,246,.08), transparent 60%);
}
a{color:inherit}
.wrap{max-width:960px; margin:0 auto; padding:0 16px 40px}

/* ------------------------------------------------------------ top bar */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 0 0}
.top img{height:18px; width:auto; display:block}
.top .brand{display:flex; align-items:center; gap:10px; text-decoration:none; font-weight:700; font-size:13px; color:var(--muted)}
.top .brand b{color:var(--fg); letter-spacing:.02em}
.navback{
  font:inherit; font-size:13px; font-weight:600; color:var(--muted); background:none; border:0; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; padding:6px 2px;
}
.navback:hover{color:var(--fg)}
.navback[hidden]{display:none}

/* --------------------------------------------------------------- hero */
.hero{text-align:center; padding:40px 0 6px}
.chip{
  display:inline-flex; align-items:center; gap:7px; border:1px solid rgba(34,195,238,.45); color:var(--cyan);
  border-radius:999px; padding:5px 13px; font-size:10.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  background:rgba(34,195,238,.06);
}
.chip::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
.chip.plain{border-color:var(--line-2); color:var(--muted); background:transparent}
.chip.plain::before{display:none}
.hero h1{font-size:clamp(30px,5.4vw,48px); line-height:1.02; letter-spacing:-.035em; font-weight:900; margin:20px 0 0; text-wrap:balance}
.hero h1 .g{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; display:inline-block; padding-bottom:.06em}
.hero p{color:var(--muted); max-width:54ch; margin:16px auto 0; font-size:14.5px}
.hero .ctas{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:26px}

.sechead{text-align:center; margin:60px 0 28px}
.sechead h2{font-size:clamp(21px,3.2vw,26px); letter-spacing:-.02em; font-weight:800; margin:14px 0 0}
.sechead p{color:var(--muted); font-size:13.5px; margin:8px auto 0; max-width:58ch}

/* -------------------------------------------------------------- cards */
.grid3{display:grid; gap:20px; grid-template-columns:repeat(3,minmax(0,1fr)); grid-auto-rows:1fr}
.grid3.center{display:flex; flex-wrap:wrap; justify-content:center}
.grid3.center > *{flex:0 1 calc((100% - 40px) / 3); min-width:0}
@media (max-width:900px){ .grid3{grid-template-columns:repeat(2,minmax(0,1fr))} .grid3.center > *{flex-basis:calc((100% - 20px) / 2)} }
@media (max-width:600px){ .grid3{grid-template-columns:minmax(0,1fr)} .grid3.center > *{flex-basis:100%} }

.card{
  position:relative; background:var(--panel); border:1px solid rgba(255,255,255,.28); border-radius:14px;
  padding:18px 18px 16px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:5px;
  transition:border-color .15s, transform .15s, background .15s; min-width:0;
}
a.card{text-decoration:none; color:inherit; cursor:pointer}
a.card:hover{border-color:var(--cyan); transform:translateY(-2px)}
a.card:focus-visible{outline:2px solid var(--cyan); outline-offset:3px}
.card.hot{border-color:rgba(34,195,238,.55); background:linear-gradient(180deg,rgba(34,195,238,.07),var(--panel) 55%)}
.card.crm{border-color:rgba(34,197,139,.5); background:linear-gradient(180deg,rgba(34,197,139,.08),var(--panel) 55%)}
.badge{
  position:absolute; top:-9px; left:18px; font-size:9.5px; font-weight:900; letter-spacing:.1em; text-transform:uppercase;
  border-radius:999px; padding:2px 9px; color:#04131A; background:var(--btn);
}
.badge.new{background:var(--teal); color:#03201C}
.badge.excl{background:var(--green); color:#032015}
.badge.mid{left:50%; transform:translateX(-50%)}
.ic{
  width:30px; height:30px; border-radius:8px; display:grid; place-items:center; margin-bottom:6px;
  background:rgba(34,195,238,.10); border:1px solid rgba(34,195,238,.35); color:var(--cyan);
}
.ic svg{width:15px; height:15px}
.ic.green{background:rgba(34,197,139,.10); border-color:rgba(34,197,139,.4); color:var(--green)}
.ic.blue{background:rgba(59,130,246,.12); border-color:rgba(59,130,246,.4); color:#7FB0FF}
.kicker{font-size:9px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}
.card h3{margin:2px 0 3px; font-size:16px; font-weight:800; letter-spacing:-.015em; line-height:1.2; text-wrap:balance}
.card p{margin:0; color:var(--muted); font-size:12.5px; line-height:1.55; max-width:34ch}
.card .more{margin-top:auto; padding-top:12px; font-size:12px; font-weight:700; color:var(--muted); display:inline-flex; gap:6px; align-items:center}
.card.hot .more{color:var(--cyan)}
.card.crm .more{color:var(--green)}
.card .sub{font-size:11px; font-weight:700; color:#7FB0FF}
.card .price{font-size:22px; font-weight:900; letter-spacing:-.02em; color:#7FB0FF; margin-top:4px}
.card .price small{font-size:12px; font-weight:600; color:var(--muted)}
.card .buf{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--fg);
  border:1px solid var(--line-2); border-radius:999px; padding:3px 10px; margin:4px 0 2px}
.card .buf svg{width:12px; height:12px; color:var(--cyan)}
.grid2{display:grid; gap:20px; grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-rows:1fr; max-width:700px; margin:0 auto}
@media (max-width:600px){ .grid2{grid-template-columns:minmax(0,1fr)} }
.sidebar{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin:0 0 24px}
.sidebar > span{font-size:10.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}
.sidebar > small{font-size:11.5px; color:var(--faint)}
.hero + .sidebar{margin:28px 0 0}
.sidebar .seg{margin:0}
.only{max-width:560px; margin:20px auto 0; border:1px solid rgba(234,179,8,.5); background:rgba(234,179,8,.10); color:#E9DDB4;
  border-radius:12px; padding:12px 16px; font-size:13.5px}
.only b{color:var(--gold)}
.onlytag{display:inline-block; margin:8px 0 0; font-size:10px; font-weight:900; letter-spacing:.1em; text-transform:uppercase;
  color:#231A00; background:var(--gold); border-radius:999px; padding:3px 10px}
/* ---------------------------------------------------- the Limitless page */
.lx-hero{position:relative; text-align:center; padding:52px 0 8px; isolation:isolate}
.lx-glow{position:absolute; z-index:-1; left:50%; top:-40px; width:min(760px,100%); height:420px; transform:translateX(-50%);
  background:radial-gradient(closest-side, rgba(234,179,8,.32), rgba(245,158,11,.10) 55%, transparent); filter:blur(10px);
  animation:lxpulse 5s ease-in-out infinite}
@keyframes lxpulse{0%,100%{opacity:.75; transform:translateX(-50%) scale(1)} 50%{opacity:1; transform:translateX(-50%) scale(1.06)}}
.lx-chip{color:var(--gold); border-color:rgba(234,179,8,.55); background:rgba(234,179,8,.08)}
.lx-hero h1{font-size:clamp(38px,7vw,68px); line-height:.98; letter-spacing:-.04em; font-weight:900; margin:20px 0 0}
.lx-g{background:linear-gradient(90deg,#FDE68A,#FACC15 30%,#F59E0B 60%,#FDE68A); background-size:200% auto; -webkit-background-clip:text; background-clip:text;
  color:transparent; animation:lxshine 4s linear infinite}
@keyframes lxshine{to{background-position:200% center}}
.lx-hero p{color:#D6D2C2; max-width:58ch; margin:18px auto 0; font-size:15px}
.lx-hero .ctas{display:flex; justify-content:center; margin-top:24px}
.lx-stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-top:40px}
@media (max-width:700px){ .lx-stats{grid-template-columns:minmax(0,1fr)} }
.lx-stat{position:relative; text-align:center; border-radius:16px; padding:24px 18px; background:linear-gradient(180deg,rgba(234,179,8,.10),var(--panel) 70%);
  border:1px solid rgba(234,179,8,.45); box-shadow:0 18px 50px -24px rgba(234,179,8,.55); transition:transform .2s, border-color .2s}
.lx-stat:hover{transform:translateY(-3px); border-color:var(--gold)}
.lx-stat b{display:block; font-size:48px; line-height:1; font-weight:900; letter-spacing:-.04em;
  background:linear-gradient(180deg,#FEF3C7,#EAB308); -webkit-background-clip:text; background-clip:text; color:transparent}
.lx-stat span{display:block; margin-top:8px; font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--gold)}
.lx-stat p{margin:8px 0 0; font-size:13px; color:var(--muted)}
.lx-steps{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; counter-reset:none}
@media (max-width:860px){ .lx-steps{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:520px){ .lx-steps{grid-template-columns:minmax(0,1fr)} }
.lx-steps li{position:relative; background:var(--panel); border:1px solid rgba(255,255,255,.22); border-radius:14px; padding:18px}
.lx-steps .n{display:grid; place-items:center; width:30px; height:30px; border-radius:50%; font-weight:900; font-size:13px; color:#231A00;
  background:linear-gradient(135deg,#FDE68A,#EAB308); box-shadow:0 0 0 4px rgba(234,179,8,.15); margin-bottom:12px}
.lx-steps b{display:block; font-size:14.5px}
.lx-steps p{margin:4px 0 0; font-size:13px; color:var(--muted)}
.lx-table{max-width:720px; margin:0 auto; border:1px solid rgba(255,255,255,.22); border-radius:14px; overflow:hidden; background:var(--panel)}
.lx-table .r{display:grid; grid-template-columns:1.1fr 1fr 1.1fr; align-items:center}
.lx-table .r + .r{border-top:1px solid var(--line)}
.lx-table span{padding:13px 16px; font-size:13.5px; min-width:0}
.lx-table .r > span:first-child{color:var(--muted); font-weight:600}
.lx-table .r > span:nth-child(2){color:var(--faint)}
.lx-table .h span{font-size:10.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); padding-top:11px; padding-bottom:11px}
.lx-table .h span:last-child{color:var(--gold)}
.lx-table .win{display:flex; gap:8px; align-items:center; font-weight:800; color:var(--fg); background:rgba(234,179,8,.07); height:100%}
.lx-table .h span:last-child{background:rgba(234,179,8,.07)}
.lx-table .win svg{width:15px; height:15px; color:var(--gold); flex:none}
@media (max-width:520px){ .lx-table span{padding:11px 10px; font-size:12.5px} }
.lx-cta{box-shadow:0 0 90px -30px rgba(234,179,8,.6)}
@media (prefers-reduced-motion:reduce){ .lx-glow, .lx-g{animation:none} }
.walletnote{display:flex; gap:14px; align-items:center; max-width:640px; margin:24px auto 0; padding:14px 18px; border-radius:14px;
  border:1px solid rgba(34,195,238,.45); background:linear-gradient(180deg,rgba(34,195,238,.10),rgba(59,130,246,.04));
  box-shadow:0 10px 30px -14px rgba(34,195,238,.55); animation:pop .35s ease .15s both}
.walletnote .wi{width:34px; height:34px; flex:none; border-radius:10px; display:grid; place-items:center; background:var(--btn); color:#fff}
.walletnote .wi svg{width:17px; height:17px}
.walletnote b{font-size:14px}
.walletnote p{margin:2px 0 0; font-size:13px; color:var(--muted)}
@keyframes pop{from{opacity:0; transform:translateY(8px) scale(.98)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){ .walletnote{animation:none} }
.solo{display:grid; grid-template-columns:minmax(0,380px); justify-content:center}

/* ------------------------------------------------- the featured program */
.feature{
  margin:28px auto 0; max-width:640px; border:1px solid rgba(234,179,8,.5); border-radius:14px; padding:18px 20px; text-align:center;
  background:linear-gradient(180deg,rgba(234,179,8,.12),rgba(234,179,8,.03)); box-shadow:0 0 80px -20px rgba(234,179,8,.35);
  display:block; text-decoration:none; color:inherit; transition:border-color .15s;
}
.feature:hover{border-color:var(--gold)}
.feature .kicker{color:var(--gold)}
.feature h3{font-size:clamp(19px,2.8vw,22px); font-weight:900; letter-spacing:-.025em; margin:4px 0 4px}
.feature p{color:#D6D2C2; max-width:58ch; margin:0 auto; font-size:13.5px}
.feature .more{display:inline-flex; gap:6px; align-items:center; margin-top:10px; font-weight:800; font-size:12.5px; color:var(--gold)}

/* ----------------------------------------------------------- pricing */
.tiers{display:grid; gap:16px; grid-template-columns:repeat(3,minmax(0,1fr)); align-items:stretch}
.tiers.duo{grid-template-columns:repeat(2,minmax(0,360px)); justify-content:center}
@media (max-width:860px){ .tiers, .tiers.duo{grid-template-columns:minmax(0,1fr); max-width:420px; margin:0 auto} }
.tier{
  position:relative; background:var(--panel); border:1px solid var(--line-2); border-radius:14px; padding:22px;
  display:flex; flex-direction:column; gap:4px; min-width:0;
}
.tier.hot{border-color:rgba(34,195,238,.6); background:linear-gradient(180deg,rgba(34,195,238,.08),var(--panel) 60%); box-shadow:0 0 50px -18px rgba(34,195,238,.45)}
.tier.best{border-color:rgba(20,184,166,.6)}
.tier h3{margin:0; font-size:18px; font-weight:800}
.tier .tl{font-size:12.5px; color:var(--muted)}
.tier .tl.c{color:#7FB0FF; font-weight:700; font-size:11px}
.tier .amt{display:flex; align-items:baseline; gap:6px; margin-top:12px}
.tier .amt b{font-size:36px; font-weight:900; letter-spacing:-.03em}
.tier .amt b.c{color:#60A5FA}
.tier .amt b.t{color:#2DD4BF}
.tier .amt span{font-size:12.5px; color:var(--muted)}
.tier .per{
  display:inline-flex; align-self:flex-start; gap:6px; align-items:center; margin-top:4px; font-size:11px; color:var(--muted);
  border:1px solid var(--line-2); border-radius:999px; padding:2px 10px;
}
.tier ul{list-style:none; margin:16px 0 20px; padding:0; display:grid; gap:9px}
.tier li{display:grid; grid-template-columns:16px 1fr; gap:8px; font-size:13px; align-items:start}
.tier li svg{width:15px; height:15px; color:var(--cyan); margin-top:2px}
.tier .go{margin-top:auto}
.tiers.four{grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px}
.tiers.four .tier{padding:20px 18px}
.tiers.four .amt{flex-wrap:nowrap}
.tiers.four .amt b{font-size:30px}
.tiers.four .amt span{white-space:nowrap}
.badge{white-space:nowrap}
@media (max-width:960px){ .tiers.four{grid-template-columns:repeat(2,minmax(0,1fr)); max-width:none} }
@media (max-width:560px){ .tiers.four{grid-template-columns:minmax(0,1fr); max-width:420px} }
.tier.std{border-color:rgba(34,197,139,.6); box-shadow:0 0 40px -18px rgba(34,197,139,.5)}
.tier .meta2{display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--line-2); border-radius:10px; overflow:hidden; margin-top:12px}
.tier .meta2 div{padding:8px 10px; min-width:0}
.tier .meta2 div+div{border-left:1px solid var(--line-2)}
.tier .meta2 small{display:block; font-size:9.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.tier .meta2 b{font-size:14px}
.tier .meta2 .sv b{color:var(--green)}
.tier .perk{display:flex; gap:8px; align-items:center; margin-top:12px; font-size:12.5px; font-weight:700; color:var(--green);
  background:rgba(34,197,139,.10); border:1px solid rgba(34,197,139,.3); border-radius:9px; padding:7px 10px}
.tier .perk svg{width:14px; height:14px; flex:none}
.seg{display:flex; width:max-content; max-width:100%; margin:0 auto 18px; gap:4px; padding:4px; background:var(--panel); border:1px solid var(--line-2); border-radius:12px}
.seg button{font:inherit; font-size:13px; font-weight:700; border:0; border-radius:9px; padding:8px 16px; background:none; color:var(--muted); cursor:pointer}
.seg button[aria-selected="true"]{background:#1C212B; color:var(--fg); box-shadow:inset 0 0 0 1px var(--line-2)}
.payg{display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; border:1px solid rgba(34,195,238,.3); border-radius:14px;
  padding:16px 20px; margin-bottom:18px; background:linear-gradient(180deg,rgba(34,195,238,.07),rgba(59,130,246,.03))}
.payg .kicker{color:var(--cyan)}
.payg b.t{display:block; font-size:16px; margin-top:2px}
.payg p{margin:2px 0 0; font-size:12.5px; color:var(--muted); max-width:60ch}
.payg .amt{font-size:30px; font-weight:900; letter-spacing:-.03em}
.payg .amt span{font-size:12px; font-weight:600; color:var(--muted); margin-left:6px; letter-spacing:0}
.note{border:1px solid rgba(234,179,8,.45); background:rgba(234,179,8,.08); color:#E9DDB4; border-radius:12px; padding:12px 16px; font-size:13px; margin-bottom:18px}
.note b{color:var(--gold)}

.btn{
  font:inherit; font-size:13.5px; font-weight:700; cursor:pointer; text-decoration:none; border-radius:9px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 18px;
  border:1px solid var(--line-2); background:#1C212B; color:var(--fg);
}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--btn); border-color:transparent; color:#fff; box-shadow:0 8px 24px -10px rgba(34,195,238,.7)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.teal{background:linear-gradient(90deg,#14B8A6,#0E8FA8); border-color:transparent; color:#fff}
.btn.gold{background:linear-gradient(90deg,#FACC15,#EAB308); border-color:transparent; color:#231A00}
.btn.wide{width:100%}
.btn.off{opacity:.6; cursor:default; pointer-events:none}
.btn svg{width:15px; height:15px}
.btn:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}
.fine{font-size:12px; color:var(--faint); text-align:center; max-width:70ch; margin:20px auto 0}
.fine a{color:var(--cyan); font-weight:700; text-decoration:none}

/* --------------------------------------------------------- features */
.feats{display:grid; gap:14px; grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:860px){ .feats{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .feats{grid-template-columns:minmax(0,1fr)} }
.feat{background:var(--panel); border:1px solid var(--line-2); border-radius:12px; padding:18px; min-width:0}
.feat .ic{margin:0 0 12px}
.feats.teal .ic{background:rgba(20,184,166,.10); border-color:rgba(20,184,166,.4); color:#2DD4BF}
.tier.best li svg{color:#2DD4BF}
.tier.best.glow{background:linear-gradient(180deg,rgba(20,184,166,.08),var(--panel) 60%); box-shadow:0 0 50px -18px rgba(20,184,166,.45)}
.cta.teal{border-color:rgba(20,184,166,.3); background:linear-gradient(180deg,rgba(20,184,166,.07),rgba(20,184,166,.02))}
.feat b{display:block; font-size:14.5px; margin-bottom:4px}
.feat p{margin:0; font-size:13px; color:var(--muted)}

.cta{
  margin:64px auto 0; max-width:620px; text-align:center; border:1px solid rgba(34,195,238,.3); border-radius:16px;
  padding:34px 22px; background:linear-gradient(180deg,rgba(34,195,238,.07),rgba(59,130,246,.03));
}
.cta.gold{border-color:rgba(234,179,8,.45); background:linear-gradient(180deg,rgba(234,179,8,.10),rgba(234,179,8,.02))}
.cta h2{margin:0; font-size:clamp(22px,3.2vw,28px); font-weight:800; letter-spacing:-.02em}
.cta p{color:var(--muted); font-size:14px; margin:10px auto 0; max-width:52ch}
.cta .ctas{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:22px}

.bigcta{
  margin-top:22px; border:1px solid rgba(34,195,238,.35); border-radius:16px; padding:30px 22px; text-align:center;
  background:linear-gradient(180deg,rgba(34,195,238,.08),rgba(34,195,238,.02));
}
.bigcta .ic{margin:0 auto 12px; width:40px; height:40px}
.bigcta h3{margin:0; font-size:22px; font-weight:800}
.bigcta p{color:var(--muted); font-size:13.5px; margin:8px auto 18px; max-width:52ch}

.list{list-style:none; margin:0 auto; padding:0; display:grid; gap:10px; max-width:560px}
.list li{display:grid; grid-template-columns:18px 1fr; gap:10px; background:var(--panel); border:1px solid var(--line-2); border-radius:10px; padding:12px 14px; font-size:14px}
.list li svg{width:16px; height:16px; color:var(--cyan); margin-top:2px}
.list.gold li svg{color:var(--gold)}

footer{border-top:1px solid var(--line); margin-top:70px; padding:22px 16px 30px; color:var(--faint); font-size:12px}
footer .in{max-width:960px; margin:0 auto; display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; align-items:center}
footer img{height:16px; width:auto; opacity:.85}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:.0; transform:translateY(4px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){ .view{animation:none} a.card, .card{transition:none} }

  /* ------------------------------------------------------------- router */
  var $ = function (q) { return document.querySelector(q); };
  function render() {
    var id = (location.hash || "").replace(/^#\/?/, "") || "home";
    if (!VIEWS[id]) id = "home";
    var sw = '<div class="sidebar"><span>Pricing for</span><div class="seg" role="tablist" aria-label="Pricing for">' +
      SIDES.map(function (x) {
        return '<button type="button" role="tab" data-side="' + x.id + '" aria-selected="' + (x.id === side) + '">' + esc(x.label) + "</button>";
      }).join("") + "</div><small>" + (side === "leadtech" ? "External pricing" : "Internal pricing") + "</small></div>";
    /* The switch sits under the first section heading on the page (on the
       home page, "Choose Your Solution"), or under the hero if there is none. */
    var html = VIEWS[id](), at = html.indexOf('<div class="sechead">');
    at = at < 0 ? html.indexOf("</section>") + 10 : html.indexOf("</div>", html.indexOf("</h2>", at)) + 6;
    if (id !== "limitless") html = at > 9 ? html.slice(0, at) + sw + html.slice(at) : sw + html;
    $("#view").innerHTML = '<div class="view">' + html + "</div>";
    $("#navback").hidden = id === "home";
    var p = PRODUCTS.filter(function (x) { return x.id === id; })[0];
    document.title = id === "home" ? "Lead Tech Marketplace"
      : (p ? p.name : { google: "Google Inbound Tiers", meta: "Meta Inbounds", tv: "TV Inbounds" }[id] || "The Limitless Program") + " · Lead Tech Marketplace";
  }
  document.addEventListener("click", function (ev) {
    var sb = ev.target.closest("[data-side]");
    if (sb) {
      side = sb.getAttribute("data-side");
      try { localStorage.setItem("mkSide", side); } catch (e) {}
      render(); return;
    }
    var a = ev.target.closest("[data-go],[data-scrolltop]");
    if (!a) return;
    ev.preventDefault();
    if (a.hasAttribute("data-scrolltop")) { var t = document.querySelector(".tiers"); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    var id = a.getAttribute("data-go");
    try { history.pushState(null, "", id === "home" ? location.pathname + location.search : "#" + id); } catch (e) { location.hash = id; }
    render();
    window.scrollTo(0, 0);
  });
  window.addEventListener("popstate", render);
  window.addEventListener("hashchange", render);
