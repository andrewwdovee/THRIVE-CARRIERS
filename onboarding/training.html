<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Training calendar</title>
<meta name="description" content="Every company training and team huddle, what time and who leads it. All times Eastern.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme: dark;
  --ink:#07090E; --panel:#1A2130; --panel-2:#222B3C; --cell:#161D2B;
  --line:#2E394B; --line-2:#667998; --fg:#F0F4F9; --muted:#A3B4C8;
  --gold:#F0B429; --gold-hi:#FFE08A;
  /* The session colours.
     Every chip carries dark ink: white on the amber reads at 1.9:1,
     which is not a contrast you can put small bold type on. */
  --s-blue:#3B82F6; --s-amber:#F0B429; --s-green:#13B981;
  --s-violet:#8B5CF6; --s-rose:#F43F5E; --chip-ink:#140F02;
  --display:'Anton','Arial Narrow',sans-serif;
  --body:'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink); color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.6}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(1100px 620px at 78% -8%, rgba(240,180,41,.13), transparent 62%),
    radial-gradient(900px 520px at 6% 4%, rgba(47,111,224,.10), transparent 58%);
}
.wrap{max-width:1280px; margin:0 auto; padding:0 16px 90px}

.masthead{padding:40px 0 10px; text-align:center}
.marks{display:flex; align-items:center; justify-content:center; gap:19px; margin:0 0 22px}
.marks img.thrive{height:64px; width:auto}
.marks img.lead{height:14px; width:auto}
.marks .by{display:flex; align-items:center; gap:9px; padding-left:19px; border-left:1px solid var(--line-2)}
.marks .by span{
  font-size:8px; font-weight:700; letter-spacing:.26em;
  text-transform:uppercase; color:var(--muted); white-space:nowrap;
}
.masthead h1{
  font-family:var(--display); font-weight:400; margin:0;
  font-size:clamp(32px,7.4vw,52px); line-height:1.06; letter-spacing:.012em;
  background:linear-gradient(180deg,#FFFFFF 6%,#DCE3EC 58%,#9BA7B6 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.rule{
  display:flex; align-items:center; gap:14px; margin:16px auto 0; max-width:440px;
  color:var(--gold); font-size:10.5px; font-weight:700; letter-spacing:.26em;
}
.rule::before,.rule::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(240,180,41,.55))}
.rule::after{background:linear-gradient(90deg,rgba(240,180,41,.55),transparent)}
.lede{color:var(--muted); max-width:52ch; margin:16px auto 0; font-size:14.5px}

/* ----------------------------------------------------------- legend */
.legend{
  display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  background:var(--panel); border:1px solid var(--line); border-radius:15px;
  padding:17px 19px; margin:26px 0 0;
}
.legend div{display:flex; gap:10px; align-items:flex-start; min-width:0}
.legend .dot{width:11px; height:11px; border-radius:50%; flex:none; margin-top:5px}
.legend b{display:block; font-size:13px; font-weight:700}
.legend small{display:block; font-size:12px; color:var(--muted)}

/* -------------------------------------------------------- the week */
.sectionhead{
  display:flex; align-items:baseline; justify-content:space-between;
  gap:14px; flex-wrap:wrap; margin:30px 0 12px;
}
.sectionhead h2{font-family:var(--display); font-weight:400; font-size:25px; margin:0; letter-spacing:.01em}
.sectionhead p{margin:0; font-size:12.5px; color:var(--muted)}

.week{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.daycard{background:var(--panel); border:1px solid var(--line); border-radius:15px; overflow:hidden}
.daycard > h3{
  margin:0; padding:12px 16px; border-bottom:1px solid var(--line);
  font-size:12px; font-weight:800; letter-spacing:.17em; text-transform:uppercase; color:var(--gold);
}
.daycard.today > h3{background:rgba(240,180,41,.12)}
.daycard ul{list-style:none; margin:0; padding:10px 12px; display:grid; gap:8px}

/* A session on a day card. */
.sess{
  display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:center;
  border:1px solid var(--line-2); border-radius:10px; padding:7px 9px;
  background:var(--cell); min-width:0;
}
.sess .t{
  font-size:11.5px; font-weight:800; border-radius:6px; padding:3px 7px;
  color:var(--chip-ink); white-space:nowrap; flex:none;
}
.sess .n{min-width:0}
.sess .n b{display:block; font-size:12.5px; font-weight:700; line-height:1.3; overflow-wrap:anywhere}
.sess .n small{display:block; font-size:11px; color:var(--muted); line-height:1.35}
.sess .n i{display:block; font-style:normal; font-size:10.5px; color:var(--muted); opacity:.8; line-height:1.35}
.sess.blue{border-color:rgba(59,130,246,.45)}   .sess.blue .t{background:var(--s-blue)}
.sess.amber{border-color:rgba(240,180,41,.45)}  .sess.amber .t{background:var(--s-amber)}
.sess.green{border-color:rgba(19,185,129,.45)}  .sess.green .t{background:var(--s-green)}
.sess.violet{border-color:rgba(139,92,246,.45)} .sess.violet .t{background:var(--s-violet)}
.sess.rose{border-color:rgba(244,63,94,.45)}    .sess.rose .t{background:var(--s-rose)}

footer{text-align:center; color:var(--muted); font-size:11.5px; padding:28px 16px 10px}
@media (max-width:560px){ .marks{gap:14px} .marks img.thrive{height:56px} .marks .by{padding-left:14px} }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="marks">
      <img class="thrive" id="mk-thrive" alt="Thrive Companies">
      <span class="by"><span>Powered by</span><img class="lead" id="mk-lead" alt="Lead Tech"></span>
    </div>
    <h1>Training calendar</h1>
    <p class="rule">ALL TIMES EASTERN</p>
    <p class="lede">
      The same every week. Nothing here is optional reading — the people who show up
      close at a different rate than the people who do not.
    </p>
  </header>

  <div class="legend" id="legend"></div>

  <div class="sectionhead">
    <h2>Every week</h2>
    <p>Monday to Friday. Nothing scheduled at the weekend.</p>
  </div>
  <div class="week" id="week"></div>
  <footer><span data-entity>Thrive Companies</span> &middot; Lead Tech inbound</footer>
</div>

<script>
(function () {
  "use strict";

  var ENTITY = "Thrive Companies LLC";
  var LOGOS = {};

  /* ------------------------------------------------------ the schedule
     The same every week. Edit here and the page follows.
     tone: which colour.  lead: who runs it.  topics: what it covers. */
  var TYPES = [
    { tone: "amber",  time: "9:30 AM", title: "Company Training", where: "Monday \u00b7 company-wide" },
    { tone: "blue",   time: "9:30 AM", title: "Team Huddle", where: "Tuesday to Friday \u00b7 with your team" },
    { tone: "violet", time: "6:30 PM", title: "Company Training", where: "Tuesday to Friday \u00b7 company-wide" }
  ];
  var MORNING = TYPES[0], HUDDLE = TYPES[1], EVENING = TYPES[2];
  function s(type, title, lead, topics) {
    return { tone: type.tone, time: type.time, title: title || type.title, lead: lead || "", topics: topics || "" };
  }
  var CLOSE = "Real Calls \u2022 Objections \u2022 Closing";

  /* index 0 = Sunday, to match Date#getDay */
  var WEEK = [
    [],                                                                          /* Sun */
    [s(MORNING, "Win the Week", "Thrive Companies", "Positivity \u2022 Recognition \u2022 Standards")],
    [s(HUDDLE), s(EVENING, "Sales Lab", "Michael", CLOSE)],                     /* Tue */
    [s(HUDDLE), s(EVENING, "Recruit Like a Pro", "Tristan", "Content \u2022 DMs \u2022 Recruiting")],
    [s(HUDDLE), s(EVENING, "Sales Lab", "Oscar", CLOSE)],                       /* Thu */
    [s(HUDDLE), s(EVENING, "Cash Flow Friday", "Joey Rodas", "Pending Money \u2022 Final Push")],
    []                                                                           /* Sat */
  ];
  var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

  var $ = function (q) { return document.querySelector(q); };
  Array.prototype.slice.call(document.querySelectorAll("[data-entity]"))
    .forEach(function (el) { el.textContent = ENTITY; });
  [["mk-thrive", "thriveV"], ["mk-lead", "leadWhite"]].forEach(function (p) {
    var el = $("#" + p[0]);
    if (el && LOGOS[p[1]]) el.src = LOGOS[p[1]];
    else if (el) el.remove();
  });

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function sessHtml(x) {
    return '<div class="sess ' + x.tone + '">' +
      '<span class="t">' + esc(x.time) + "</span>" +
      '<span class="n"><b>' + esc(x.title) + "</b>" +
      (x.lead ? "<small>Led by " + esc(x.lead) + "</small>" : "") +
      (x.topics ? "<i>" + esc(x.topics) + "</i>" : "") +
      "</span></div>";
  }

  /* ------------------------------------------------------------ legend */
  $("#legend").innerHTML = TYPES.map(function (t) {
    return '<div><span class="dot" style="background:var(--s-' + t.tone + ')"></span>' +
      "<span><b>" + esc(t.time) + " &middot; " + esc(t.title) + "</b>" +
      "<small>" + esc(t.where) + "</small></span></div>";
  }).join("");

  /* -------------------------------------------------------- the week */
  var todayDow = new Date().getDay();
  $("#week").innerHTML = [1, 2, 3, 4, 5].map(function (d) {
    return '<section class="daycard' + (d === todayDow ? " today" : "") + '">' +
      "<h3>" + esc(DAYS[d]) + (d === todayDow ? " &middot; today" : "") + "</h3>" +
      "<ul>" + WEEK[d].map(function (x) { return "<li>" + sessHtml(x) + "</li>"; }).join("") + "</ul>" +
      "</section>";
  }).join("");

})();
</script>
</body>
</html>
