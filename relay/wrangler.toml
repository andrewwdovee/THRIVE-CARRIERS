name = "stripe-sync"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
# Comma-separated list of browser origins allowed to call this Worker.
# Use "*" only while developing locally.
ALLOWED_ORIGINS = "*"

# Uncomment after `npx wrangler kv namespace create BOARD` and paste the id it
# prints. Only needed if you want every browser to share one board.
# [[kv_namespaces]]
# binding = "BOARD"
# id = "paste-the-id-here"

# Secrets are NOT set here — they'd end up in git. Set them with:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put SYNC_TOKEN
