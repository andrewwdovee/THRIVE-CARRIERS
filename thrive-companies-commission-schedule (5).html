.wordmark p { margin: 7px 0 0; font-size: 12px; letter-spacing: .04em; color: #9FB4CE; }
.head-meta { display: flex; gap: 26px; }
.head-meta div { text-align: right; }
.head-meta .eyebrow { color: #7C93AE; }
.head-meta strong { display: block; font-size: 17px; font-weight: 600; margin-top: 2px; }

/* ---------- level selector strip ---------- */
.tc-strip { background: var(--navy); color: #fff; border-top: 1px solid rgba(255,255,255,.09); }
.tc-strip-in { max-width: 1280px; margin: 0 auto; padding: 18px 24px 20px; }
.strip-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.strip-top .eyebrow { color: #8FA7C4; }
.strip-top .hint { font-size: 12px; color: #7C93AE; }
.rungs { display: flex; flex-wrap: wrap; gap: 6px; }
.rung {
  font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 500;
  padding: 7px 12px; border: 1px solid rgba(255,255,255,.16); color: #C8D8EC;
  background: rgba(255,255,255,.03); transition: background .12s, color .12s, border-color .12s;
}
.rung:hover { background: rgba(255,255,255,.11); color: #fff; }
.rung[aria-pressed="true"] { background: var(--sky); border-color: var(--sky); color: #04101F; font-weight: 600; }

/* ---------- page nav ---------- */
.tc-nav { background: var(--navy-2); border-top: 1px solid rgba(255,255,255,.08); }
.tc-nav-in {
  max-width: 1280px; margin: 0 auto; padding: 0 24px;
  display: grid; grid-template-columns: 1fr 1fr;
}
.tab {
  padding: 15px 16px 12px; text-align: center; width: 100%;
  font-size: 12.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: #93A9C6; background: rgba(255,255,255,.035);
  border-bottom: 3px solid rgba(255,255,255,.10);
  border-right: 1px solid rgba(7,26,49,.9);
  transition: background .14s, color .14s, border-color .14s;
}
.tab:last-child { border-right: 0; }
.tab:hover { background: rgba(255,255,255,.10); color: #fff; }
.tab[aria-pressed="true"] {
  color: #fff; background: rgba(76,141,246,.17); border-bottom-color: var(--sky);
}
.tab .dot {
  display: inline-block; width: 5px; height: 5px; margin-right: 9px;
  background: currentColor; opacity: .35; vertical-align: middle;
  transition: opacity .14s;
}
.tab[aria-pressed="true"] .dot { opacity: 1; background: var(--sky); }
@media (max-width: 520px) {
  .tc-nav-in { padding: 0; }
  .tab { font-size: 10.5px; letter-spacing: .05em; padding: 13px 8px 10px; }
  .tab .dot { display: none; }
}

/* ---------- promotional guidelines ---------- */
.promo { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 46px; }
@media (max-width: 900px) { .promo { grid-template-columns: 1fr; gap: 8px; } }

.plevel {
  display: grid; grid-template-columns: 84px 122px minmax(0, 1fr); align-items: center; gap: 16px;
  padding: 12px 14px; border-bottom: 1px solid var(--line); border-left: 3px solid transparent;
}
.plevel:first-of-type { border-top: 1px solid var(--line); }
.plevel .lv { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.plevel .ap { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; }
.plevel .req { font-size: 11px; color: var(--muted); line-height: 1.4; }
.plevel.on { background: #EDF4FF; border-left-color: var(--sky); }
.plevel.gold .lv, .plevel.gold .ap { color: #9A6F14; }
.plevel.gold { background: #FDF8EC; }
.plevel.two { grid-template-columns: 84px minmax(0, 1fr); }

.rules { list-style: none; margin: 0; padding: 0; }
.rules li {
  position: relative; padding: 13px 0 13px 28px; border-bottom: 1px solid var(--line);
  font-size: 13px; line-height: 1.5;
}
.rules li:first-child { border-top: 1px solid var(--line); }
.rules li::before {
  content: ""; position: absolute; left: 0; top: 21px; width: 14px; height: 1px; background: var(--navy-3);
}


/* ---------- toolbar ---------- */
.tc-tools { border-bottom: 1px solid var(--line); background: var(--paper); position: sticky; top: 0; z-index: 20; }
.tc-tools-in {
  max-width: 1280px; margin: 0 auto; padding: 12px 24px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.seg { display: flex; border: 1px solid var(--line); }
.seg button { padding: 9px 15px; font-size: 12.5px; font-weight: 600; letter-spacing: .03em; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.count { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* ---------- sections + cards ---------- */
.wrap { max-width: 1280px; margin: 0 auto; padding: 22px 24px 64px; }
.section-hd { display: flex; align-items: center; gap: 14px; margin: 38px 0 12px; }
.section-hd:first-child { margin-top: 0; }
.section-hd hr { flex: 1; border: 0; border-top: 1px solid var(--line); }
.section-hd .note { font-size: 11.5px; color: var(--muted); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(234px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.card { background: var(--paper); padding: 0 16px 14px; text-align: left; display: block; width: 100%; position: relative; transition: background .12s; }
.card:hover { background: var(--mist); }
.card::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--navy);
  transform: scaleX(0); transform-origin: left; transition: transform .18s ease; z-index: 2;
}
.card:hover::before, .card:focus-visible::before { transform: scaleX(1); }

.plate {
  height: 62px; margin: 0 -16px 13px; padding: 10px 14px; background: #fff;
  border-bottom: 1px solid var(--line); display: grid; place-items: center;
}
.plate img { max-height: 36px; max-width: 100%; width: auto; object-fit: contain; display: block; }
.mark {
  width: 32px; height: 32px; background: var(--navy); color: #fff;
  display: grid; place-items: center; font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; font-weight: 600; letter-spacing: .04em;
}
.card-name {
  font-size: 13.5px; font-weight: 700; line-height: 1.18; height: 32px; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.card-prod {
  font-size: 11px; color: var(--muted); margin-top: 3px; letter-spacing: .02em;
  height: 14px; line-height: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.card-rate { display: flex; align-items: baseline; gap: 2px; margin-top: 12px; }
.card-rate .n { font-family: 'IBM Plex Mono', monospace; font-size: 31px; font-weight: 500; letter-spacing: -.02em; }
.card-rate .s { font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: var(--muted); }
.card-foot {
  margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  font-size: 11px; color: var(--muted);
}
.up { color: var(--navy-3); font-weight: 600; font-family: 'IBM Plex Mono', monospace; }

.card.pending { background: #FAFBFD; cursor: default; }
.card.pending:hover { background: #FAFBFD; }
.card.pending:hover::before { transform: scaleX(0); }
.card.pending .plate { background: #FAFBFD; }
.card.pending .mark { background: #B4BECB; }
.card.pending .plate img { filter: grayscale(1); opacity: .45; }
.card.pending .card-rate .n, .card.pending .card-rate .s { color: #B9C3CF; }
.card.pending .card-prod { font-style: italic; }

.card.gated .card-rate .n { color: #98A4B2; }
.lock-note { color: var(--navy-3); font-weight: 600; }
.rowl.locked .lv, .rowl.locked .val { color: #A9B3C0; }
.rowl .norail {
  font-size: 11px; color: #A9B3C0; letter-spacing: .02em;
}
.gate-note {
  margin: 14px 0 0; padding: 10px 12px; background: var(--mist);
  font-size: 11.5px; line-height: 1.45; color: var(--muted);
  border-left: 2px solid var(--navy-3);
}

/* ---------- product list inside the drawer ---------- */
.prodlist { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
.prodlist .eyebrow { display: block; margin-bottom: 10px; }
.pl-item {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; text-align: left; padding: 11px 12px; margin-bottom: 6px;
  border: 1px solid var(--line); background: var(--paper);
  transition: background .12s, border-color .12s;
}
.pl-item:hover { background: var(--mist); border-color: #C3CEDC; }
.pl-item.on { border-color: var(--navy); background: #EDF4FF; }
.pl-name { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
.pl-item.on .pl-name { color: var(--navy-2); }
.pl-rate {
  font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.pl-soon { font-size: 10.5px; color: var(--muted); white-space: nowrap; letter-spacing: .02em; }

/* ---------- clickable grid headers ---------- */
.mx-h[data-card], .mx-h[data-promo] { cursor: pointer; }
.mx-h[data-card]:hover, .mx-h[data-promo]:hover { background: #0E2846; }
.mx-h[data-card]:hover .cname, .mx-h[data-promo]:hover .cname { color: var(--sky); }

/* ---------- production requirements inside the drawer ---------- */
.preq {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
  padding: 10px 0; border-bottom: 1px solid var(--line);
}
.preq .lv { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); padding-top: 2px; }
.preq-r { text-align: right; }
.preq .amt {
  font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500;
  display: block; font-variant-numeric: tabular-nums;
}
.preq .pnote { display: block; font-size: 10.5px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
.preq.here { background: #EDF4FF; margin: 0 -22px; padding-left: 22px; padding-right: 22px; }
.preq.here .lv { color: #04101F; font-weight: 600; }
.preq.here .amt { font-size: 15px; font-weight: 600; }

/* ---------- full grid ----------
   One CSS grid. Header cells and value cells are siblings in the SAME
   grid container, so a column is a column — the header physically cannot
   drift out of line with the numbers under it.                        */
.gridscroll {
  overflow: auto; border: 1px solid var(--line); max-height: 78vh;
  -webkit-overflow-scrolling: touch;
}
.matrix { display: grid; }

.matrix > * { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }

/* every header cell */
.mx-h {
  background: var(--navy-2); color: #fff; padding: 10px 6px 9px;
  position: sticky; top: 0; z-index: 3;
  display: flex; flex-direction: column; align-items: center;
  border-bottom: 1px solid rgba(255,255,255,.14);
}
.mx-h .chip {
  height: 34px; width: 100%; flex: 0 0 34px; background: #fff; margin-bottom: 9px;
  display: grid; place-items: center; padding: 4px 7px;
}
.mx-h .chip img { max-height: 24px; max-width: 100%; width: auto; object-fit: contain; display: block; }
.mx-h .chip .mark { width: 26px; height: 26px; font-size: 10px; }
.mx-h .cname {
  height: 28px; flex: 0 0 28px; display: flex; align-items: center; justify-content: center;
  font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  line-height: 1.15; text-align: center; overflow: hidden; width: 100%;
}
.mx-h .p {
  height: 15px; flex: 0 0 15px; line-height: 15px; margin-top: 3px; max-width: 100%;
  font-size: 10px; color: #93AAC6; letter-spacing: .03em;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}

/* top-left corner: frozen both ways */
.mx-corner { grid-column: 1; left: 0; z-index: 5; }
/* the mark is already white, so it needs no plate behind it — just the slot */
.mx-corner .chip { background: transparent; padding: 0; }
.mx-corner .chip img { max-height: 26px; max-width: 104px; }

/* level cell: frozen left */
.mx-lvl {
  grid-column: 1; position: sticky; left: 0; z-index: 2;
  background: var(--paper); display: flex; align-items: center;
  padding: 0 14px; font-size: 12.5px; font-weight: 600; white-space: nowrap;
  box-shadow: 6px 0 10px -8px rgba(7,26,49,.28);
}
/* value cell */
.mx-v {
  height: 34px; display: grid; place-items: center;
  font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;
  font-size: 12.5px; background: var(--paper);
}
.mx-v.na { color: #C2CBD6; }
.mx-alt .mx-v, .mx-alt.mx-lvl { background: #FAFBFD; }
.mx-on.mx-lvl { background: var(--sky); color: #04101F; }
.mx-on.mx-v { background: #E4EEFD; font-weight: 600; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(7,20,44,.5); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--paper);
  z-index: 41; display: flex; flex-direction: column; box-shadow: -18px 0 44px rgba(7,20,44,.22);
  animation: slidein .22s cubic-bezier(.22,.8,.3,1);
}
@keyframes slidein { from { transform: translateX(24px); opacity: .4 } to { transform: none; opacity: 1 } }
.drawer-head { background: var(--navy-2); color: #fff; padding: 20px 22px 18px; }
.drawer-head .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.dplate { background: #fff; padding: 9px 14px; display: inline-grid; place-items: center; margin-bottom: 14px; }
.dplate img { max-height: 30px; max-width: 190px; width: auto; object-fit: contain; display: block; }
.drawer-head h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.drawer-head .prod { font-size: 12px; color: #9FB4CE; margin-top: 3px; letter-spacing: .05em; text-transform: uppercase; }
.x { color: #9FB4CE; font-size: 20px; line-height: 1; padding: 2px 6px; }
.x:hover { color: #fff; }
.yours { margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.13); display: flex; align-items: flex-end; justify-content: space-between; }
.yours .eyebrow { color: #7C93AE; }
.yours .big { font-family: 'IBM Plex Mono', monospace; font-size: 34px; font-weight: 500; letter-spacing: -.02em; margin-top: 2px; }
.yours .lvl-tag { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9FB4CE; padding-bottom: 8px; }

.ladder { flex: 1; overflow-y: auto; padding: 6px 22px 28px; }
.ladder-hd { display: flex; justify-content: space-between; padding: 14px 0 8px; border-bottom: 1px solid var(--line); }
.rowl { display: grid; grid-template-columns: 50px 1fr auto; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.rowl .lv { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }
.rowl .rail { height: 2px; background: var(--line); position: relative; }
.rowl .rail i { position: absolute; left: 0; top: -3px; height: 8px; width: 8px; background: var(--line); }
.rowl .val { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500; }
.rowl .gain { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--navy-3); margin-left: 8px; }
.rowl.above .lv { color: var(--ink); }
.rowl.here { background: #EDF4FF; margin: 0 -22px; padding-left: 22px; padding-right: 22px; }
.rowl.here .lv { color: #04101F; font-weight: 600; }
.rowl.here .rail, .rowl.here .rail i { background: var(--sky); }
.rowl.here .val { font-size: 15px; font-weight: 600; }
.rowl.below { opacity: .5; }

.foot { max-width: 1280px; margin: 0 auto; padding: 0 24px 40px; font-size: 11.5px; color: var(--muted); line-height: 1.6; }
.foot hr { border: 0; border-top: 1px solid var(--line); margin: 0 0 14px; }

@media (max-width: 620px) {
  .tc-head-in { align-items: flex-start; }
  .head-meta { gap: 18px; }
  .head-meta div { text-align: left; }
  .drawer { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .tc * { animation: none !important; transition: none !important; } }
@media print {
  .tc-tools, .tc-strip, .scrim, .drawer { display: none !important; }
  .gridscroll { overflow: visible; max-height: none; }
  .mx-h { position: static; background: #071A31 !important; -webkit-print-color-adjust: exact; }
  .mx-lvl { position: static; box-shadow: none; }
}
`;
/* ------------------------------------------------------------------ *
   Rendering — plain JavaScript, no framework, no build step.
   A carrier holds one or more products; each product has its own ladder.
 * ------------------------------------------------------------------ */

var LEVELS = LEVEL_KEYS.map(function (k) {
  return { key: k, label: BRAND + " " + k, short: k };
});
var idx = {};
LEVEL_KEYS.forEach(function (k, i) { idx[k] = i; });

var RAIL_MAX = 150;

function logoOf(c) { return LOGOS[c.carrier] || ""; }
function plain(n) { return n == null ? "\u2014" : n.toFixed(2); }
function pct(n) { return n == null ? "\u2014" : n.toFixed(2) + "%"; }
function money(n) { return n == null ? "\u2014" : "$" + n.toLocaleString("en-US"); }
function floorIdx(rates) {
  for (var i = rates.length - 1; i >= 0; i--) if (rates[i] != null) return i;
  return -1;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (m) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
  });
}
function priced(c) { return c.products.filter(function (p) { return p.rates; }); }
function pname(p) { return p.name || "Product to be confirmed"; }

/* Flat product columns for the full grid, in carrier order.
   The grid mirrors the original comp sheets, so products flagged
   `extra` (added later) are shown on the cards but not in the grid. */
var COLUMNS = [];
CARRIERS.forEach(function (c) {
  var cols = c.products.filter(function (p) { return !p.extra; });
  cols.forEach(function (p, i) {
    COLUMNS.push({ carrier: c, product: p, first: i === 0 });
  });
});
var ALL_PRODUCTS = [];
CARRIERS.forEach(function (c) {
  c.products.forEach(function (p) { ALL_PRODUCTS.push(p); });
});

var state = { page: "schedule", levelKey: "130", view: "cards", openId: null, prod: 0, promo: false };

/* ---------- card ---------- */

function cardHTML(c, here, nextUp) {
  var logo = logoOf(c);
  var ps = priced(c);
  var multi = c.products.length > 1;

  var vals = ps.map(function (p) { return p.rates[here]; })
               .filter(function (v) { return v != null; });

  var rateHTML, foot;

  if (!ps.length) {
    rateHTML = '<span class="n">\u2014</span>';
    foot = "<span>Comp not loaded yet</span>";
  } else if (!vals.length) {
    var fl = Math.min.apply(null, ps.map(function (p) { return floorIdx(p.rates); }));
    rateHTML = '<span class="n">\u2014</span>';
    foot = '<span class="lock-note">Requires ' + esc(LEVELS[fl].label) + "</span>" +
           "<span>View ladder \u2192</span>";
  } else {
    var hi = Math.max.apply(null, vals);
    rateHTML = '<span class="n">' + plain(hi) + '</span><span class="s">%</span>';
    if (multi) {
      foot = "<span>" + c.products.length + " products</span><span>View ladders \u2192</span>";
    } else {
      var up = nextUp && ps[0].rates[here - 1] != null
        ? ps[0].rates[here - 1] - vals[0] : null;
      foot = "<span>" + (up != null
        ? "at " + esc(nextUp.label) + ': <span class="up">+' + plain(up) + "</span>"
        : nextUp ? "Not available above" : "Top of grid") +
        "</span><span>View ladder \u2192</span>";
    }
  }

  var sub = multi
    ? c.products.length + " products"
    : esc(pname(c.products[0]));

  return (
    '<button class="card' + (ps.length ? "" : " pending") +
      (ps.length && !vals.length ? " gated" : "") + '"' +
      (ps.length ? ' data-card="' + c.id + '"' : " disabled") + ">" +
      '<span class="plate">' +
        (logo ? '<img src="' + logo + '" alt="' + esc(c.carrier) + '" />'
              : '<span class="mark">' + esc(c.mark) + "</span>") +
      "</span>" +
      '<span class="card-name">' + esc(c.carrier) + "</span>" +
      '<span class="card-prod">' + sub + "</span>" +
      '<span class="card-rate">' + rateHTML + "</span>" +
      '<span class="card-foot">' + foot + "</span>" +
    "</button>"
  );
}

function cardsHTML(list, here, nextUp) {
  return '<div class="cards">' +
    list.map(function (c) { return cardHTML(c, here, nextUp); }).join("") + "</div>";
}

/* ---------- full grid ---------- */

function matrixHTML(here) {
  var cols = "132px repeat(" + COLUMNS.length + ", 116px)";
  var h = '<div class="gridscroll"><div class="matrix" role="table" ' +
    'aria-label="Commission grid" style="grid-template-columns:' + cols + '">' +
    '<div class="mx-h mx-corner" data-promo="1" title="View promotional guidelines">' +
      '<span class="chip"><img src="' + THRIVE_LOGO + '" alt="' + esc(BRAND_FULL) + '" /></span>' +
      '<span class="cname">Level</span><span class="p">Contract</span></div>';

  COLUMNS.forEach(function (col) {
    var logo = logoOf(col.carrier);
    h += '<div class="mx-h" data-card="' + col.carrier.id + '">' +
      '<span class="chip">' +
        (col.first
          ? (logo ? '<img src="' + logo + '" alt="" />'
                  : '<span class="mark">' + esc(col.carrier.mark) + "</span>")
          : "") +
      "</span>" +
      '<span class="cname">' + (col.first ? esc(col.carrier.carrier) : "") + "</span>" +
      '<span class="p">' + esc(col.product.name || "TBC") + "</span></div>";
  });

  LEVELS.forEach(function (lv, i) {
    var on = lv.key === state.levelKey;
    var tone = on ? " mx-on" : i % 2 === 1 ? " mx-alt" : "";
    h += '<div class="mx-lvl' + tone + '" data-level="' + lv.key + '">' + esc(lv.label) + "</div>";
    COLUMNS.forEach(function (col) {
      var r = col.product.rates;
      var ok = r && r[i] != null;
      h += '<div class="mx-v' + tone + (ok ? "" : " na") + '" data-level="' + lv.key + '">' +
        (r ? plain(r[i]) : "\u2014") + "</div>";
    });
  });
  return h + "</div></div>";
}

/* ---------- promotional guidelines ---------- */

function promoHTML() {
  var h = '<div class="promo"><section>' +
    '<div class="section-hd"><span class="eyebrow">Builder levels</span><hr />' +
    '<span class="note">Annual hierarchy production</span></div>';
  BUILDER.forEach(function (b) {
    h += '<div class="plevel' + (b.lv === state.levelKey ? " on" : "") + '">' +
      '<span class="lv">' + esc(b.lv) + "%</span>" +
      '<span class="ap">' + money(b.ap) + "</span>" +
      '<span class="req">' + b.legs + " direct agents, each issuing $25k+ a month</span></div>";
  });
  h += '<div class="section-hd"><span class="eyebrow">Producer levels</span><hr />' +
       '<span class="note">Annual personal production</span></div>';
  PRODUCER.forEach(function (p) {
    h += '<div class="plevel two' + (p.lv === state.levelKey ? " on" : "") +
      (p.lead ? " gold" : "") + '">' +
      '<span class="lv">' + esc(p.lv) + "%</span>" +
      '<span class="ap">' + (p.ap == null ? esc(p.label) : money(p.ap)) + "</span></div>";
  });
  h += "</section><section>" +
    '<div class="section-hd"><span class="eyebrow">Requirements</span><hr /></div><ul class="rules">' +
    RULES.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") +
    "</ul></section></div>";
  return h;
}

/* ---------- drawer ---------- */

function ladderHTML(p, here) {
  if (!p.rates) {
    return '<p class="gate-note">Commission levels for ' + esc(pname(p)) +
           " haven\u2019t been loaded yet.</p>";
  }
  var mine = p.rates[here];
  var fl = floorIdx(p.rates);
  var rows = LEVELS.map(function (lv, i) {
    var v = p.rates[i];
    var cls = (i === here ? "here" : i < here ? "above" : "below") + (v == null ? " locked" : "");
    var bar = v == null
      ? '<span class="norail">Not available</span>'
      : '<span class="rail" style="width:' + Math.max(6, (v / RAIL_MAX) * 100) + '%"><i></i></span>';
    var gain = i < here && v != null && mine != null
      ? '<span class="gain">+' + plain(v - mine) + "</span>" : "";
    return '<div class="rowl ' + cls + '"><span class="lv">' + esc(lv.short) + "</span>" +
      bar + '<span style="white-space:nowrap"><span class="val">' + plain(v) + "</span>" +
      gain + "</span></div>";
  }).join("");
  var note = fl >= 0 && fl < LEVELS.length - 1
    ? '<p class="gate-note">Not available below ' + esc(LEVELS[fl].label) + ".</p>" : "";
  return '<div class="ladder-hd"><span class="eyebrow">Full ladder</span>' +
    '<span class="eyebrow">Gain vs. yours</span></div>' + rows + note;
}

function promoDrawerHTML(here) {
  var level = LEVELS[here];

  function row(lv, amount, note, isHere) {
    return '<div class="preq' + (isHere ? " here" : "") + '">' +
      '<span class="lv">' + esc(BRAND + " " + lv) + "</span>" +
      '<span class="preq-r"><span class="amt">' + amount + "</span>" +
      (note ? '<span class="pnote">' + esc(note) + "</span>" : "") + "</span></div>";
  }

  var builder = BUILDER.map(function (b) {
    return row(b.lv, money(b.ap),
      b.legs + " direct agents, each issuing $25k+ a month", b.lv === state.levelKey);
  }).join("");

  var producer = PRODUCER.map(function (p) {
    return row(p.lv, p.ap == null ? esc(p.label) : money(p.ap),
      p.ap == null ? "Starting level \u2014 no production requirement" : "",
      p.lv === state.levelKey);
  }).join("");

  var mine = null;
  BUILDER.forEach(function (b) { if (b.lv === state.levelKey) mine = money(b.ap); });
  PRODUCER.forEach(function (p) {
    if (p.lv === state.levelKey) mine = p.ap == null ? esc(p.label) : money(p.ap);
  });

  return '<div class="scrim" data-close="1"></div>' +
    '<aside class="drawer" role="dialog" aria-label="Promotional guidelines">' +
    '<div class="drawer-head">' +
      '<span class="dplate"><img src="' + THRIVE_LOGO + '" alt="' + esc(BRAND_FULL) + '" /></span>' +
      '<div class="row"><div><h2>Promotional guidelines</h2>' +
      '<div class="prod">Production required by level</div></div>' +
      '<button class="x" data-close="1" aria-label="Close">\u2715</button></div>' +
      '<div class="yours"><div><span class="eyebrow">To reach this level</span>' +
      '<div class="big">' + (mine || "\u2014") + "</div></div>" +
      '<div class="lvl-tag">' + esc(level.label) + "</div></div></div>" +
    '<div class="ladder">' +
      '<div class="ladder-hd"><span class="eyebrow">Builder levels</span>' +
      '<span class="eyebrow">Hierarchy production</span></div>' + builder +
      '<div class="ladder-hd"><span class="eyebrow">Producer levels</span>' +
      '<span class="eyebrow">Personal production</span></div>' + producer +
      '<p class="gate-note">Comp levels cannot be skipped. Hit the required production ' +
      'for one month and be in good standing with the carriers to advance.</p>' +
    "</div></aside>";
}

function drawerHTML(here) {
  var c = null;
  CARRIERS.forEach(function (x) { if (x.id === state.openId) c = x; });
  if (!c) return "";
  var pi = Math.min(state.prod, c.products.length - 1);
  var p = c.products[pi];
  var logo = logoOf(c);
  var mine = p.rates ? p.rates[here] : null;
  var level = LEVELS[here];

  var plist = "";
  {
    plist = '<div class="prodlist"><span class="eyebrow">Products \u00b7 ' +
      c.products.length + "</span>" +
      c.products.map(function (q, i) {
        var v = q.rates ? q.rates[here] : null;
        var tag = !q.rates ? '<span class="pl-soon">Rates to come</span>'
          : v == null ? '<span class="pl-soon">Not available</span>'
          : '<span class="pl-rate">' + plain(v) + "%</span>";
        return '<button class="pl-item' + (i === pi ? " on" : "") +
          '" data-prod="' + i + '"><span class="pl-name">' + esc(pname(q)) +
          "</span>" + tag + "</button>";
      }).join("") + "</div>";
  }

  return '<div class="scrim" data-close="1"></div>' +
    '<aside class="drawer" role="dialog" aria-label="' + esc(c.carrier) + ' commission ladder">' +
    '<div class="drawer-head">' +
      (logo ? '<span class="dplate"><img src="' + logo + '" alt="' + esc(c.carrier) + '" /></span>' : "") +
      '<div class="row"><div><h2>' + esc(c.carrier) + "</h2>" +
      '<div class="prod">' + esc(pname(p)) + "</div></div>" +
      '<button class="x" data-close="1" aria-label="Close">\u2715</button></div>' +
      '<div class="yours"><div><span class="eyebrow">' +
        (!p.rates ? "Rates to come" : mine == null ? "Not available" : "Your rate") + "</span>" +
      '<div class="big">' + pct(mine) + "</div></div>" +
      '<div class="lvl-tag">' + esc(level.label) + "</div></div></div>" +
    '<div class="ladder">' + ladderHTML(p, here) + plist + "</div></aside>";
}

/* ---------- page ---------- */

function render() {
  var here = idx[state.levelKey];
  var level = LEVELS[here];
  var nextUp = here > 0 ? LEVELS[here - 1] : null;

  var live = CARRIERS.filter(function (c) { return priced(c).length; });
  var pending = CARRIERS.filter(function (c) { return !priced(c).length; });
  var pricedCount = ALL_PRODUCTS.filter(function (p) { return p.rates; }).length;

  var h =
    '<header class="tc-head"><div class="tc-head-in">' +
      '<div class="wordmark"><span class="bar"></span><div class="lock">' +
      '<img src="' + THRIVE_LOGO + '" alt="' + esc(BRAND_FULL) + '" />' +
      "<p>Commission schedule</p></div></div>" +
      '<div class="head-meta">' +
        '<div><span class="eyebrow">Carriers</span><strong class="mono">' +
          CARRIERS.length + "</strong></div>" +
        '<div><span class="eyebrow">Products</span><strong class="mono">' +
          ALL_PRODUCTS.length + "</strong></div>" +
        '<div><span class="eyebrow">Levels</span><strong class="mono">80\u2013150</strong></div>' +
      "</div></div></header>" +

    '<nav class="tc-nav"><div class="tc-nav-in">' +
      '<button class="tab" data-page="schedule" aria-pressed="' +
        (state.page === "schedule") + '"><span class="dot"></span>Commission schedule</button>' +
      '<button class="tab" data-page="promo" aria-pressed="' +
        (state.page === "promo") + '"><span class="dot"></span>Promotional guidelines</button>' +
    "</div></nav>" +

    '<div class="tc-strip"><div class="tc-strip-in">' +
      '<div class="strip-top"><span class="eyebrow">Contract level</span>' +
      '<span class="hint">Pick a level to see what every carrier pays at it.</span></div>' +
      '<div class="rungs" role="group" aria-label="Contract level">' +
      LEVELS.map(function (lv) {
        return '<button class="rung mono" data-level="' + lv.key + '" aria-pressed="' +
          (lv.key === state.levelKey) + '">' + esc(lv.short) + "</button>";
      }).join("") +
    "</div></div></div>";

  if (state.page === "schedule") {
    h += '<div class="tc-tools"><div class="tc-tools-in">' +
      '<div class="seg" role="group" aria-label="View">' +
      '<button data-view="cards" aria-pressed="' + (state.view === "cards") + '">Cards</button>' +
      '<button data-view="grid" aria-pressed="' + (state.view === "grid") + '">Full grid</button>' +
      "</div>" +
      '<span class="count mono" style="margin-left:auto">' + esc(level.label) +
        " \u00b7 " + pricedCount + " of " + ALL_PRODUCTS.length + " products</span></div></div>";
  }

  h += '<main class="wrap">';
  if (state.page === "promo") {
    h += promoHTML();
  } else if (state.view === "cards") {
    if (live.length) {
      h += '<div class="section-hd"><span class="eyebrow">Contracted \u00b7 ' +
        live.length + "</span><hr /></div>" + cardsHTML(live, here, nextUp);
    }
    if (pending.length) {
      h += '<div class="section-hd"><span class="eyebrow">Awaiting comp \u00b7 ' +
        pending.length + '</span><hr /><span class="note">Grids not yet loaded</span></div>' +
        cardsHTML(pending, here, nextUp);
    }
  } else {
    h += matrixHTML(here);
  }
  h += "</main>";

  h += '<div class="foot"><hr />Percentages are first-year commission as a percent of target ' +
    "premium, per the " + esc(BRAND_FULL) + " comp grid. Carrier names and logos are the property " +
    "of their respective companies and are shown for identification only. Schedules are subject to " +
    "carrier change \u2014 confirm current rates before quoting.</div>";

  if (state.promo) h += promoDrawerHTML(here);
  else if (state.openId) h += drawerHTML(here);

  document.getElementById("app").innerHTML = h;
}

/* ---------- events ---------- */

document.addEventListener("click", function (e) {
  var t = e.target.closest(
    "[data-level],[data-page],[data-view],[data-card],[data-close],[data-prod],[data-promo]");
  if (!t) return;
  if (t.hasAttribute("data-close")) { state.openId = null; state.promo = false; render(); return; }
  if (t.hasAttribute("data-promo")) { state.promo = true; state.openId = null; render(); return; }
  if (t.hasAttribute("data-prod"))  { state.prod = +t.getAttribute("data-prod"); render(); return; }
  if (t.hasAttribute("data-card"))  { state.openId = t.getAttribute("data-card"); state.prod = 0; state.promo = false; render(); return; }
  if (t.hasAttribute("data-level")) { state.levelKey = t.getAttribute("data-level"); render(); return; }
  if (t.hasAttribute("data-page"))  { state.page = t.getAttribute("data-page"); state.openId = null; render(); return; }
  if (t.hasAttribute("data-view"))  { state.view = t.getAttribute("data-view"); render(); }
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && (state.openId || state.promo)) { state.openId = null; state.promo = false; render(); }
});

var st = document.createElement("style");
st.textContent = CSS;
document.head.appendChild(st);
render();

</script>
</body>
</html>
