<title>Thrive Knockout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one draw sheet read left to right. Every round sits on a single
   grid measured in half-rows, so each connector meets the next card's
   centre line exactly instead of being nudged into place. */
:root{
  --bg:#eceff3; --surface:#ffffff; --sunk:#e3e8ed; --line:#c6d0da;
  --ink:#121820; --dim:#596877; --faint:#8695a4;
  --brass:#8a6410; --brass-line:#b8893a; --brass-wash:#f7efda;
  --live:#15509e; --live-wash:#dde9fb;
  --out:#9aa7b4;
  --font-display:"Barlow Condensed","Oswald",Impact,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
  --shadow:0 1px 2px rgba(18,24,32,.07), 0 6px 18px rgba(18,24,32,.05);
  /* Draw-sheet measurements. The grid template is written inline because the
     column count follows the field size, so these have to be tokens for a
     media query to be able to shrink them. */
  --colw:164px; --gutw:20px; --cupw:132px; --slot:90px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1118; --surface:#141c26; --sunk:#1b242f; --line:#2b3744;
    --ink:#e9eff6; --dim:#93a4b6; --faint:#6d7f91;
    --brass:#e2b65c; --brass-line:#9c7a2e; --brass-wash:#272112;
    --live:#6ea8ff; --live-wash:#13233c;
    --out:#5d6c7b;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1118; --surface:#141c26; --sunk:#1b242f; --line:#2b3744;
  --ink:#e9eff6; --dim:#93a4b6; --faint:#6d7f91;
  --brass:#e2b65c; --brass-line:#9c7a2e; --brass-wash:#272112;
  --live:#6ea8ff; --live-wash:#13233c;
  --out:#5d6c7b;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.55 var(--font-body);
  -webkit-font-smoothing:antialiased;
}
.gut{
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.shell{max-width:1240px; margin:0 auto}
h1,h2,h3{margin:0; text-wrap:balance}
button{font:inherit; color:inherit; cursor:pointer}
input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--live); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

/* ---------- masthead ---------- */
.top{border-bottom:1px solid var(--line); background:var(--surface)}
.top-in{display:flex; align-items:flex-end; gap:18px; flex-wrap:wrap; padding-block:16px 0}
.brand{display:flex; align-items:center; gap:14px; min-width:0}
.logo{height:34px; width:auto; flex:none}
.logo-dark{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .logo-light{display:none}
  :root:not([data-theme="light"]) .logo-dark{display:block}
}
:root[data-theme="dark"] .logo-light{display:none}
:root[data-theme="dark"] .logo-dark{display:block}
.rule{width:1px; align-self:stretch; min-height:36px; background:var(--line); flex:none}
.brand h1{font:700 30px/0.96 var(--font-display); letter-spacing:.012em; text-transform:uppercase}
.brand p{margin:3px 0 0; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}
.top-right{margin-left:auto; display:flex; align-items:center; gap:10px; padding-bottom:4px; flex-wrap:wrap}
.chip{
  display:inline-flex; align-items:center; gap:7px;
  font:600 11px/1 var(--font-body); letter-spacing:.1em; text-transform:uppercase;
  padding:7px 11px; border-radius:999px; border:1px solid var(--line); color:var(--dim);
  background:var(--sunk);
}
.chip.live{color:var(--live); border-color:var(--live); background:var(--live-wash)}
.chip.done{color:var(--brass); border-color:var(--brass-line); background:var(--brass-wash)}
.dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex:none}

/* ---------- tabs ---------- */
.tabs{display:flex; gap:2px; margin-top:14px; flex-wrap:wrap}
.tab{
  appearance:none; background:none; border:0; border-bottom:2px solid transparent;
  padding:9px 2px; margin-right:22px; color:var(--dim);
  font:600 13px/1 var(--font-body); letter-spacing:.03em;
}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--brass-line)}

/* ---------- notices ---------- */
.note{
  display:flex; gap:11px; align-items:flex-start;
  border:1px solid var(--line); border-left:3px solid var(--live);
  background:var(--surface); border-radius:var(--r);
  padding:13px 15px; font-size:13.5px; color:var(--dim);
}
.note b{color:var(--ink); font-weight:600}
.note.warm{border-left-color:var(--brass-line)}
.note.bad{border-left-color:#b4342a}

/* ---------- draw sheet ---------- */
section{padding-block:24px}
.sec-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.sec-head h2{font:600 13px/1 var(--font-body); letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}
.sec-head .when{font-size:13px; color:var(--dim)}
.scroll{overflow-x:auto; padding-bottom:8px}
/* Two rows: the round headings, then the cards. The headings line up by
   grid; the cards are placed on their own centre lines inside each column,
   because the rounds are no longer powers of two and a card sits midway
   between the two it feeds from. */
.bracket{display:grid; grid-template-rows:auto auto; gap:0; min-width:min-content}
.col{position:relative; min-width:0; height:calc(var(--slot) * var(--rows))}
.rhead{padding:0 0 12px; min-width:0; overflow-wrap:anywhere}
.rhead .t{font:600 12px/1.2 var(--font-body); letter-spacing:.1em; text-transform:uppercase; color:var(--ink)}
.rhead .s{font:500 11px/1.4 var(--font-mono); color:var(--faint); margin-top:3px}
/* Break between the week and the dates, never inside a date range. */
.rhead .s span{white-space:nowrap}
.rhead.now .t{color:var(--live)}

.match{
  position:absolute; left:0; right:0; transform:translateY(-50%);
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; box-shadow:var(--shadow); min-width:0;
}
.match.now{border-color:var(--live)}
.match.auto{box-shadow:none; border-style:dashed}
.side{display:flex; align-items:center; gap:8px; padding:8px 11px; min-width:0}
.side + .side{border-top:1px solid var(--line)}
.sd{
  font:600 11px/1 var(--font-mono); color:var(--faint);
  width:22px; flex:none; text-align:right; font-variant-numeric:tabular-nums;
}
.nm{font-size:13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nm.tbd{color:var(--faint); font-style:italic}
.nm.bye{color:var(--faint); font:600 10.5px/1.3 var(--font-body); letter-spacing:.14em; text-transform:uppercase}
.nm .sm{display:none}
.sc{
  margin-left:auto; font:600 13.5px/1 var(--font-mono); font-variant-numeric:tabular-nums;
  color:var(--dim); flex:none;
}
.side.won{background:var(--brass-wash)}
.side.won .nm{font-weight:600}
.side.won .sc{color:var(--brass); font-weight:600}
.side.lost .nm,.side.lost .sd,.side.lost .sc{color:var(--out)}

i.conn{
  position:absolute; left:0; right:0; border:0 solid var(--line);
  border-top-width:1px; border-bottom-width:1px; border-right-width:1px;
  border-top-right-radius:7px; border-bottom-right-radius:7px;
  margin-left:-1px;
}

.cup{
  position:absolute; left:14px; right:0; transform:translateY(-50%);
  border:1px solid var(--brass-line); border-radius:var(--r);
  background:var(--brass-wash); padding:15px 14px; text-align:center; min-width:0;
}
.cup .lab{font:600 10.5px/1 var(--font-body); letter-spacing:.14em; text-transform:uppercase; color:var(--brass)}
.cup .who{font:700 22px/1.1 var(--font-display); text-transform:uppercase; margin-top:7px; color:var(--ink); overflow-wrap:anywhere}
.cup .who.tbd{color:var(--faint); font-weight:500}

/* ---------- control room ---------- */
.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:17px; margin-bottom:14px;
}
.panel.narrow{max-width:460px}
.panel > h3{
  font:600 12px/1 var(--font-body); letter-spacing:.12em; text-transform:uppercase;
  color:var(--faint); margin-bottom:4px;
}
.panel > .hint{font-size:13px; color:var(--dim); margin:0 0 14px}
.fields{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px}
.fields.one{grid-template-columns:1fr}
label.f{display:flex; flex-direction:column; gap:5px; min-width:0}
label.f span{font:600 10.5px/1 var(--font-body); letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
input[type=text],input[type=number],input[type=password]{
  background:var(--bg); border:1px solid var(--line); border-radius:7px;
  padding:9px 10px; width:100%; min-width:0;
}
input[type=number]{font-family:var(--font-mono); font-variant-numeric:tabular-nums}

.draw-sum{
  display:flex; gap:9px 20px; flex-wrap:wrap; align-items:baseline;
  background:var(--sunk); border-radius:8px; padding:11px 13px; margin-bottom:14px;
  font-size:13px; color:var(--dim);
}
.draw-sum b{color:var(--ink); font-weight:600; font-family:var(--font-mono)}
.seeds{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:9px}
.seedrow{display:flex; align-items:center; gap:8px; min-width:0}
.seedrow .n{
  font:600 11px/1 var(--font-mono); color:var(--faint); width:24px; flex:none; text-align:right;
  font-variant-numeric:tabular-nums;
}
.x{
  appearance:none; border:1px solid var(--line); background:var(--bg); color:var(--faint);
  border-radius:6px; width:30px; height:34px; flex:none; font-size:15px; line-height:1;
}
.x:hover{color:var(--ink)}
.addrow{display:flex; gap:9px; flex-wrap:wrap; margin-top:13px; align-items:center}

.mrow{
  display:grid; grid-template-columns:1fr auto; gap:10px 12px;
  padding:12px 0; border-top:1px solid var(--line); align-items:center;
}
.mrow:first-of-type{border-top:0}
.mside{display:flex; align-items:center; gap:9px; min-width:0}
.mside .nm{flex:1}
.mside input[type=number]{width:74px; flex:none; text-align:right}
.mside.won .nm{font-weight:600}
.mside.lost .nm,.mside.lost .sd{color:var(--out)}
.pick{display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; flex:none}
.pick button{
  appearance:none; background:var(--bg); border:0; padding:7px 11px;
  font:600 11px/1 var(--font-body); letter-spacing:.06em; color:var(--dim);
  border-left:1px solid var(--line);
}
.pick button:first-child{border-left:0}
.pick button[aria-pressed="true"]{background:var(--brass-wash); color:var(--brass)}
.mstack{display:flex; flex-direction:column; gap:7px; min-width:0}
.autotag{
  font:600 10.5px/1 var(--font-body); letter-spacing:.1em; text-transform:uppercase;
  color:var(--faint); white-space:nowrap;
}

.bar{
  position:sticky; bottom:0; display:flex; gap:11px; align-items:center; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:12px 15px; box-shadow:var(--shadow); margin-top:4px;
}
.btn{
  appearance:none; border:1px solid var(--line); background:var(--bg);
  border-radius:8px; padding:10px 15px; font:600 13px/1 var(--font-body);
}
.btn.go{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.btn:disabled{opacity:.42; cursor:default}
.btn.danger{color:#b4342a; border-color:#d9a09a}
:root[data-theme="dark"] .btn.danger,
:root:not([data-theme="light"]) .btn.danger{color:#f08a7e; border-color:#5e332e}
.state{font-size:12.5px; color:var(--dim); margin-left:auto}
.state.dirty{color:var(--brass); font-weight:600}
.foot{padding-block:12px 32px; font-size:12px; color:var(--faint)}

@media (max-width: 620px){
  /* A phone shows one column of a bracket at a time, so everything comes
     down a step: more of the draw fits on screen and less of it is scrolled
     past sideways. */
  :root{--colw:132px; --gutw:13px; --cupw:104px; --slot:70px}
  .nm .lg{display:none}
  .nm .sm{display:inline}
  .rhead .s{font-size:9px; line-height:1.35}
  body{font-size:14px}
  section{padding-block:16px}
  .top-in{padding-block:12px 0; gap:10px}
  .logo{height:24px}
  .rule{min-height:26px}
  .brand{gap:10px}
  .brand h1{font-size:22px}
  .brand p{font-size:9.5px; letter-spacing:.1em}
  .top-right{gap:6px; width:100%; margin-left:0; padding-bottom:0}
  .chip{font-size:9.5px; padding:5px 8px; gap:5px}
  .tabs{margin-top:10px}
  .tab{margin-right:16px; font-size:12.5px; padding:8px 2px}

  .sec-head{margin-bottom:10px; gap:4px}
  .sec-head h2{font-size:11.5px}
  .sec-head .when{font-size:11.5px}

  .side{padding:5px 7px; gap:5px}
  .sd{width:15px; font-size:9.5px}
  .nm{font-size:11.5px}
  .sc{font-size:11.5px}
  .nm.bye{font-size:9px; letter-spacing:.1em}
  .rhead{padding-bottom:8px}
  .rhead .t{font-size:10px; letter-spacing:.06em}
  .rhead .s{font-size:9.5px}
  .cup{padding:10px 9px; margin-left:9px}
  .cup .lab{font-size:9px}
  .cup .who{font-size:16px}
  i.conn{border-top-right-radius:5px; border-bottom-right-radius:5px}

  .panel{padding:13px}
  .note{padding:11px 12px; font-size:12.5px}
  .draw-sum{font-size:12px; gap:6px 14px; padding:9px 10px}
  .seeds{grid-template-columns:1fr; gap:7px}
  .fields{grid-template-columns:1fr}
  /* The score boxes and the winner buttons cannot share a line this narrow. */
  .mrow{grid-template-columns:1fr; gap:9px; padding:10px 0}
  .pick{width:100%}
  .pick button{flex:1; text-align:center; padding:8px 6px}
  .mside input[type=number]{width:66px}
  .bar{padding:10px 12px; gap:8px}
  .btn{padding:9px 12px; font-size:12.5px}
  .state{margin-left:0; width:100%}
}
</style>

<script>
(function () {
  "use strict";

  /* ====================================================================
     Two homes, one file.

     On claude.ai the board keeps its data in the artifact database and the
     control room is held by a passcode stored beside it. Deployed to your
     own domain there is no artifact database, so it reads the Cloudflare
     relay instead and the relay account IS the control room lock -- the
     stronger of the two, because the refusal happens on the server rather
     than in the page.

     Everything above this line reads and writes through load and save, so
     no screen knows or cares which home it got.
     ==================================================================== */
  var RELAY = String(window.THRIVE_RELAY || "").replace(/\/+$/, "");
  var MODE = RELAY ? "relay" : "artifact";
  /* Which half of the board this build carries. "bracket" is the copy
     agents get: the control room is not merely hidden on it, the tab does
     not exist and adminHTML is never reached. The relay refuses their
     writes regardless -- this keeps the editing screen off a page that is
     handed around, rather than being the thing that protects the results.
     Unset means both halves, which is what the artifact copy needs: there
     is one store per artifact, so a separate control-room artifact would
     be editing a different tournament. */
  var ROLE = String(window.THRIVE_ROLE || "full");
  var HAS_CONTROL = ROLE !== "bracket";
  var BOARD_PATH = "/kv/tournament_board";     /* relay: the write route */
  var PUBLIC_PATH = "/tournament";             /* relay: the read route, no token */
  var TOKEN_KEY = "thrive_knockout_token";
  var POLL_MS = 60000;                         /* the relay has no push channel */

  var DOC = "tournament/current";
  var GATE = "data/control/auth/gate";   /* rules keep this admin-only */
  var MIN_AGENTS = 2, MAX_AGENTS = 250;
  var ITER = 120000;

  /* A slot holds an agent index, or one of these two. */
  var TBD = null;   /* the feeding match has not been settled */
  var BYE = -1;     /* nobody: the draw was padded out to a power of two */

  /* ---------------------------------------------------------- bracket maths */

  /* How the field thins out. Everyone still in plays, in pairs, and only an
     odd one out sits a round: 12 agents go 12 -> 6 -> 3 -> 2 -> 1, so the one
     bye in the whole tournament falls at three.

     This replaces rounding the field up to the next power of two, which
     padded 12 agents into a 16-slot draw and sat four of them out of the
     opening week. That shape comes from seeded tournaments with a reason to
     protect top seeds; this has none, and it made week one look half played
     before anybody had played. */
  var planCache = {};
  function plan(count) {
    if (planCache[count]) return planCache[count];
    var P = [count];
    while (P[P.length - 1] > 1) P.push(Math.ceil(P[P.length - 1] / 2));
    planCache[count] = { P: P, rounds: P.length - 1 };
    return planCache[count];
  }
  function roundsOf(count) { return plan(count).rounds; }
  function playersIn(count, r) { return plan(count).P[r]; }
  function cardsIn(count, r) { return plan(count).P[r + 1]; }
  /* A card's centre line, in units of one first-round card. A card sits
     midway between the two it feeds from, which is what keeps the joins
     straight when the rounds are not powers of two. */
  function centreOf(count, r, j) {
    if (r === 0) return j + 0.5;
    var here = playersIn(count, r), a = centreOf(count, r - 1, 2 * j);
    return 2 * j + 1 < here ? (a + centreOf(count, r - 1, 2 * j + 1)) / 2 : a;
  }
  function agentCount(t) { return t.seeds.length; }
  /* One per round that starts with an odd number left, and no more. */
  function byeCount(t) {
    var P = plan(agentCount(t)).P, n = 0;
    for (var r = 0; r < P.length - 1; r++) if (P[r] % 2) n++;
    return n;
  }



  /* Named for who is actually left. Round one of an uneven field is an
     opening round, not a "round of 64" that only 40 agents turn up to. */
  /* Named for how many are left going into it. */
  function defaultRoundName(count, r) {
    var left = playersIn(count, r);
    if (left <= 2) return "Championship";
    if (left <= 4) return "Semifinals";
    if (left <= 8) return "Quarterfinals";
    return "Round of " + left;
  }
  /* A label the page wrote is the page's to rewrite when the draw changes
     size; a label someone typed is theirs and survives. Keeping every label
     by position is what left "Round of 16" at the head of a 64-slot draw. */
  function isAutoName(s) {
    s = String(s || "").trim();
    return !s || s === "Opening round" || s === "Championship" ||
      s === "Semifinals" || s === "Quarterfinals" || /^Round of \d+$/.test(s);
  }
  function roundsFor(count, keep) {
    var out = [], n = roundsOf(count);
    for (var r = 0; r < n; r++) {
      var old = keep && keep[r];
      var name = defaultRoundName(count, r);
      if (old && typeof old.name === "string" && !isAutoName(old.name)) name = old.name;
      var week = "Week " + (r + 1);
      if (old && typeof old.week === "string" && !/^Week \d+$/.test(old.week.trim())) week = old.week;
      out.push({ name: name, week: week, dates: (old && typeof old.dates === "string") ? old.dates : "" });
    }
    return out;
  }
  function blank(count) {
    count = count || 16;
    var seeds = [];
    for (var i = 0; i < count; i++) seeds.push("");
    return { name: "Thrive Knockout", seeds: seeds, rounds: roundsFor(count), results: {} };
  }

  /* Shared data is written by other people and survives republishes, so
     never trust its shape -- coerce it into something the renderer can walk
     without checking at every step. */
  /* Shared data is written by other people and survives republishes, so
     never trust its shape -- coerce it into something the renderer can walk
     without checking at every step. */
  function normalize(raw) {
    var d = raw && typeof raw === "object" ? raw : {};
    var src = Array.isArray(d.seeds) ? d.seeds : [];
    var count = Math.min(MAX_AGENTS, Math.max(MIN_AGENTS, src.length || 16));
    var out = blank(count);
    if (typeof d.name === "string" && d.name.trim()) out.name = d.name.slice(0, 80);
    for (var i = 0; i < count; i++) {
      out.seeds[i] = typeof src[i] === "string" ? src[i].slice(0, 60) : "";
    }
    out.rounds = roundsFor(count, Array.isArray(d.rounds) ? d.rounds : null);
    /* Results are kept by position. A key for a card the draw no longer has
       is dropped here rather than lingering invisibly. */
    if (d.results && typeof d.results === "object") {
      for (var r = 0; r < roundsOf(count); r++) {
        for (var j = 0; j < cardsIn(count, r); j++) {
          var k = r + "-" + j, v = d.results[k];
          if (!v || typeof v !== "object") continue;
          /* Rounds are filled in order, so the winners this reads are already
             settled. A card with nobody opposite carries no score -- but it
             does carry whether the organizer advanced that agent. */
          if (isAuto(out, r, j)) {
            if (v.w === "a" || v.w === "b") out.results[k] = { sa: null, sb: null, w: v.w };
            continue;
          }
          out.results[k] = {
            sa: Number.isFinite(v.sa) ? v.sa : null,
            sb: Number.isFinite(v.sb) ? v.sb : null,
            w: v.w === "a" || v.w === "b" ? v.w : null
          };
        }
      }
    }
    return out;
  }

  /* Round one reads straight down the list: 1 plays 2, 3 plays 4, and so on.
     When the field is not a power of two the shortfall comes off the top --
     the leading seeds sit out round one -- so every agent who does play has
     a real opponent and no match is left empty. */
  /* Round one pairs the list straight down: 1 plays 2, 3 plays 4. Every
     round after pairs the winners the same way. When an odd number are left
     the last one through has nobody to play and sits that round out. */
  function competitors(t, r, j) {
    var count = agentCount(t), here = playersIn(count, r);
    if (r === 0) return [2 * j, 2 * j + 1 < count ? 2 * j + 1 : BYE];
    return [winnerOf(t, r - 1, 2 * j),
            2 * j + 1 < here ? winnerOf(t, r - 1, 2 * j + 1) : BYE];
  }
  /* Nobody moves up until the organizer says so -- a bye included. A bye
     still means no opponent this round, but it used to also mean the agent
     was already in the next one, which made an untouched opening round look
     played. The control room advances them explicitly now. */
  function winnerOf(t, r, i) {
    var c = competitors(t, r, i);
    if (c[0] === BYE && c[1] === BYE) return BYE;
    var res = t.results[r + "-" + i];
    if (!res || !res.w) return TBD;
    var pick = res.w === "a" ? c[0] : c[1];
    /* A result naming the empty side is not a winner. */
    return pick === BYE ? TBD : pick;
  }
  function isAuto(t, r, i) {
    var c = competitors(t, r, i);
    return c[0] === BYE || c[1] === BYE;
  }
  function champion(t) {
    return winnerOf(t, roundsOf(agentCount(t)) - 1, 0);
  }

  function liveRound(t) {
    var count = agentCount(t);
    for (var r = 0; r < roundsOf(count); r++) {
      for (var j = 0; j < cardsIn(count, r); j++) {
        if (winnerOf(t, r, j) === TBD) return r;
      }
    }
    return -1;
  }
  /* Which seeds sit out round one: the top of the list, as many as the draw
     is short. */
  /* Which rounds sit somebody out. Not "the top seeds" any more -- a bye is
     now just what happens to the last one through an odd round. */
  function byeRounds(t) {
    var P = plan(agentCount(t)).P, out = [];
    for (var r = 0; r < P.length - 1; r++) if (P[r] % 2) out.push(r);
    return out;
  }
  /* Naming two dozen people is a wall of text; a range says the same thing. */
  function byeBlurb(t) {
    var rs = byeRounds(t);
    if (!rs.length) return "";
    return rs.map(function (r) {
      return (t.rounds[r] && t.rounds[r].name) || "round " + (r + 1);
    }).join(" and ") + (rs.length === 1 ? " has" : " have") +
      " an odd number left, so one agent sits out";
  }

  function seedName(t, idx) {
    return idx == null || idx === BYE ? "" : (t.seeds[idx] || "").trim();
  }
  function slotLabel(t, idx) {
    if (idx === BYE) return { text: "Bye", cls: "bye" };
    if (idx == null) return { text: "Winner to come", short: "TBD", cls: "tbd" };
    var nm = seedName(t, idx);
    return { text: nm || "Seed " + (idx + 1), cls: nm ? "" : "tbd" };
  }
  /* A phone column cannot hold "Winner to come" without clipping it to
     something that reads like a different word, so both go in and CSS
     picks one. */
  function slotInner(L) {
    return L.short
      ? '<span class="lg">' + esc(L.text) + '</span><span class="sm">' + esc(L.short) + "</span>"
      : esc(L.text);
  }
  function slotNum(idx) { return idx == null ? "—" : (idx === BYE ? "" : idx + 1); }
  function anyNames(t) { return t.seeds.some(function (s) { return s && s.trim(); }); }
  function hasResults(t) {
    return Object.keys(t.results).some(function (k) {
      var r = t.results[k];
      return r && (r.w || r.sa != null || r.sb != null);
    });
  }

  /* ------------------------------------------------------------------ state */

  var served = blank(16);
  var draft = clone(served);
  var dirty = false;
  var tab = "bracket";
  var canEdit = false;
  var dbRef = null, gateRef = null;
  var dbDown = false;
  var saving = false;
  var flash = "";
  var confirming = "";
  var remoteChanged = false;   /* someone else saved while this draft was open */
  /* The control-room lock */
  var gate = null;            /* the stored credential, admin-readable only */
  var gateKnown = false;      /* has the store answered yet */
  var unlocked = false;
  var gateMsg = "";
  var gateBusy = false;
  var loadErr = "";
  var cryptoOK = !!(window.crypto && window.crypto.subtle && window.crypto.getRandomValues);

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  var view = document.getElementById("view");
  var statusEl = document.getElementById("status");
  var tabsEl = document.getElementById("tabs");
  var footEl = document.getElementById("foot");

  /* -------------------------------------------------------- the control lock */

  /* Nothing about an unlock is written down. The control room is asked for
     on every page load -- a reload, a new tab, a link opened by someone
     else -- so there is no state anywhere that could let a second person
     walk into an editing screen the first person opened.

     Clearing any key an older build of this page left behind, so a browser
     that still holds one is not trusted by it. */
  try { sessionStorage.removeItem("tk_unlocked"); } catch (e) {}
  function hex(bytes) {
    return Array.prototype.map.call(bytes, function (b) {
      return ("0" + b.toString(16)).slice(-2);
    }).join("");
  }
  function unhex(s) {
    var out = new Uint8Array(s.length / 2);
    for (var i = 0; i < out.length; i++) out[i] = parseInt(s.substr(i * 2, 2), 16);
    return out;
  }
  /* PBKDF2 rather than a bare digest, so the stored value is not worth
     grinding even by someone who can read it. */
  function derive(password, saltHex, iter) {
    var enc = new TextEncoder();
    return crypto.subtle
      .importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveBits"])
      .then(function (key) {
        return crypto.subtle.deriveBits(
          { name: "PBKDF2", salt: unhex(saltHex), iterations: iter, hash: "SHA-256" }, key, 256);
      })
      .then(function (bits) { return hex(new Uint8Array(bits)); });
  }
  function val(id) { var el = document.getElementById(id); return el ? el.value : ""; }

  /* ------------------------------------------------------------ the relay */

  /* The sign-in lasts for this page load and no longer. It was kept in
     localStorage, which survives a reload and a new tab -- convenient for
     one organizer, and wrong on a page that also carries the draw sheet
     everybody opens. Reloading asks again. */
  var liveToken = "";
  function relayToken() { return liveToken; }
  function setRelayToken(t) {
    liveToken = t || "";
    /* Drop anything an older build of this page left in storage. */
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }
  /* Agents read the board without an account -- it is a scoreboard. Only the
     write route asks for a token. */
  function relayLoad() {
    return fetch(RELAY + PUBLIC_PATH, { headers: { Accept: "application/json" } })
      .then(function (r) {
        if (!r.ok) throw new Error("the relay answered " + r.status);
        return r.json();
      })
      .then(function (body) {
        var next = body ? normalize(body) : blank(16);
        var moved = JSON.stringify(next) !== JSON.stringify(served);
        served = next;
        if (!dirty) { draft = clone(served); remoteChanged = false; }
        else if (moved) remoteChanged = true;
        dbDown = false; loadErr = "";
        render();
      })
      .catch(function (e) {
        dbDown = true;
        loadErr = (e && e.message) || "the relay could not be reached";
        render();
      });
  }
  function relaySave(payload) {
    return fetch(RELAY + BOARD_PATH, {
      method: "PUT",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + relayToken() },
      body: JSON.stringify({ value: JSON.stringify(payload) })
    }).then(function (r) {
      if (r.status === 401) {
        setRelayToken(""); unlocked = false; canEdit = false;
        throw { code: "signed_out", message: "Your sign-in has expired. Sign in again." };
      }
      if (!r.ok) throw { code: "http", message: "the relay answered " + r.status };
    });
  }
  function relaySignIn() {
    var email = val("g-user").trim(), pw = val("g-pw");
    if (!email || !pw) { gateMsg = "Enter the organizer email and password."; return render(); }
    gateBusy = true; gateMsg = ""; render();
    fetch(RELAY + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, password: pw })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) {
        return { ok: r.ok, status: r.status, body: b };
      });
    }).then(function (x) {
      gateBusy = false;
      if (x.ok && x.body && x.body.token) {
        setRelayToken(x.body.token);
        unlocked = true; canEdit = true; gateMsg = "";
      } else {
        gateMsg = (x.body && x.body.error) || ("That sign-in was refused (" + x.status + ").");
      }
      render();
    }).catch(function () {
      gateBusy = false;
      gateMsg = "Could not reach the relay to check those details.";
      render();
    });
  }

  function gateSet() {
    var u = val("g-user").trim().toLowerCase(), p = val("g-pw"), p2 = val("g-pw2");
    if (u.length < 2) { gateMsg = "Choose a username of at least two characters."; return render(); }
    if (p.length < 6) { gateMsg = "Choose a password of at least six characters."; return render(); }
    if (p !== p2) { gateMsg = "The two passwords are not the same."; return render(); }
    var salt = hex(crypto.getRandomValues(new Uint8Array(16)));
    gateBusy = true; gateMsg = ""; render();
    derive(p, salt, ITER).then(function (h) {
      return gateRef.set({ user: u, salt: salt, iter: ITER, hash: h, setAt: new Date().toISOString() });
    }).then(function () {
      gateBusy = false; unlocked = true; gateMsg = ""; confirming = ""; render();
    }).catch(function (err) {
      gateBusy = false;
      gateMsg = err && err.code === "invalid_argument"
        ? "Your account is not allowed to set the lock on this board."
        : "Could not save the lock: " + ((err && err.message) || "the store did not answer") + ".";
      render();
    });
  }
  function gateIn() {
    var u = val("g-user").trim().toLowerCase(), p = val("g-pw");
    gateBusy = true; gateMsg = ""; render();
    derive(p, gate.salt, gate.iter || ITER).then(function (h) {
      gateBusy = false;
      if (u === gate.user && h === gate.hash) { unlocked = true; gateMsg = ""; }
      else gateMsg = "That username and password do not match the control room.";
      render();
    }).catch(function () {
      gateBusy = false; gateMsg = "Could not check those details. Try again."; render();
    });
  }

  function lockHTML(mode) {
    var setting = mode === "set";
    if (mode === "relay") {
      return '<section><div class="panel narrow"><h3>Organizer sign-in</h3>' +
        '<p class="hint">The control room is held by your Thrive relay account, ' +
        "and it is asked for every time this page is opened. Agents read the " +
        "draw sheet without signing in.</p>" +
        '<div class="fields one">' +
          '<label class="f"><span>Email</span><input type="text" id="g-user" autocomplete="username" inputmode="email"></label>' +
          '<label class="f"><span>Password</span><input type="password" id="g-pw" autocomplete="current-password"></label>' +
        "</div>" +
        (gateMsg ? '<div class="note bad" style="margin-top:13px"><div>' + esc(gateMsg) + "</div></div>" : "") +
        '<div class="addrow"><button class="btn go" data-act="gate-relay"' +
          (gateBusy ? " disabled" : "") + ">" +
          (gateBusy ? "Checking\u2026" : "Sign in") + "</button></div></div>" +
        '<div class="note" style="max-width:640px"><div>The relay checks this on the server, ' +
        "so an agent who opens this screen cannot save a result whatever they type.</div></div>" +
      "</section>";
    }
    return "<section>" +
      (cryptoOK ? "" :
        '<div class="note bad"><div><b>This browser cannot run the lock.</b> ' +
        "It does not offer the cryptography the page needs, so the control room stays closed here. " +
        "Open the board in a current browser.</div></div>") +
      (cryptoOK ? '<div class="panel narrow"><h3>' +
        (setting ? "Set the control room lock" : "Control room") + "</h3>" +
        '<p class="hint">' + (setting
          ? "Pick a username and password. Anyone opening the control room is asked for them from now on, including you."
          : "Enter the username and password for this board. They are asked for every time the page is opened \u2014 nothing is remembered between visits.") + "</p>" +
        '<div class="fields one">' +
          '<label class="f"><span>Username</span><input type="text" id="g-user" autocomplete="username"></label>' +
          '<label class="f"><span>Password</span><input type="password" id="g-pw" autocomplete="' +
            (setting ? "new-password" : "current-password") + '"></label>' +
          (setting ? '<label class="f"><span>Password again</span>' +
            '<input type="password" id="g-pw2" autocomplete="new-password"></label>' : "") +
        "</div>" +
        (gateMsg ? '<div class="note bad" style="margin-top:13px"><div>' + esc(gateMsg) + "</div></div>" : "") +
        '<div class="addrow">' +
          '<button class="btn go" data-act="' + (setting ? "gate-set" : "gate-in") + '"' +
            (gateBusy ? " disabled" : "") + ">" +
            (gateBusy ? "Checking…" : (setting ? "Set the lock" : "Open the control room")) + "</button>" +
        "</div></div>" : "") +
      '<div class="note" style="max-width:640px"><div>This lock keeps people out of the editing screen. ' +
      "What actually protects the results is the board's sharing level: an agent given view access " +
      "cannot save a change even with the password, because the server refuses it.</div></div>" +
    "</section>";
  }

  /* -------------------------------------------------------------- rendering */

  function render() {
    document.getElementById("tname").textContent = served.name || "Thrive Knockout";
    renderStatus();
    renderTabs();
    if (tab !== "admin" || !HAS_CONTROL) view.innerHTML = bracketHTML();
    else if (MODE === "relay") view.innerHTML = unlocked ? adminHTML() : lockHTML("relay");
    else if (!gateKnown) view.innerHTML = '<section><div class="note"><div>Checking the control room lock…</div></div></section>';
    else if (!gate) view.innerHTML = lockHTML("set");
    else if (!unlocked) view.innerHTML = lockHTML("in");
    else view.innerHTML = adminHTML();
    footEl.textContent = HAS_CONTROL
      ? (unlocked
          ? "You are signed in as the organizer. What you save here appears for everyone the moment it lands."
          : "Results are kept by the tournament organizer. This board updates on its own when they post a score.")
      : "Results are posted by the tournament organizer. This board updates on its own \u2014 leave it open and it refreshes itself.";
  }

  function renderStatus() {
    var t = served, live = liveRound(t), ch = champion(t), bits = [];
    if (ch != null && ch !== BYE) {
      bits.push('<span class="chip done"><span class="dot"></span>Champion · ' +
        esc(seedName(t, ch) || ("Seed " + (ch + 1))) + "</span>");
    } else if (live >= 0) {
      var rd = t.rounds[live];
      bits.push('<span class="chip live"><span class="dot"></span>' +
        esc(rd.week || ("Round " + (live + 1))) + " · " + esc(rd.name) + "</span>");
    }
    var bc = byeCount(t);
    bits.push('<span class="chip">' + agentCount(t) + " agents" +
      (bc ? " · " + bc + " bye" + (bc === 1 ? "" : "s") : "") + "</span>");
    statusEl.innerHTML = bits.join("");
  }

  function renderTabs() {
    var tabs = [["bracket", "Bracket"]];
    /* On the relay the tab is the way in, so it always shows; the sign-in
       behind it is what keeps agents out. The bracket-only build has no
       control room at all. */
    if (HAS_CONTROL && (canEdit || MODE === "relay")) tabs.push(["admin", "Control room"]);
    tabsEl.innerHTML = tabs.map(function (x) {
      return '<button class="tab" role="tab" data-tab="' + x[0] + '" aria-selected="' +
        (tab === x[0]) + '">' + x[1] + "</button>";
    }).join("");
  }

  function sideHTML(t, idx, score, state) {
    var L = slotLabel(t, idx);
    return '<div class="side' + (state ? " " + state : "") + '">' +
      '<span class="sd">' + slotNum(idx) + "</span>" +
      '<span class="nm' + (L.cls ? " " + L.cls : "") + '">' + slotInner(L) + "</span>" +
      '<span class="sc">' + (score == null ? "" : esc(score)) + "</span></div>";
  }

  function bracketHTML() {
    var t = served, count = agentCount(t);
    var rounds = roundsOf(count), live = liveRound(t), ch = champion(t);
    var slots = cardsIn(count, 0);   /* first-round cards: the vertical unit */
    var out = "";

    if (dbDown && loadErr) {
      out += '<section><div class="note bad"><div><b>This board could not be loaded.</b> ' +
        esc(loadErr) + ". What you see below may be out of date; the page retries on its own." +
        "</div></div></section>";
    }

    if (!anyNames(t)) {
      out += '<section><div class="note' + (canEdit ? "" : " warm") + '"><div>' +
        (canEdit
          ? "<b>No agents entered yet.</b> Open the control room and type the names in \u2014 however many you have. Everyone plays in round one, paired straight down the list, and only an odd one out sits a round."
          : "<b>The draw has not been posted yet.</b> Names appear here as soon as the organizer enters them.") +
        "</div></div></section>";
    }

    var cols = [];
    for (var r = 0; r < rounds; r++) cols.push("minmax(var(--colw), 1fr) var(--gutw)");
    cols.push("minmax(var(--cupw), 0.85fr)");

    var cells = "";
    for (var r2 = 0; r2 < rounds; r2++) {
      var rd = t.rounds[r2];
      cells += '<div class="rhead' + (r2 === live ? " now" : "") + '" style="grid-column:' +
        (2 * r2 + 1) + ';grid-row:1"><div class="t">' + esc(rd.name) + "</div>" +
        '<div class="s">' +
          (rd.week || rd.dates
            ? (rd.week ? "<span>" + esc(rd.week) + "</span>" : "") +
              (rd.week && rd.dates ? " \u00b7 " : "") +
              (rd.dates ? "<span>" + esc(rd.dates) + "</span>" : "")
            : "\u2014") +
        "</div></div>";

      var cards = "";
      for (var j = 0; j < cardsIn(count, r2); j++) {
        var c = competitors(t, r2, j), res = t.results[r2 + "-" + j] || {};
        var auto = isAuto(t, r2, j);
        /* The empty half of a bye is never marked, won or lost. The real
           half is marked only once it has actually been advanced. */
        var sA = c[0] === BYE ? "" : (res.w === "a" ? "won" : (res.w ? "lost" : ""));
        var sB = c[1] === BYE ? "" : (res.w === "b" ? "won" : (res.w ? "lost" : ""));
        cards += '<div class="match' + (r2 === live && !auto ? " now" : "") +
          (auto ? " auto" : "") + '" style="top:calc(var(--slot) * ' +
          centreOf(count, r2, j) + ')">' +
          sideHTML(t, c[0], auto ? null : res.sa, sA) +
          sideHTML(t, c[1], auto ? null : res.sb, sB) +
        "</div>";
      }
      cells += '<div class="col" style="grid-column:' + (2 * r2 + 1) + ';grid-row:2">' +
        cards + "</div>";

      if (r2 < rounds - 1) {
        /* One join per card in the next round that draws from two here. A
           card fed by only one (the odd one out) needs no bracket drawn. */
        var joins = "";
        for (var k = 0; k < cardsIn(count, r2 + 1); k++) {
          if (2 * k + 1 >= cardsIn(count, r2)) continue;
          var top = centreOf(count, r2, 2 * k);
          var bot = centreOf(count, r2, 2 * k + 1);
          joins += '<i class="conn" style="top:calc(var(--slot) * ' + top +
            ');height:calc(var(--slot) * ' + (bot - top) + ')"></i>';
        }
        cells += '<div class="col" style="grid-column:' + (2 * r2 + 2) + ';grid-row:2">' +
          joins + "</div>";
      }
    }

    var chName = ch != null && ch !== BYE ? seedName(t, ch) : "";
    cells += '<div class="col" style="grid-column:' + (2 * rounds + 1) + ';grid-row:2">' +
      '<div class="cup" style="top:calc(var(--slot) * ' + centreOf(count, rounds - 1, 0) + ')">' +
      '<div class="lab">Champion</div><div class="who' + (chName ? "" : " tbd") + '">' +
      esc(chName || (ch != null && ch !== BYE ? "Seed " + (ch + 1) : "To be decided")) +
      "</div></div></div>";

    var byes = byeCount(t);
    out += "<section>" +
      '<div class="sec-head"><h2>Draw sheet</h2><span class="when">' +
        esc(count + " agents \u00b7 " + rounds + " round" + (rounds === 1 ? "" : "s") +
            (byes ? " \u00b7 " + byeBlurb(t) : " \u00b7 everyone paired every round")) +
      "</span></div>" +
      '<div class="scroll"><div class="bracket" style="grid-template-columns:' +
      cols.join(" ") + ";--rows:" + slots + '">' + cells + "</div></div></section>";

    return out;
  }

  /* ----------------------------------------------------------- control room */

  function adminHTML() {
    var t = draft, count = agentCount(t);
    var rounds = roundsOf(count), byes = byeCount(t);
    var out = "";

    if (dbDown) {
      out += '<section><div class="note bad"><div><b>Nothing can be saved right now.</b> ' +
        "This view could not open the tournament store, so the control room is showing " +
        "your copy only. Reload the page to try again.</div></div></section>";
    }

    out += '<section><div class="panel"><h3>Tournament</h3>' +
      '<p class="hint">The name shows at the top of the board.</p>' +
      '<div class="fields"><label class="f"><span>Name</span>' +
      '<input type="text" id="f-name" value="' + esc(t.name) + '"></label></div></div>';

    /* Agents */
    var rows = "";
    for (var i = 0; i < count; i++) {
      rows += '<div class="seedrow">' +
        '<span class="n" title="Seed ' + (i + 1) + '">' + (i + 1) + "</span>" +
        '<input type="text" data-seed="' + i + '" value="' + esc(t.seeds[i]) +
          '" placeholder="Agent name" aria-label="Seed ' + (i + 1) + '">' +
        (confirming === "drop-" + i
          ? '<button class="btn danger" data-drop="' + i + '" data-sure="1" ' +
            'style="padding:8px 10px;white-space:nowrap">Remove?</button>'
          : '<button class="x" data-drop="' + i + '" title="Remove seed ' + (i + 1) +
            '" aria-label="Remove seed ' + (i + 1) + '"' +
            (count <= MIN_AGENTS ? " disabled" : "") + ">×</button>") +
      "</div>";
    }
    out += '<div class="panel"><h3>The draw</h3>' +
      '<p class="hint">Enter as many agents as you have, in the order you want them to meet. ' +
      "Round one runs straight down the list — 1 plays 2, 3 plays 4, 5 plays 6 — and every " +
      "round after pairs the winners the same way. Everybody still in plays; only when an odd " +
      "number are left does the last one through sit a round out.</p>" +
      '<div class="draw-sum">' +
        "<span>Agents <b>" + count + "</b></span>" +
        "<span>Rounds <b>" + rounds + "</b></span>" +
        "<span>Round one <b>" + cardsIn(count, 0) + "</b> matches</span>" +
        "<span>Byes <b>" + byes + "</b></span>" +
        (byes
          ? "<span>" + esc(byeBlurb(t)) + "</span>"
          : "<span>Everyone is paired in every round.</span>") +
      "</div>" +
      (hasResults(t)
        ? '<div class="note warm" style="margin-bottom:14px"><div><b>Scores are already recorded.</b> ' +
          "Results are held by position in the draw, so adding or removing an agent now re-points " +
          "existing scores at whoever lands in that slot. Renaming an agent is always safe; " +
          "reordering one mid-tournament is not.</div></div>"
        : "") +
      '<div class="seeds">' + rows + "</div>" +
      '<div class="addrow">' +
        '<button class="btn" data-act="add"' + (count >= MAX_AGENTS ? " disabled" : "") + ">Add an agent</button>" +
        '<label class="f" style="flex-direction:row;align-items:center;gap:9px">' +
          '<span style="white-space:nowrap">Or set the count</span>' +
          '<input type="number" id="f-count" value="' + count + '" min="' + MIN_AGENTS +
            '" max="' + MAX_AGENTS + '" style="width:92px">' +
        "</label>" +
      "</div></div>";

    /* Rounds */
    out += '<div class="panel"><h3>Weeks</h3>' +
      '<p class="hint">Each round is one week. What you type here labels the draw sheet. ' +
      "Round names you leave alone follow the size of the field; rename one and your name sticks.</p>";
    for (var r = 0; r < rounds; r++) {
      out += '<div class="fields" style="margin-bottom:11px">' +
        '<label class="f"><span>Round ' + (r + 1) + " name</span>" +
          '<input type="text" data-rd="' + r + '" data-k="name" value="' + esc(t.rounds[r].name) + '"></label>' +
        '<label class="f"><span>Week</span>' +
          '<input type="text" data-rd="' + r + '" data-k="week" value="' + esc(t.rounds[r].week) +
          '" placeholder="Week ' + (r + 1) + '"></label>' +
        '<label class="f"><span>Dates</span>' +
          '<input type="text" data-rd="' + r + '" data-k="dates" value="' + esc(t.rounds[r].dates) +
          '" placeholder="Oct 20 – Oct 24"></label>' +
      "</div>";
    }
    out += "</div>";

    /* Results */
    for (var r2 = 0; r2 < rounds; r2++) {
      var rd = t.rounds[r2], body = "";
      for (var m = 0; m < cardsIn(count, r2); m++) {
        var c = competitors(t, r2, m), res = t.results[r2 + "-" + m] || {};
        var auto = isAuto(t, r2, m);
        body += '<div class="mrow"><div class="mstack">' +
          adminSide(t, r2, m, "a", c[0], res.sa, res.w, auto) +
          adminSide(t, r2, m, "b", c[1], res.sb, res.w, auto) +
        "</div>" +
        (auto
          ? (function () {
              /* One real agent and no opponent: the only choice is whether
                 they are through yet. */
              var side = c[0] === BYE ? "b" : "a";
              return '<div class="pick" role="group" aria-label="Advance match ' + (m + 1) + '">' +
                '<button data-win="' + r2 + "-" + m + '" data-side="' + side + '" aria-pressed="' +
                  (res.w === side) + '">Advance</button>' +
                '<button data-win="' + r2 + "-" + m + '" data-side="" aria-pressed="' +
                  (!res.w) + '">Clear</button></div>';
            })()
          : '<div class="pick" role="group" aria-label="Winner of match ' + (m + 1) + '">' +
            '<button data-win="' + r2 + "-" + m + '" data-side="a" aria-pressed="' + (res.w === "a") + '">A wins</button>' +
            '<button data-win="' + r2 + "-" + m + '" data-side="b" aria-pressed="' + (res.w === "b") + '">B wins</button>' +
            '<button data-win="' + r2 + "-" + m + '" data-side="" aria-pressed="' + (!res.w) + '">Clear</button>' +
          "</div>") +
        "</div>";
      }
      out += '<div class="panel"><h3>' + esc(rd.name) + " · results</h3>" +
        '<p class="hint">Put in the week’s score for each agent and mark who went through. ' +
        "Nobody moves up until you do — a bye sits out the round and still needs " +
        "<b>Advance</b> before they count as in the next one.</p>" + body + "</div>";
    }

    /* The lock. On the relay the account is the lock, so there is nothing
       here to change -- signing out is the whole of it. */
    if (MODE === "relay") {
      out += '<div class="panel"><h3>Organizer session</h3>' +
        '<p class="hint">Signed in against the relay. Only this account can save; ' +
        "everyone else sees the draw sheet and nothing more.</p>" +
        '<div class="addrow"><button class="btn" data-act="relay-out">Sign out</button></div></div>';
    } else
    out += '<div class="panel"><h3>Control room lock</h3>' +
      '<p class="hint">Set on ' + esc((gate && gate.setAt || "").slice(0, 10) || "—") +
      ". Changing it signs out everyone who is in the control room now." +
      " The lock hides this screen; the board's sharing level is what stops an agent saving anything.</p>" +
      '<div class="addrow">' +
        '<button class="btn" data-act="gate-change">Change username and password</button>' +
        '<button class="btn" data-act="gate-lock">Lock the control room</button>' +
      "</div>";
    if (confirming === "gate") {
      out += '<div class="fields one" style="margin-top:14px;max-width:420px">' +
        '<label class="f"><span>New username</span><input type="text" id="g-user" autocomplete="username"></label>' +
        '<label class="f"><span>New password</span><input type="password" id="g-pw" autocomplete="new-password"></label>' +
        '<label class="f"><span>New password again</span><input type="password" id="g-pw2" autocomplete="new-password"></label>' +
      "</div>" +
      (gateMsg ? '<div class="note bad" style="margin-top:13px"><div>' + esc(gateMsg) + "</div></div>" : "") +
      '<div class="addrow">' +
        '<button class="btn go" data-act="gate-set"' + (gateBusy ? " disabled" : "") + ">" +
          (gateBusy ? "Saving…" : "Save the new lock") + "</button>" +
        '<button class="btn" data-act="cancel">Cancel</button></div>';
    }
    out += "</div>";

    if (confirming === "reset-all") {
      out += '<div class="note warm"><div><b>Start the tournament over?</b> ' +
        "Every score, every winner and every advance is removed, and the week names " +
        "and dates go back to their defaults. The agents, and the order you put them " +
        "in, are kept." +
        '<div style="margin-top:10px;display:flex;gap:9px;flex-wrap:wrap">' +
        '<button class="btn danger" data-act="reset-all-yes">Reset to week one</button>' +
        '<button class="btn" data-act="cancel">Keep everything</button></div></div></div>';
    }

    if (confirming === "reset") {
      out += '<div class="note warm"><div><b>Clear every score?</b> ' +
        "The names and the weeks stay; all results and winners are removed." +
        '<div style="margin-top:10px;display:flex;gap:9px;flex-wrap:wrap">' +
        '<button class="btn danger" data-act="reset-yes">Clear the results</button>' +
        '<button class="btn" data-act="cancel">Keep them</button></div></div></div>';
    }

    if (remoteChanged) {
      out += '<div class="note warm"><div><b>Someone else saved this board while you were editing.</b> ' +
        "Saving now replaces their version with yours." +
        '<div style="margin-top:10px;display:flex;gap:9px;flex-wrap:wrap">' +
        '<button class="btn" data-act="take-remote">Load theirs and drop my changes</button>' +
        "</div></div></div>";
    }

    out += '<div class="bar">' +
      '<button class="btn go" data-act="save"' + (dirty && !saving && !dbDown ? "" : " disabled") + ">" +
        (saving ? "Saving…" : "Save changes") + "</button>" +
      '<button class="btn" data-act="revert"' + (dirty && !saving ? "" : " disabled") + ">Discard</button>" +
      '<button class="btn danger" data-act="reset">Clear results</button>' +
      '<button class="btn danger" data-act="reset-all">Reset to week one</button>' +
      '<span class="state' + (dirty ? " dirty" : "") + '">' +
        esc(flash || (dirty ? "Unsaved changes" : "Everything is saved")) + "</span>" +
    "</div></section>";

    return out;
  }

  function adminSide(t, r, m, side, idx, score, w, auto) {
    var L = slotLabel(t, idx);
    var cls = auto ? "" : (w === side ? " won" : (w ? " lost" : ""));
    return '<div class="mside' + cls + '">' +
      '<span class="sd">' + slotNum(idx) + "</span>" +
      '<span class="nm' + (L.cls ? " " + L.cls : "") + '">' + slotInner(L) + "</span>" +
      (auto ? "" :
        '<input type="number" data-score="' + r + "-" + m + '" data-side="' + side +
        '" value="' + (score == null ? "" : esc(score)) + '" placeholder="—" ' +
        'aria-label="Score" inputmode="numeric">') +
    "</div>";
  }

  /* ------------------------------------------------------------------ events */

  function markDirty() {
    if (dirty) return;
    dirty = true; flash = "";
    /* A full render would take the caret out of the field being typed in,
       so wake the save bar in place instead. Without this the button stayed
       disabled until something else happened to re-render, and an edit to
       just a name or a score could not be saved. */
    var btn = view.querySelector('[data-act="save"]');
    var rev = view.querySelector('[data-act="revert"]');
    var st = view.querySelector(".state");
    if (btn && !saving && !dbDown) btn.disabled = false;
    if (rev && !saving) rev.disabled = false;
    if (st) { st.textContent = "Unsaved changes"; st.className = "state dirty"; }
  }
  function setFlash(msg) {
    flash = msg;
    setTimeout(function () { if (flash === msg) { flash = ""; render(); } }, 2600);
  }

  /* Growing or shrinking the field reshapes the draw, so the week list has to
     follow it. Labels someone typed are kept; the page's own are rewritten. */
  function setCount(n) {
    n = Math.min(MAX_AGENTS, Math.max(MIN_AGENTS, Math.round(n) || MIN_AGENTS));
    while (draft.seeds.length < n) draft.seeds.push("");
    draft.seeds.length = n;
    draft.rounds = roundsFor(n, draft.rounds);
    draft = normalize(draft);
    markDirty();
  }

  tabsEl.addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]");
    if (!b) return;
    tab = b.getAttribute("data-tab");
    if (tab === "admin" && !HAS_CONTROL) tab = "bracket";
    gateMsg = "";
    render();
  });

  view.addEventListener("input", function (e) {
    var el = e.target;
    if (el.id === "f-name") { draft.name = el.value; markDirty(); return; }
    if (el.hasAttribute("data-seed")) {
      draft.seeds[+el.getAttribute("data-seed")] = el.value;
      markDirty();
      syncNames();   /* redraw the names below without stealing the caret */
      return;
    }
    if (el.hasAttribute("data-rd")) {
      draft.rounds[+el.getAttribute("data-rd")][el.getAttribute("data-k")] = el.value;
      markDirty();
      return;
    }
    if (el.hasAttribute("data-score")) {
      var key = el.getAttribute("data-score"), side = el.getAttribute("data-side");
      var res = draft.results[key] || (draft.results[key] = { sa: null, sb: null, w: null });
      var n = el.value === "" ? null : Number(el.value);
      res[side === "a" ? "sa" : "sb"] = Number.isFinite(n) ? n : null;
      markDirty();
      return;
    }
  });

  view.addEventListener("change", function (e) {
    if (e.target.id !== "f-count") return;
    /* An empty or nonsense box read as zero, which clamped to two and threw
       away every name past the second. Put the real number back instead. */
    var raw = String(e.target.value).trim(), n = Number(raw);
    if (!raw || !Number.isFinite(n) || n < MIN_AGENTS) { render(); return; }
    setCount(n);
    render();
  });

  view.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.id === "g-pw" || e.target.id === "g-pw2" || e.target.id === "g-user") {
      e.preventDefault();
      if (document.getElementById("g-pw2")) gateSet();
      else if (MODE === "relay" && !unlocked) relaySignIn();
      else gateIn();
    }
  });

  view.addEventListener("click", function (e) {
    var w = e.target.closest("[data-win]");
    if (w) {
      var key = w.getAttribute("data-win"), side = w.getAttribute("data-side");
      var res = draft.results[key] || (draft.results[key] = { sa: null, sb: null, w: null });
      res.w = side || null;
      if (!side && res.sa == null && res.sb == null) delete draft.results[key];
      markDirty(); render();
      return;
    }
    var drop = e.target.closest("[data-drop]");
    if (drop) {
      if (agentCount(draft) <= MIN_AGENTS) return;
      var di = +drop.getAttribute("data-drop");
      /* Once scores exist, removing a seed shifts everyone below it onto
         someone else's results. Ask first. */
      if (hasResults(draft) && !drop.getAttribute("data-sure")) {
        confirming = "drop-" + di; render(); return;
      }
      confirming = "";
      draft.seeds.splice(di, 1);
      draft.rounds = roundsFor(agentCount(draft), draft.rounds);
      draft = normalize(draft);
      markDirty(); render();
      return;
    }
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act");
    if (act === "add") { setCount(agentCount(draft) + 1); render(); return; }
    if (act === "cancel") { confirming = ""; gateMsg = ""; render(); return; }
    if (act === "reset") { confirming = "reset"; render(); return; }
    if (act === "reset-yes") { draft.results = {}; confirming = ""; markDirty(); render(); return; }
    if (act === "reset-all") { confirming = "reset-all"; render(); return; }
    if (act === "reset-all-yes") {
      /* Scores, winners and advances go; the roster and its order stay.
         roundsFor with nothing to keep regenerates the week labels too. */
      draft.results = {};
      draft.rounds = roundsFor(agentCount(draft));
      confirming = ""; markDirty(); render(); return;
    }
    if (act === "revert" || act === "take-remote") {
      draft = clone(served); dirty = false; confirming = ""; remoteChanged = false; render(); return;
    }
    if (act === "save") { save(); return; }
    if (act === "gate-set") { gateSet(); return; }
    if (act === "gate-relay") { relaySignIn(); return; }
    if (act === "gate-in") { gateIn(); return; }
    if (act === "gate-change") { confirming = "gate"; gateMsg = ""; render(); return; }
    if (act === "gate-lock") { unlocked = false; render(); return; }
    if (act === "relay-out") {
      setRelayToken(""); unlocked = false; canEdit = false;
      draft = clone(served); dirty = false; render(); return;
    }
  });

  /* Retyping a name changes it everywhere it is shown. Patch those spots in
     place rather than re-rendering, so the field keeps focus. */
  function syncNames() {
    var t = draft, count = agentCount(t);
    var sides = view.querySelectorAll(".mside"), i = 0;
    for (var r = 0; r < roundsOf(count); r++) {
      for (var m = 0; m < cardsIn(count, r); m++) {
        var c = competitors(t, r, m);
        for (var s = 0; s < 2; s++) {
          var el = sides[i++];
          if (!el) return;
          var L = slotLabel(t, c[s]), nmEl = el.querySelector(".nm");
          nmEl.innerHTML = slotInner(L);
          nmEl.className = "nm" + (L.cls ? " " + L.cls : "");
        }
      }
    }
  }

  /* ------------------------------------------------------------------- store */

  function save() {
    if (saving) return;
    if (MODE === "artifact" && !dbRef) return;
    saving = true; render();
    var payload = clone(draft);
    payload.updatedAt = new Date().toISOString();
    (MODE === "relay" ? relaySave(payload) : dbRef.set(payload)).then(function () {
      /* The artifact store pushes the new version back through onSnapshot.
         The relay does not, so adopt what we just wrote rather than leave
         the draw sheet a minute behind the control room. */
      if (MODE === "relay") { served = normalize(payload); draft = clone(served); }
      saving = false; dirty = false; confirming = ""; remoteChanged = false;
      setFlash("Saved — every open board now shows this.");
      render();
    }).catch(function (err) {
      saving = false;
      /* An expired token drops the control room back to the sign-in screen,
         which has no save bar -- so the reason has to be put where the
         person is about to be looking, or they are bounced out in silence.
         The draft is untouched and still dirty, so nothing typed is lost. */
      if (err && err.code === "signed_out") {
        gateMsg = err.message; render(); return;
      }
      setFlash(err && (err.code === "invalid_argument" || err.code === "signed_out")
        ? ((err && err.message) || "That save was refused. Your account may not have editing rights on this board.")
        : "Could not save: " + ((err && err.message) || "the store did not answer") + ".");
      render();
    });
  }

  render();

  (async function boot() {
    if (MODE === "relay") {
      await relayLoad();
      /* No token is carried across a page load, so a fresh view always
         starts signed out and the control room always asks. */
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
      setInterval(function () { relayLoad(); }, POLL_MS);
      render();
      return;
    }

    var api = window.claude;
    if (!api || typeof api.use !== "function") { dbDown = true; render(); return; }

    try {
      var u = await api.use("user");
      if (u) {
        var ce = null;
        try { ce = typeof u.canEdit === "function" ? await u.canEdit() : null; }
        catch (e2) { ce = null; }
        /* null means the platform did not say, which is not the same as no.
           Requiring a literal true hid the control room from the owner on
           any view where that answer did not arrive -- and the lock and the
           server's own rules already decide who may save anything. */
        canEdit = ce !== false;
      }
    } catch (e) { /* no user service: stay a read-only board */ }

    var db = null;
    try { db = await api.use("db"); } catch (e) {}
    if (!db) { dbDown = true; render(); return; }

    dbRef = db.doc(DOC);
    dbRef.onSnapshot(function (snap) {
      var next = snap.exists ? normalize(snap.data()) : blank(16);
      /* A save writes the whole tournament, so an unsaved draft would quietly
         flatten whatever someone else just posted. Say so instead. */
      var moved = JSON.stringify(next) !== JSON.stringify(served);
      served = next;
      if (!dirty) { draft = clone(served); remoteChanged = false; }
      else if (moved) remoteChanged = true;
      render();
    }, function () {
      dbDown = true; render();
    });

    /* Only an editor can read the lock at all -- the rules hide it from
       everyone else, so there is nothing for an agent to grind against. */
    if (canEdit) {
      gateRef = db.doc(GATE);
      gateRef.onSnapshot(function (snap) {
        var d = snap.exists ? snap.data() : null;
        gate = (d && typeof d.user === "string" && typeof d.hash === "string" &&
                typeof d.salt === "string") ? d : null;
        if (!gate) unlocked = false;
        gateKnown = true;
        render();
      }, function () { gateKnown = true; render(); });
    } else {
      gateKnown = true;
    }

    render();
  })();
})();
</script>
